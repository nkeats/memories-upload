<!--
  agree.html?p=<person token> - ONE PERSON IN A REACTION VIDEO SAYS YES FOR THEMSELVES (Nigel 4 Oct: "we need to be compliant").
  The customer typed the first name of everyone in the video and sent each person their own link; we never have anyone else's
  email or phone. This page: the video, the offer's words (the server's versioned copy - the same the customer saw), the person
  types their first name and ticks "I'm 18 or over" and the licence; later the same link withdraws (two steps).
  The 'consent' edge function (Song/consent-v1.ts): view / agree / withdraw. The video reaches review, the ad library and the 20%

<style>
:root{--ink:#0C0D10;--panel:#15171C;--line:#2A2E37;--l2:#3C414C;--fg:#F4F1EA;--fg2:#9BA0AB;--fg3:#6B707A;--brass:#D4A24C;--red:#B4543A}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:"Public Sans",sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:"Newsreader",serif;font-weight:300;font-size:clamp(28px,7vw,36px);margin:6px 0 10px;line-height:1.18}
p{line-height:1.6}.lede{color:var(--fg2);font-size:16.5px}
video{width:100%;border-radius:10px;background:#000;display:block;margin:10px 0 16px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px 18px;margin:0 0 18px}
ol{padding-left:20px;margin:8px 0}li{margin:0 0 8px;line-height:1.55;color:var(--fg2)}li b{color:var(--fg)}
label.tick{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;margin:12px 0;cursor:pointer}
label.tick input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--brass)}
input.t{width:100%;max-width:320px;background:var(--ink);border:1px solid var(--l2);border-radius:8px;color:var(--fg);font:inherit;padding:11px 12px}
button{font:inherit;font-size:17px;border-radius:8px;padding:12px 18px;cursor:pointer;margin:6px 8px 6px 0}
.go{background:var(--brass);border:1px solid var(--brass);color:#20180A;font-weight:600}.go:disabled{opacity:.4;cursor:default}
.quiet{background:none;border:1px solid var(--line);color:var(--fg)}.warn{background:none;border:1px solid var(--red);color:#F1B8A8}
.ok{color:#9CCBA6}.err{color:#F1B8A8}
</style>

<style id="preview-warm">
/* 11 Oct PREVIEW - the warm, light look (pipeline/make_preview_pages.py). Contrast >= 7:1, body text >= 18 px, targets >= 44 px. */
:root{--ink:#FBF6EC;--panel:#FFFDF8;--p2:#F3EBDC;--line:#CDBB9A;--l2:#A8926B;--fg:#1F1A12;--fg2:#3F3628;--fg3:#4E4434;
  --brass:#D4A24C;--green:#2A5234;--red:#7A2812;--goldtext:#5A3B06;--goldsoft:#F6E7C4;--goldline:#A87A22}
html,body{background:var(--ink)!important;color:var(--fg)!important}
body{font-size:18px!important;line-height:1.55}
p,li,label,dd,dt,td,th,blockquote,textarea,select,input,.lede,.do,.small,.err,.hint,.note,.said,.fqhint{font-size:18px!important}
h1,h2,h3,h4{color:var(--fg)!important}
.small,.hint,.fqhint{color:var(--fg2)!important}
.err,.fqerr,[role=alert]{color:var(--red)!important}
.ok,.done{color:var(--green)!important}
a{color:var(--goldtext)!important;text-decoration:underline!important;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px!important}
/* every button is a gold box: main actions filled gold, the rest gold-bordered on pale gold */
button,.b,.chip,.quiet,input[type=button],input[type=submit]{min-height:44px!important;min-width:44px!important;font-size:18px!important;
  background:var(--goldsoft)!important;color:var(--fg)!important;border:2px solid var(--goldline)!important;border-radius:10px!important;
  padding:10px 16px!important;cursor:pointer;font-weight:600}
button.go,button.yes,button.big,button.b.yes,#go,#open,#fqnext,#tosort,#send,#allinYes,#rpick,.acts .yes{background:var(--brass)!important;
  color:#1F1A12!important;border-color:var(--goldline)!important}
button[aria-pressed=true]{background:var(--brass)!important;color:#1F1A12!important}
button:disabled{opacity:.55}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--goldline)!important;outline-offset:2px}
input[type=text],input[type=email],input:not([type]),textarea,select{background:#fff!important;color:var(--fg)!important;
  border:2px solid var(--l2)!important;min-height:48px;border-radius:8px}
input::placeholder,textarea::placeholder{color:#6A5E4C!important;opacity:1}
input[type=checkbox],input[type=radio]{width:26px!important;height:26px!important;accent-color:var(--goldline)}
label.tick,label:has(> input[type=checkbox]),label:has(> input[type=radio]){min-height:44px;display:flex!important;align-items:center;gap:10px}
.card,.box,.person,.c,.sheet .in,.in{background:var(--panel)!important;border-color:var(--line)!important;color:var(--fg)}
.c img,.lo img,.side img,.dup img,figure img,.photo img,.strip img,.ph,video{box-shadow:0 1px 3px rgba(60,40,10,.28),0 0 0 1px #E2D3B6;border-radius:6px}
#nav,.nav{background:var(--panel)!important;border-color:var(--line)!important;color:var(--fg)!important}
/* 12 Oct: EVERY label at least 18 px (Nigel) - captions, counters, tallies, section names, the drop zone's line */
.tag,.chk,.stamp,.step,.n,.badge,.tally,.tally *,.drop span,summary,.tips summary,h3,h4,.meta,.count,small{font-size:18px!important}
.n{width:auto!important;min-width:32px;height:32px!important;padding:0 6px}
/* 13 Oct: the "checking" badge sits on the photo's top-left corner, clear of the date under it (at 18 px it covered the date) */
.c .chk{top:6px!important;bottom:auto!important;left:6px!important}
/* 12 Oct: every clickable thing is a gold box (Nigel: "text they can click on needs to have something saying click") -
   the photo drop zone is a gold button like every other action; the "What helps" opener, tick boxes' labels, genre cards and
   group boxes are gold-bordered */
.drop{background:var(--goldsoft)!important;border:2px solid var(--goldline)!important;border-radius:12px!important}
.drop:hover,.drop.over{background:var(--brass)!important}
.drop b{color:var(--fg)!important;font-weight:700}
summary,.tips summary{background:var(--goldsoft)!important;border:2px solid var(--goldline)!important;border-radius:10px;
  padding:10px 14px!important;min-height:44px;display:flex;align-items:center;color:var(--fg)!important}
label.tick,.cbox,.genre,.bg{border:2px solid var(--goldline)!important;border-radius:10px;padding:8px 12px}
.goldnote{background:var(--goldsoft);border:2px solid var(--goldline);border-radius:10px;padding:10px 14px;margin:0 0 16px;
  font-size:18px;color:var(--fg)}
</style>

<script id="preview-base">
/* 11 Oct PREVIEW: served from .../preview/, every link the page builds stays inside .../preview/ */
function __pv(b){ try{ return (b&&/\/preview\/[^/]*$/.test(location.pathname))?String(b).replace(/\/?$/,'/')+'preview/':b; }catch(e){ return b; } }
</script>

<script id="preview-note">
/* 11 Oct PREVIEW: the first time on this page, one line saying what a gold box is - "tap" on a touch screen, "click" on a
   computer, both when the page can't tell. */
(function(){
  var key='mf_goldnote_'+(location.pathname.split('/').pop()||'index.html');
  try{ if(localStorage.getItem(key)) return; }catch(e){}
  var coarse=false, fine=false;
  try{ coarse=matchMedia('(pointer:coarse)').matches; fine=matchMedia('(pointer:fine)').matches; }catch(e){}
  var how=(coarse&&!fine)?'tap it.':(fine&&!coarse)?'click it.':'tap it (or click it on a computer).';
  function show(){
    if(document.getElementById('goldnote')) return;
    var p=document.createElement('p'); p.id='goldnote'; p.className='goldnote';
    p.textContent='Anything in a gold box is a button - '+how;
    var w=document.querySelector('.wrap')||document.body; w.insertBefore(p,w.firstChild);
    try{ localStorage.setItem(key,'1'); }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',show); else show();
})();
</script>
<script id="a11y-focus">
/* 20 Oct (WCAG 2.2 AA - focus order 2.4.3, status messages 4.1.3; the US launch): when a screen is redrawn and the control that
   had the focus has gone, the focus moves to the new screen's heading - not lost to the top of the page - so a screen reader
   reads the new screen. Only when the heading is new (a screen that redraws itself is not read again), and never while the
   focus is still on something. */
(function(){
  var last='';
  function root(){ return document.getElementById('stage')||document.querySelector('.wrap'); }
  function fix(){
    var a=document.activeElement; if(a&&a!==document.body&&document.contains(a)) return;
    var st=root(), h=st&&st.querySelector('h1,h2'); if(!h) return;
    var t=(h.textContent||'').trim(); if(!t||t===last) return; last=t;
    if(!h.hasAttribute('tabindex')) h.setAttribute('tabindex','-1');
    try{ h.focus({preventScroll:true}); }catch(e){}
  }
  function start(){ var st=root(); if(!st||!window.MutationObserver) return; var tm=null;
    new MutationObserver(function(){ clearTimeout(tm); tm=setTimeout(fix,80); }).observe(st,{childList:true}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
<style id="a11y-focus-style">h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}</style>
</head>
<body>
<div class="wrap" id="stage"><p class="lede">One moment…</p></div>
<script>
const SB='https://wkgkkxeooldeyzjfzmhu.supabase.co';
const KEY='sb_publishable_0HpiB8JZzbOq3Vd9lRjuXg_V_4jQnp_';
const P=(new URLSearchParams(location.search).get('p')||'').toLowerCase().replace(/[^0-9a-f]/g,'').slice(0,64);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let V=null, WD=0, BUSY=false;
async function call(action,extra){
  const r=await fetch(`${SB}/functions/v1/consent`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
    body:JSON.stringify({p:P,action,...(extra||{})})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function paint(){
  const w=V.words||{}, s=$('stage');
  if(V.video_gone&&!V.agreed){ s.innerHTML=`<h1>This video has been deleted</h1><p class="lede">Nothing from it will be used. Thank you.</p>`; return; }
  let h=`<h1>Hello ${esc(V.first_name)}</h1>`;
  if(V.video_url) h+=`<video id="vid" controls playsinline preload="metadata" src="${esc(V.video_url)}"></video>`;
  if(V.withdrawn){ s.innerHTML=h+`<p id="state">You withdrew your yes. The video is out of our ad library and will be out of any running ads within 30 days. Thank you for letting us know.</p>`; return; }
  if(V.agreed){
    h+=`<p class="ok" id="state">Thank you — you said yes.</p><p class="lede">${esc(w.withdraw||'')}</p>`;
    h+=WD===0?`<p><button class="warn" id="wd1" type="button">Withdraw my yes</button></p>`
      :`<div class="box" id="wd"><p>We'll stop using the video: out of our ad library now, and out of any running ads within 30 days. This can't be undone.</p>
         <p><button class="quiet" id="wdno" type="button">Keep my yes</button><button class="warn" id="wd2" type="button">Yes, withdraw</button> <span id="wdmsg" role="status"></span></p></div>`;
    s.innerHTML=h; return;
  }
  h+=`<p class="lede">Someone filmed you watching their film, and would like to share the video with Sing Me A Memory. Here is what that means - it's your choice.</p>
    <div class="box" id="words"><p><b>${esc(w.headline||'')}</b></p><ol>${(w.steps||[]).map(x=>`<li><b>${esc(x.title)}</b> ${esc(x.text)}</li>`).join('')}</ol>
    <p class="lede">${esc(w.agreeing||'')}</p><p class="lede">${esc(w.withdraw||'')}</p><p class="lede">${esc(w.timeout||'')}</p></div>
    <div class="box" id="form"><p style="margin:0 0 8px"><label for="tname">Your first name</label></p><input class="t" id="tname" maxlength="40" autocomplete="given-name" value="">
      <label class="tick"><input type="checkbox" id="adult"> <span>${esc(w.person_adult||"I'm 18 or over.")}</span></label>
      <label class="tick"><input type="checkbox" id="lic"> <span>${esc(w.person_licence||'')}</span></label>
      <p><button class="go" id="yes" type="button" disabled>I agree</button> <span id="msg" role="status"></span></p>
      <p class="lede" style="font-size:15px">If you'd rather not, just close this page. Nothing is used unless everyone in the video says yes.</p></div>`;
  s.innerHTML=h; ready();
}
function ready(){ const b=$('yes'); if(!b) return; b.disabled=BUSY||!(($('tname').value||'').trim()&&$('adult').checked&&$('lic').checked); }
document.addEventListener('input',ready); document.addEventListener('change',ready);
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  try{
    if(t.id==='yes'){ BUSY=true; ready(); $('msg').textContent='One moment…';
      await call('agree',{typed_name:$('tname').value.trim(),adult:$('adult').checked,licence:$('lic').checked,version:V.version});
      V.agreed=true; BUSY=false; paint(); window.scrollTo(0,0); }
    if(t.id==='wd1'){ WD=1; paint(); }
    if(t.id==='wdno'){ WD=0; paint(); }
    if(t.id==='wd2'){ t.disabled=true; await call('withdraw'); V.withdrawn=true; WD=0; paint(); }
  }catch(e){ BUSY=false; ready(); const m=$(t.id==='wd2'?'wdmsg':'msg'); if(m){ m.textContent=/changed/.test(e.message)?'The words have changed - please reload this page.':'That didn’t go through. Please try again.'; m.className='err'; } }
});
(async()=>{
  if(P.length!==64){ $('stage').innerHTML='<p class="lede">This link doesn’t work. Please ask the person who sent it.</p>'; return; }
  try{ V=await call('view'); paint(); }
  catch(e){ $('stage').innerHTML='<p class="lede">This link doesn’t work. Please ask the person who sent it.</p>'; }
})();
</script>
