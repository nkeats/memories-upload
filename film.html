<!--
  film.html?t=<the film owner's token> - THE DELIVERY PAGE (3 Oct 2026, Nigel). Until today the customer's journey ended at
  "submitted" (index.html showThanks) and a finished film was only ever a file on the PC: nothing showed it to the customer.
  get_delivery(p_token) -> {film_ready, review_url, referral:{code, link}, ads_consent, reaction:{sent}, export:{status, url,
  expires_at}, erasure:{status}}; the film's signed link and the reaction video's upload link come from the 'delivery' edge function
  (server-wanted, source beside server-wanted-2026-10-03.sql). Every server call answers HTTP 200 with {"error": ...} on a refusal.
  REVIEW (the law, not a style): the SAME request to EVERY customer - never asked only of the happy ones (review gating: unlawful
  under the Australian Consumer Law, and Google forbids it), never paid for or rewarded; shown only when review_url (app_config) is
  set. The private note beside it is extra, never instead.
  REFERRAL: their own code and link, which THEY share (text, WhatsApp, their own email). We never collect a friend's address and
  never email a friend (the Spam Act 2003). Who referred whom is recorded by record_referral; discounts are the checkout's, later.
  REACTION VIDEO: optional; used in advertising ONLY if they agreed at upload (consent ads_reaction_video) - the page says which.
  YOUR DATA: download all of it (request_export -> a zip link for 7 days), or delete all of it (request_erasure, two steps, in
  plain words that it cannot be undone). Linked from the customer's own page too (index.html "Your data").
  4 Oct (Nigel): HOW LONG WE KEEP IT, said plainly in "Your data": photos, answers and working files 90 days after delivery; the
  film and its words 12 months after delivery (get_delivery.retention {working_days, film_months} - the numbers are the server's,
  the same as pipeline/retention.json; a test holds them equal); with the dates when the film has been delivered.
  4 Oct (Nigel): CHILDREN IN REACTION VIDEOS are never used in advertising. Before the file is chosen: "Does anyone under 18
  appear in it?" Yes / No. The answer goes with reaction_done (child_present true / false / null when unanswered); the server
  (delivery v2 + a trigger on reaction_videos) records ad_use_allowed = false unless the advertising consent is given AND the
  answer is No. Shown only when the server says it asks (get_delivery.reaction.asks_child) - until then the page is as before.
  5 Oct (Nigel: the 20% is ONLY for videos we can use in advertising): the reaction video is now ONE SEPARATE, OPTIONAL OFFER -
  "Share your reaction and get 20% off your next film" - and nothing else (no private upload, no up-front advertising tick).
  "No thanks" changes nothing. Saying yes needs: the licence ticked (24 months, our marketing in any media, we may edit/crop it, no
  payment but the credit), "no one under 18 appears" ticked, the first name of every adult in it, and "each of them agreed" ticked -
  the file button stays off until all of that is there. The words are the SERVER's (get_delivery.reaction.ads_offer.words, version
  sent back with the release - delivery v3 stores its own copy and refuses an older version). The video then waits "to review";
  Nigel approves (credit recorded) or declines (the reason shows here, and they may send another). Approved or waiting: "Withdraw"
  (two steps, rpc withdraw_reaction) - out of the ad library at once, out of running ads within 30 days, the discount stays.
  No offer from the server (get_delivery before server-wanted-2026-10-05) = no reaction box at all.
  6 Oct (Nigel): EACH ADULT AGREES FOR THEMSELVES. With the server's offer version 2026-10-06.1 (words.steps present) the offer
  shows Nigel's four steps; the customer types everyone's first name, ticks that everyone is 18 or over, the terms as the one
  sending it, and that they will send each person their own link. After the upload: "Waiting for everyone's yes" with each
  person's status and their private link (agree.html?p=...) to copy or share - nothing reaches review until everyone has said yes.
  The older words (05) still render as before until the server changes.
  6 Oct (Nigel): CREDITS EXPIRE 24 months after they are earned - the date is shown with the discount.
  6 Oct (Nigel): SHARE WITH FAMILY - a WATCH-ONLY link (watch.html?s=...): rpc create_share_link (the same link until stopped),
  copy or the phone's share sheet; "Stop sharing" (rpc stop_sharing) ends it at once; sharing again makes a new link. Shown only
  when the server has it (get_delivery.share). The owner's own link is never the one shared.
-->

<script id="preview-note">
/* 11 Oct PREVIEW: the first time on this page, one line saying what a gold box is - "tap" on a touch screen, "click" on a
   computer, both when the page can't tell. */
(function(){
  var key='mf_goldnote_'+(location.pathname.split('/').pop()||'index.html');
  try{ if(localStorage.getItem(key)) return; }catch(e){}
  var coarse=false, fine=false;
  try{ coarse=matchMedia('(pointer:coarse)').matches; fine=matchMedia('(pointer:fine)').matches; }catch(e){}
  var how=(coarse&&!fine)?'tap it.':(fine&&!coarse)?'click it.':'tap it (or click it on a computer).';
  function show(){
    if(document.getElementById('goldnote')) return;
    var p=document.createElement('p'); p.id='goldnote'; p.className='goldnote';
    p.textContent='Anything in a gold box is a button - '+how;
    var w=document.querySelector('.wrap')||document.body; w.insertBefore(p,w.firstChild);
    try{ localStorage.setItem(key,'1'); }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',show); else show();
})();

<script id="a11y-focus">
/* 20 Oct (WCAG 2.2 AA - focus order 2.4.3, status messages 4.1.3; the US launch): when a screen is redrawn and the control that
   had the focus has gone, the focus moves to the new screen's heading - not lost to the top of the page - so a screen reader
   reads the new screen. Only when the heading is new (a screen that redraws itself is not read again), and never while the
   focus is still on something. */
(function(){
  var last='';
  function root(){ return document.getElementById('stage')||document.querySelector('.wrap'); }
  function fix(){
    var a=document.activeElement; if(a&&a!==document.body&&document.contains(a)) return;
    var st=root(), h=st&&st.querySelector('h1,h2'); if(!h) return;
    var t=(h.textContent||'').trim(); if(!t||t===last) return; last=t;
    if(!h.hasAttribute('tabindex')) h.setAttribute('tabindex','-1');
    try{ h.focus({preventScroll:true}); }catch(e){}
  }
  function start(){ var st=root(); if(!st||!window.MutationObserver) return; var tm=null;
    new MutationObserver(function(){ clearTimeout(tm); tm=setTimeout(fix,80); }).observe(st,{childList:true}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>

<script>
const SB='https://wkgkkxeooldeyzjfzmhu.supabase.co';
const KEY='sb_publishable_0HpiB8JZzbOq3Vd9lRjuXg_V_4jQnp_';
const HDR={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};
const TOKEN=new URLSearchParams(location.search).get('t')||'';
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function rpc(name,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:HDR,body:JSON.stringify(args)});
  if(!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function fn(action,extra){
  const r=await fetch(`${SB}/functions/v1/delivery`,{method:'POST',headers:HDR,body:JSON.stringify({token:TOKEN,action,...(extra||{})})});
  let j={}; try{ j=await r.json(); }catch(_){}
  if(!r.ok||j.error) throw new Error(j.error||('delivery: HTTP '+r.status));
  return j;
}
function report(what,e){
  try{ fetch(SB+'/functions/v1/flow',{method:'POST',keepalive:true,headers:HDR,body:JSON.stringify({token:TOKEN,action:'report_error',
    page:'film.html',at:what,what,message:(e&&e.message)||String(e||''),url:location.href,user_agent:navigator.userAgent})}).catch(()=>{}); }catch(_){}
}
window.addEventListener('error',ev=>report('uncaught',ev.error||ev.message));
window.addEventListener('unhandledrejection',ev=>report('unhandled promise',ev.reason));

let D=null, FILM=null, ERASE_STEP=0, SHARE_STEP=0, SITE_BASE=null;
try{ rpc('get_start_config').then(c=>{ if(c&&__pv(c.site_base_url)) SITE_BASE=String(__pv(c.site_base_url)).replace(/\/?$/,'/'); }).catch(()=>{}); }catch(_){}
const pageUrl=(page,q)=>(SITE_BASE||new URL('.',location.href).href)+page+'?'+q;
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});

function paint(){
  let h='';
  if(D.erasure&&D.erasure.status&&D.erasure.status!=='none'){
    $('stage').innerHTML=`<h1>Your film is being deleted</h1><p class="lede">You asked us to delete everything. It is being removed now, and this link will stop working. Thank you for making it with us.</p>`;
    return;
  }
  if(D.film_ready){
    h+=`<h1>Your film</h1>${FILM?`<video id="film" controls playsinline preload="metadata" src="${esc(FILM.url)}"></video>
        <a class="b go" href="${esc(FILM.download||FILM.url)}" download>Download your film</a>`:`<p class="lede">Getting your film ready to play…</p>`}`;
    // REVIEW - the same words, the same link, for everyone; hidden while there is no link
    if(D.review_url) h+=`<div class="box" id="review"><h2>Would you tell others about it?</h2>
        <p class="lede">If you have a moment, a review helps other families find us.</p>
        <a class="b" id="reviewlink" href="${esc(D.review_url)}" target="_blank" rel="noopener">Leave a review</a></div>`;
    h+=shareHTML();
    h+=`<div class="box" id="feedback"><h2>Anything you’d like to tell us?</h2>
        <p class="lede">This goes only to us.</p>
        <textarea id="fbtext" maxlength="2000" aria-label="Anything you’d like to tell us" placeholder="Something you loved, or something we could do better"></textarea>
        <p><button class="b" id="fbsend">Send</button> <span id="fbmsg" role="status"></span></p></div>`;
    // REFERRAL - theirs to share; we never contact anyone
    if(D.referral&&D.referral.code) h+=`<div class="box" id="referral"><h2>Make one for someone you love</h2>
        <p class="lede">Share your own link with family or friends — by text, WhatsApp or your own email. We never contact them.</p>
        <p>Your code: <span class="code" id="refcode">${esc(D.referral.code)}</span></p>
        ${D.referral.link?`<p class="small" id="reflink">${esc(D.referral.link)}</p>
        <button class="b" id="refcopy">Copy the message</button><button class="b" id="refshare">Share</button> <span id="refmsg" role="status"></span>`:''}</div>`;
    h+=reactionHTML();
  }else{
    h+=`<h1>Your film</h1><p class="lede">Your film isn’t ready yet. We’ll let you know when it is.</p>`;
  }
  h+=`<div class="box" id="data">${backHTML('databack1')}<h2>Your data</h2>
      <p class="lede">Everything you gave us and everything we made from it is yours.</p>
      ${keepHTML()}
      ${dataHTML()}${backHTML('databack2')}</div>`;
  $('stage').innerHTML=h;
  const f=$('rfile'); if(f){ f.addEventListener('change',sendReaction); offerReady(); }
}
/* 4 Oct: how long we keep it - the server's numbers (get_delivery.retention), with dates once the film is delivered */
/* 15 Oct (Nigel): "Your data" needs a clear way back - top and bottom. Back to where they came from: their own page
   (index.html) when they came from there; otherwise the top of this page when the film is here, else their own page. */
function cameFrom(){
  try{ const r=new URL(document.referrer); return r.origin===location.origin&&/\/index\.html$/.test(r.pathname)?r.href:''; }catch(e){ return ''; }
}
function backHTML(id){
  const from=cameFrom();
  const href=from||(D&&D.film_ready?'#top':`index.html?t=${encodeURIComponent(TOKEN)}`);
  return `<div class="backrow"><a class="b back" id="${id}" href="${esc(href)}">← Back to my film</a></div>`;
}
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a.back'); if(!a) return;
  if(a.getAttribute('href')==='#top'){ e.preventDefault(); history.replaceState(null,'',location.pathname+location.search); window.scrollTo(0,0); }
});
function keepHTML(){
  const r=D.retention; if(!r||!r.working_days||!r.film_months) return '';
  const fmt=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  let w='', f='';
  if(D.delivered_at){
    const d=new Date(D.delivered_at), wd=new Date(d.getTime()+r.working_days*86400000), fd=new Date(d);
    fd.setMonth(fd.getMonth()+r.film_months);
    w=` (on ${fmt(wd)})`; f=` (on ${fmt(fd)})`;
  }
  return `<p class="lede" id="keep">We delete your photos, your answers and our working files ${r.working_days} days after we deliver your film${w}.
    We keep your finished film and its words for ${r.film_months} months after delivery, so you can come back for them${f}, and then we delete those too.
    You can delete everything sooner, at any time, below.</p>${r.reaction_licence_months?`
    <p class="lede" id="keepreaction">If you share a reaction video: if we don’t approve it, we delete it with your photos, ${r.working_days} days after delivery.
    If we approve it, we keep it for the ${r.reaction_licence_months} months of your licence and then delete it. If you withdraw it, we delete it ${r.reaction_takedown_days||30} days later -
    the time we need to take it out of any running ads.${r.reaction_consent_days?` If someone in it doesn’t say yes within ${r.reaction_consent_days} days, we delete it then.`:''} Deleting everything below deletes it straight away.</p>`:''}`;
}
function dataHTML(){
  const ex=D.export||{};
  let h=ex.status==='ready'&&ex.url?`<p><a class="b" href="${esc(ex.url)}" id="exlink">Download all my data</a></p>
        <p class="small">A zip of your photos, your answers, the words, the song and the film. This link works until ${esc(new Date(ex.expires_at).toLocaleDateString(undefined,{day:'numeric',month:'long'}))}.</p>`
    : ex.status==='requested'?`<p class="ok" id="exwait">We’re putting your download together - it will appear here, usually within the hour.</p>`
    : `<p><button class="b" id="exask">Download all my data</button></p>`;
  if(ERASE_STEP===0) h+=`<p><button class="b warn" id="er1">Delete everything</button></p>`;
  else if(ERASE_STEP===1) h+=`<div id="er"><p><b>This deletes your film and everything you gave us</b> - your photos, your answers, the words, the song and the film - from everywhere we keep them. <b>It cannot be undone.</b> If you want a copy, download your data first.</p>
      <p><button class="b" id="erno">Keep everything</button><button class="b warn" id="er2">Yes, I understand - continue</button></p></div>`;
  else h+=`<div id="er"><p>Last step. Type <b>DELETE</b> below and press the button. Once you do, it’s gone.</p>
      <input id="ertype" autocomplete="off" aria-label="Type DELETE to confirm" style="font:inherit;font-size:18px;padding:10px;border-radius:8px;border:1px solid var(--red);background:var(--ink);color:var(--fg)">
      <p><button class="b" id="erno">Keep everything</button><button class="b warn" id="er3" disabled>Delete everything now</button> <span id="ermsg" role="status"></span></p></div>`;
  return h;
}
/* 5 Oct: THE "SHARE YOUR REACTION" OFFER - separate, optional; the server's words; a full release before the file can be chosen */
let OFFER_OPEN=false, NAMES=[''], WD_STEP=0, RSENDING=false;
function reactionHTML(){
  const R=D.reaction||{}, o=R.ads_offer, st=R.status;
  if(!o&&!st) return '';                                         // no offer from the server: no reaction box at all
  const w=(o&&o.words)||{};
  let h=`<div class="box" id="reaction"><h2>Share your reaction</h2>`;
  const until=R.credit_expires_at?` It can be used until ${esc(fmtDate(R.credit_expires_at))}.`:'';
  if(st==='awaiting_consent') h+=`<p class="lede" id="rstate">Thank you — we have your video. Now everyone in it says yes for themselves: send each person their own link below. You’ll see each yes appear here. Nothing is used until everyone has said yes${(D.retention||{}).reaction_consent_days?`, and if someone doesn’t within ${esc(D.retention.reaction_consent_days)} days we delete the video`:''}.</p>`+peopleHTML(R);
  else if(st==='to_review') h+=((R.people||[]).length
      ?`<p class="ok" id="rstate">Thank you — everyone has said yes. We’ll check the video and let you know; the 20% off your next film is added once it’s approved.</p>`+peopleHTML(R)
      :`<p class="ok" id="rstate">Thank you — we have your video. We’ll check it and let you know; the 20% off your next film is added once it’s approved.</p>`);
  else if(st==='approved') h+=`<p class="ok" id="rstate">Approved — thank you. ${R.credit_percent?`You have ${esc(R.credit_percent)}% off your next film.${until}`:'Your video is approved.'}</p>`;
  else if(st==='withdrawn'){ const who=(R.people||[]).filter(p=>p.withdrawn).map(p=>p.first_name);
    h+=`<p class="lede" id="rstate">${who.length?`${esc(who.join(' and '))} withdrew their yes, so we stopped using the video.`:'You withdrew your video.'} We took it out of our ad library straight away, and we’ll take it out of any running ads within ${esc((D.retention||{}).reaction_takedown_days||30)} days.${R.credit_percent?` Your ${esc(R.credit_percent)}% off stays yours.${until}`:''}</p>`; }
  else if(st==='declined') h+=`<p class="lede" id="rstate">We couldn’t use the video you sent: ${esc(R.decline_reason||'')} You’re welcome to send another.</p>`;
  if(R.can_withdraw) h+=withdrawHTML();
  if(o){
    h+=`<p class="lede" id="rhead">${esc(w.headline)}</p>`;
    if(w.steps) h+=`<ol class="steps" id="rsteps">${w.steps.map(x=>`<li><b>${esc(x.title)}</b> ${esc(x.text)}</li>`).join('')}</ol>
        <p class="small">${esc(w.agreeing||'')}</p><p class="small">${esc(w.withdraw||'')}</p><p class="small">${esc(w.timeout||'')}</p>`;
    if(!OFFER_OPEN) h+=`<p><button class="b go" id="ryes" type="button">Yes, I’d like to</button> <span class="small">${esc(w.no_thanks||'')}</span></p>`;
    else if(w.steps){                                              // 6 Oct: each person agrees through their own link
      h+=`<div id="rform">
        <p style="margin:12px 0 6px">${esc(w.names)}</p>
        <div id="rnames">${NAMES.map((n,i)=>`<input class="nm" data-ni="${i}" maxlength="40" autocomplete="off" value="${esc(n)}" aria-label="First name ${i+1}">`).join('')}</div>
        <p><button class="b" id="raddname" type="button">Add another person</button></p>
        <label class="tick"><input type="checkbox" id="rkids"> <span>Everyone in the video is 18 or over, including anyone in the background.</span></label>
        <label class="tick"><input type="checkbox" id="rlic"> <span>I agree to what’s above, as the person sending the video.</span></label>
        <label class="tick"><input type="checkbox" id="rall"> <span>I’ll send each person their own link. The video is only used if everyone says yes.</span></label>
        <p><label class="b go off" id="rpick" aria-disabled="true">Choose the video<input type="file" id="rfile" accept="video/*" disabled hidden></label>
           <button class="b" id="rno" type="button">No thanks</button> <span id="rmsg" role="status"></span></p></div>`;
    }
    else{
      h+=`<div id="rform">
        <label class="tick"><input type="checkbox" id="rlic"> <span>${esc(w.licence)}</span></label>
        <label class="tick"><input type="checkbox" id="rkids"> <span>${esc(w.no_minors)}</span></label>
        <p style="margin:12px 0 6px">${esc(w.names)}</p>
        <div id="rnames">${NAMES.map((n,i)=>`<input class="nm" data-ni="${i}" maxlength="40" autocomplete="off" value="${esc(n)}" aria-label="First name ${i+1}">`).join('')}</div>
        <p><button class="b" id="raddname" type="button">Add another person</button></p>
        <label class="tick"><input type="checkbox" id="rall"> <span>${esc(w.all_agreed)}</span></label>
        <p class="small">${esc(w.review||'')}</p>
        <p><label class="b go off" id="rpick" aria-disabled="true">Choose the video<input type="file" id="rfile" accept="video/*" disabled hidden></label>
           <button class="b" id="rno" type="button">No thanks</button> <span id="rmsg" role="status"></span></p></div>`;
    }
  }
  return h+`</div>`;
}
function peopleHTML(R){
  const ps=R.people||[]; if(!ps.length) return '';
  return `<ul class="people" id="rpeople">${ps.map(p=>{ const link=pageUrl('agree.html','p='+encodeURIComponent(p.token));
    const st=p.withdrawn?'withdrew':p.agreed?'said yes ✓':'waiting';
    return `<li data-person="${esc(p.first_name)}"><b>${esc(p.first_name)}</b> — <span class="pst">${st}</span>${!p.agreed&&!p.withdrawn?`
      <div class="plink">${esc(link)}</div><button class="b" type="button" data-plink="${esc(link)}" data-pname="${esc(p.first_name)}">${navigator.share?'Share':'Copy'} ${esc(p.first_name)}’s link</button>`:''}</li>`; }).join('')}</ul>`;
}
function shareHTML(){
  if(!D.share||!D.film_ready) return '';                          // the server has no share links yet: no box
  const link=D.share.active&&D.share.token?pageUrl('watch.html','s='+encodeURIComponent(D.share.token)):null;
  if(!link) return `<div class="box" id="share"><h2>Share with family</h2><p class="lede">A link that only plays your film — it can’t change anything, see your photos or delete anything. Send it to anyone you like.</p>
    <p><button class="b go" id="sh1" type="button">Share with family</button> <span id="shmsg" role="status"></span></p></div>`;
  return `<div class="box" id="share"><h2>Share with family</h2><p class="lede">Anyone with this link can watch your film — nothing else.</p>
    <div class="plink" id="shlink">${esc(link)}</div>
    <p><button class="b go" id="shcopy" type="button">${navigator.share?'Share the link':'Copy the link'}</button>
    ${SHARE_STEP===0?`<button class="b" id="shstop" type="button">Stop sharing</button>`:`<button class="b warn" id="shstop2" type="button">Yes, stop sharing now</button><button class="b" id="shkeep" type="button">Keep sharing</button>`}
    <span id="shmsg" role="status"></span></p>${SHARE_STEP?'<p class="small">The link stops working straight away. If you share again you get a new link.</p>':''}</div>`;
}
function withdrawHTML(){
  if(WD_STEP===0) return `<p><button class="b warn" id="wd1" type="button">Withdraw my video</button></p>`;
  return `<div id="wd"><p>We’ll stop using your video: out of our ad library now, and out of any running ads within ${esc((D.retention||{}).reaction_takedown_days||30)} days. Your discount stays yours. This can’t be undone.</p>
    <p><button class="b" id="wdno" type="button">Keep it</button><button class="b warn" id="wd2" type="button">Yes, withdraw it</button> <span id="wdmsg" role="status"></span></p></div>`;
}
const NAME_OK=/^\p{L}[\p{L} '’.-]{0,39}$/u;
function cleanNames(){ return NAMES.map(n=>n.trim().replace(/\s+/g,' ')).filter(Boolean); }
function offerReady(){
  const n=cleanNames();
  const ok=!!($('rlic')&&$('rlic').checked&&$('rkids').checked&&$('rall').checked)&&n.length>0&&n.every(x=>NAME_OK.test(x))&&!RSENDING;
  const f=$('rfile'), l=$('rpick'); if(f){ f.disabled=!ok; l.setAttribute('aria-disabled',String(!ok)); l.classList.toggle('off',!ok); }
  return ok;
}
async function sendReaction(ev){
  const file=ev.target.files[0]; if(!file||!offerReady()) return;
  const m=$('rmsg'); m.textContent='Sending…'; m.className=''; RSENDING=true; offerReady();
  try{
    const o=D.reaction.ads_offer;
    const s=await fn('sign_reaction',{filename:file.name,mime:file.type||'video/mp4',size:file.size,
      release:{version:o.version,licence_agreed:true,no_minors:true,all_agreed:true,names:cleanNames()}});
    const put=await fetch(s.signed_url,{method:'PUT',headers:{'Content-Type':file.type||'video/mp4'},body:file});
    if(!put.ok) throw new Error('upload HTTP '+put.status);
    await fn('reaction_done',{path:s.path,release_id:s.release_id});
    const people=Array.isArray(s.people)?s.people.map(p=>({first_name:p.first_name,token:p.token,agreed:false,withdrawn:false})):[];
    D.reaction={...D.reaction,sent:true,status:people.length?'awaiting_consent':'to_review',people,ads_offer:null,can_withdraw:true};
    OFFER_OPEN=false; RSENDING=false; paint();
  }catch(e){ report('reaction',e); RSENDING=false; offerReady(); m.textContent=/offer changed/.test(e.message)?'The offer’s words have changed. Please reload the page.':'That didn’t send. Please try again.'; m.className='err'; }
}
const refMessage=()=>`I made a film of our memories with this - you might like to make one for someone you love. My code: ${D.referral.code}\n\n${D.referral.link}`;
document.addEventListener('change',ev=>{ if(['rlic','rkids','rall'].includes(ev.target.id)) offerReady(); });
document.addEventListener('input',ev=>{ if(ev.target.dataset&&ev.target.dataset.ni!=null){ NAMES[+ev.target.dataset.ni]=ev.target.value; offerReady(); }
  if(ev.target.id==='ertype'){ const b=$('er3'); if(b) b.disabled=ev.target.value.trim().toUpperCase()!=='DELETE'; } });
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  try{
    if(t.id==='sh1'){ t.disabled=true; const r=await rpc('create_share_link',{p_token:TOKEN}); if(!r||r.error) throw new Error((r&&r.error)||'create_share_link');
      D.share={active:true,token:r.token}; paint(); $('share').scrollIntoView({block:'center'}); return; }
    if(t.id==='shcopy'){ const l=$('shlink').textContent; if(navigator.share){ await navigator.share({text:l}); } else { await navigator.clipboard.writeText(l); $('shmsg').textContent='Copied.'; $('shmsg').className='ok'; } return; }
    if(t.id==='shstop'){ SHARE_STEP=1; paint(); return; }
    if(t.id==='shkeep'){ SHARE_STEP=0; paint(); return; }
    if(t.id==='shstop2'){ t.disabled=true; const r=await rpc('stop_sharing',{p_token:TOKEN}); if(!r||r.error) throw new Error((r&&r.error)||'stop_sharing');
      D.share={active:false,token:null}; SHARE_STEP=0; paint(); return; }
    if(t.dataset&&t.dataset.plink){ const l=t.dataset.plink, n=t.dataset.pname;
      if(navigator.share) await navigator.share({text:`${n}, this is the video of us watching the film. Please watch it and say yes or no yourself:\n\n${l}\n`});
      else { await navigator.clipboard.writeText(l); t.textContent='Copied'; } return; }
    if(t.id==='ryes'){ OFFER_OPEN=true; paint(); $('reaction').scrollIntoView({block:'start'}); return; }
    if(t.id==='rno'){ OFFER_OPEN=false; NAMES=['']; paint(); return; }
    if(t.id==='raddname'){ if(NAMES.length<20){ NAMES.push(''); const keep=['rlic','rkids','rall'].map(i=>$(i).checked); paint();
      ['rlic','rkids','rall'].forEach((i,k)=>$(i).checked=keep[k]); offerReady(); const ins=document.querySelectorAll('#rnames .nm'); ins[ins.length-1].focus(); } return; }
    if(t.id==='wd1'){ WD_STEP=1; paint(); return; }
    if(t.id==='wdno'){ WD_STEP=0; paint(); return; }
    if(t.id==='wd2'){ t.disabled=true; const r=await rpc('withdraw_reaction',{p_token:TOKEN}); if(!r||r.error) throw new Error((r&&r.error)||'withdraw_reaction');
      WD_STEP=0; D.reaction={...D.reaction,status:'withdrawn',can_withdraw:false}; paint(); return; }
    if(t.id==='fbsend'){ const v=($('fbtext').value||'').trim(); if(!v) return; t.disabled=true;
      const r=await rpc('send_feedback',{p_token:TOKEN,p_text:v}); if(!r||r.error) throw new Error((r&&r.error)||'send_feedback');
      $('fbtext').value=''; $('fbmsg').textContent='Thank you — we have it.'; $('fbmsg').className='ok'; t.disabled=false; }
    if(t.id==='refcopy'){ await navigator.clipboard.writeText(refMessage()); $('refmsg').textContent='Copied.'; $('refmsg').className='ok'; }
    if(t.id==='refshare'){ if(navigator.share) await navigator.share({text:refMessage()}); else { await navigator.clipboard.writeText(refMessage()); $('refmsg').textContent='Copied.'; } }
    if(t.id==='exask'){ t.disabled=true; const r=await rpc('request_export',{p_token:TOKEN}); if(!r||r.error) throw new Error((r&&r.error)||'request_export');
      D.export={status:'requested'}; paint(); }
    if(t.id==='er1'){ ERASE_STEP=1; paint(); $('er').scrollIntoView({block:'center'}); }
    if(t.id==='erno'){ ERASE_STEP=0; paint(); }
    if(t.id==='er2'){ ERASE_STEP=2; paint(); $('ertype').focus(); }
    if(t.id==='er3'){ t.disabled=true; const r=await rpc('request_erasure',{p_token:TOKEN,p_confirm:'DELETE'});
      if(!r||r.error) throw new Error((r&&r.error)||'request_erasure'); D.erasure={status:'confirmed'}; paint(); window.scrollTo(0,0); }
  }catch(e){ report('click '+t.id,e); t.disabled=false;
    const m=$(t.id==='er3'?'ermsg':t.id==='fbsend'?'fbmsg':t.id==='wd2'?'wdmsg':/^sh/.test(t.id)?'shmsg':'refmsg'); if(m){ m.textContent='That didn’t go through. Please try again.'; m.className='err'; } }
});

(async()=>{
  if(!TOKEN){ $('stage').innerHTML='<p class="lede">This link is missing its code. Please open the link we sent you again.</p>'; return; }
  try{
    D=await rpc('get_delivery',{p_token:TOKEN});
    if(!D||D.error){ $('stage').innerHTML='<p class="lede">We couldn’t find your film from this link. Please open the link we sent you again.</p>'; if(D&&D.error!=='unknown token') report('get_delivery',new Error(D&&D.error)); return; }
    if(D.film_ready){ try{ FILM=await fn('film_url'); }catch(e){ report('film_url',e); } }
    paint();
    if(location.hash==='#data'&&$('data')) $('data').scrollIntoView();
  }catch(e){ report('load',e); $('stage').innerHTML='<p class="lede">Something went wrong opening your film. Please try again in a minute.</p>'; }
})();
</script>
