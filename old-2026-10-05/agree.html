<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="build" content="2026-10-06a">
<title>Your yes for the video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  agree.html?p=<person token> - ONE PERSON IN A REACTION VIDEO SAYS YES FOR THEMSELVES (Nigel 4 Oct: "we need to be compliant").
  The customer typed the first name of everyone in the video and sent each person their own link; we never have anyone else's
  email or phone. This page: the video, the offer's words (the server's versioned copy - the same the customer saw), the person
  types their first name and ticks "I'm 18 or over" and the licence; later the same link withdraws (two steps).
  The 'consent' edge function (Song/consent-v1.ts): view / agree / withdraw. The video reaches review, the ad library and the 20%
  only when EVERY named person has agreed. Test: Song/pipeline/page_tests_06 "AGREE PAGE".
-->
<style>
:root{--ink:#0C0D10;--panel:#15171C;--line:#2A2E37;--l2:#3C414C;--fg:#F4F1EA;--fg2:#9BA0AB;--fg3:#6B707A;--brass:#D4A24C;--red:#B4543A}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:"Public Sans",sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:"Newsreader",serif;font-weight:300;font-size:clamp(28px,7vw,36px);margin:6px 0 10px;line-height:1.18}
p{line-height:1.6}.lede{color:var(--fg2);font-size:16.5px}
video{width:100%;border-radius:10px;background:#000;display:block;margin:10px 0 16px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px 18px;margin:0 0 18px}
ol{padding-left:20px;margin:8px 0}li{margin:0 0 8px;line-height:1.55;color:var(--fg2)}li b{color:var(--fg)}
label.tick{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;margin:12px 0;cursor:pointer}
label.tick input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--brass)}
input.t{width:100%;max-width:320px;background:var(--ink);border:1px solid var(--l2);border-radius:8px;color:var(--fg);font:inherit;padding:11px 12px}
button{font:inherit;font-size:17px;border-radius:8px;padding:12px 18px;cursor:pointer;margin:6px 8px 6px 0}
.go{background:var(--brass);border:1px solid var(--brass);color:#20180A;font-weight:600}.go:disabled{opacity:.4;cursor:default}
.quiet{background:none;border:1px solid var(--line);color:var(--fg)}.warn{background:none;border:1px solid var(--red);color:#F1B8A8}
.ok{color:#9CCBA6}.err{color:#F1B8A8}
</style>
</head>
<body>
<div class="wrap" id="stage"><p class="lede">One moment…</p></div>
<script>
const SB='https://wkgkkxeooldeyzjfzmhu.supabase.co';
const KEY='sb_publishable_0HpiB8JZzbOq3Vd9lRjuXg_V_4jQnp_';
const P=(new URLSearchParams(location.search).get('p')||'').toLowerCase().replace(/[^0-9a-f]/g,'').slice(0,64);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let V=null, WD=0, BUSY=false;
async function call(action,extra){
  const r=await fetch(`${SB}/functions/v1/consent`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
    body:JSON.stringify({p:P,action,...(extra||{})})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function paint(){
  const w=V.words||{}, s=$('stage');
  if(V.video_gone&&!V.agreed){ s.innerHTML=`<h1>This video has been deleted</h1><p class="lede">Nothing from it will be used. Thank you.</p>`; return; }
  let h=`<h1>Hello ${esc(V.first_name)}</h1>`;
  if(V.video_url) h+=`<video id="vid" controls playsinline preload="metadata" src="${esc(V.video_url)}"></video>`;
  if(V.withdrawn){ s.innerHTML=h+`<p id="state">You withdrew your yes. The video is out of our ad library and will be out of any running ads within 30 days. Thank you for letting us know.</p>`; return; }
  if(V.agreed){
    h+=`<p class="ok" id="state">Thank you — you said yes.</p><p class="lede">${esc(w.withdraw||'')}</p>`;
    h+=WD===0?`<p><button class="warn" id="wd1" type="button">Withdraw my yes</button></p>`
      :`<div class="box" id="wd"><p>We'll stop using the video: out of our ad library now, and out of any running ads within 30 days. This can't be undone.</p>
         <p><button class="quiet" id="wdno" type="button">Keep my yes</button><button class="warn" id="wd2" type="button">Yes, withdraw</button> <span id="wdmsg"></span></p></div>`;
    s.innerHTML=h; return;
  }
  h+=`<p class="lede">Someone filmed you watching their film, and would like to share the video with Sing Me A Memory. Here is what that means - it's your choice.</p>
    <div class="box" id="words"><p><b>${esc(w.headline||'')}</b></p><ol>${(w.steps||[]).map(x=>`<li><b>${esc(x.title)}</b> ${esc(x.text)}</li>`).join('')}</ol>
    <p class="lede">${esc(w.agreeing||'')}</p><p class="lede">${esc(w.withdraw||'')}</p><p class="lede">${esc(w.timeout||'')}</p></div>
    <div class="box" id="form"><p style="margin:0 0 8px">Your first name</p><input class="t" id="tname" maxlength="40" autocomplete="given-name" value="">
      <label class="tick"><input type="checkbox" id="adult"> <span>${esc(w.person_adult||"I'm 18 or over.")}</span></label>
      <label class="tick"><input type="checkbox" id="lic"> <span>${esc(w.person_licence||'')}</span></label>
      <p><button class="go" id="yes" type="button" disabled>I agree</button> <span id="msg"></span></p>
      <p class="lede" style="font-size:15px">If you'd rather not, just close this page. Nothing is used unless everyone in the video says yes.</p></div>`;
  s.innerHTML=h; ready();
}
function ready(){ const b=$('yes'); if(!b) return; b.disabled=BUSY||!(($('tname').value||'').trim()&&$('adult').checked&&$('lic').checked); }
document.addEventListener('input',ready); document.addEventListener('change',ready);
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  try{
    if(t.id==='yes'){ BUSY=true; ready(); $('msg').textContent='One moment…';
      await call('agree',{typed_name:$('tname').value.trim(),adult:$('adult').checked,licence:$('lic').checked,version:V.version});
      V.agreed=true; BUSY=false; paint(); window.scrollTo(0,0); }
    if(t.id==='wd1'){ WD=1; paint(); }
    if(t.id==='wdno'){ WD=0; paint(); }
    if(t.id==='wd2'){ t.disabled=true; await call('withdraw'); V.withdrawn=true; WD=0; paint(); }
  }catch(e){ BUSY=false; ready(); const m=$(t.id==='wd2'?'wdmsg':'msg'); if(m){ m.textContent=/changed/.test(e.message)?'The words have changed - please reload this page.':'That didn’t go through. Please try again.'; m.className='err'; } }
});
(async()=>{
  if(P.length!==64){ $('stage').innerHTML='<p class="lede">This link doesn’t work. Please ask the person who sent it.</p>'; return; }
  try{ V=await call('view'); paint(); }
  catch(e){ $('stage').innerHTML='<p class="lede">This link doesn’t work. Please ask the person who sent it.</p>'; }
})();
</script>
</body>
</html>
