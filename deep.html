<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Deep — test bench</title>
<style>
/* A TEST BENCH for the deep engine. Not a screen; nothing here is a design
   decision. One photograph → six questions → done. The only thing judged
   here is whether question three follows from answer two. */
:root{color-scheme:light dark}
body{font:16px/1.45 system-ui,sans-serif;margin:0;padding:12px;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:0 0 8px} h2{font-size:17px;margin:20px 0 6px}
.muted{opacity:.65;font-size:14px}
button{font:inherit;padding:7px 12px;cursor:pointer} button:disabled{opacity:.5;cursor:default}
.run{font-weight:600}
table{border-collapse:collapse;width:100%} td{padding:6px 4px;vertical-align:middle;border-top:1px solid #8884}
td img{width:72px;height:54px;object-fit:cover;display:block;border-radius:3px}
.turn{border:1px solid #8886;border-radius:6px;padding:10px 12px;margin:10px 0}
.turn .lvl{font-size:13px;opacity:.7;margin-bottom:4px}
.turn .q{font-size:18px;margin:2px 0 8px}
.turn .a{white-space:pre-wrap;opacity:.9}
.turn .because{font-size:14px;opacity:.75;font-style:italic}
.done{opacity:.6}
textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;padding:8px}
.err{color:#c33;white-space:pre-wrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.now{background:#8882}
#big{max-width:100%;max-height:50vh;display:block;margin:6px 0}
</style>
</head>
<body>
<h1>Deep — test bench</h1>
<div id="app"><p>Loading…</p></div>

<script type="module">
const SB='https://wkgkkxeooldeyzjfzmhu.supabase.co';
const KEY='sb_publishable_0HpiB8JZzbOq3Vd9lRjuXg_V_4jQnp_';
/* This page is for us: the bench collection's token is baked in. ?t= overrides it. */
const TOKEN=new URLSearchParams(location.search).get('t')||'6a67448d045404e2e6a93c78ac9f0c16ab4c15fa6a76a5c713ed01e894482cd3';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function fn(name,body){
  const r=await fetch(`${SB}/functions/v1/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,...body})});
  let j=null; try{ j=await r.json(); }catch(_){}
  return {ok:r.ok,status:r.status,j:j||{}};
}
async function rpc(name,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:TOKEN,...args})});
  let j=null; try{ j=await r.json(); }catch(_){}
  return {ok:r.ok,status:r.status,j};
}

/* ── the contract ────────────────────────────────────────────────────────
   upload {action:'sign', filename, mime, size, uploaded_by} → {signed_url, asset_id}; PUT; upload {action:'confirm', asset_id}   (the journey's calls)
   describe {}                                     → {described, total, remaining, done, this_call, stalled}                      (until done)
   deep {token, asset_id}                          → {ok, level, stage, turn_id, because_of, question, saw_the_photograph}
                                                     or {ok, waiting:true, detail} while the last one is unanswered            (LIVE)
   deep {token, asset_id, turn_id, answer}         → records the answer, returns the next question   (⚠ the live function doesn't take it yet)
   deep_progress {p_token}                         → [{asset_id, turns, answered, last_level}]        (⚠ not built yet)
   deep_restart  {p_token, p_asset}                → delete from deep_turns where asset_id = p_asset  (⚠ not built yet)
   A missing piece is named on screen, so it never looks like the engine's fault. */

let A=[], prog={}, cur=null, turns=[], busy=false, err='', up=null, scan=null;
const need={progress:false,answer:false};

async function load(){
  const {ok,j}=await fn('flow',{action:'load'});
  if(!ok||!j.assets){ $('app').innerHTML=`<p class="err">Could not load the bench collection: ${esc(JSON.stringify(j))}</p>`; return; }
  A=j.assets.filter(a=>!a.excluded&&a.url).sort((x,y)=>String(y.taken_at||'').localeCompare(String(x.taken_at||''))||(x.sort_index??0)-(y.sort_index??0));
  await readProgress(); paint();
}
async function readProgress(){
  const {ok,j}=await rpc('deep_progress',{});
  need.progress=!ok; prog={};
  if(ok) (Array.isArray(j)?j:(j&&j.rows)||[]).forEach(r=>{ prog[r.asset_id]=r; });
}
function levelsOf(id){
  const p=prog[id]; if(p) return {n:+(p.last_level??p.answered??p.turns)||0,src:''};
  if(cur===id&&turns.length) return {n:Math.max(...turns.map(t=>+t.level||0)),src:' (this session)'};
  return null;
}
function paint(){
  let h='';
  if(cur) h+=runPanel();
  /* the upload: pick → sign/PUT/confirm → describe until done → the list */
  h+=`<h2>Add photographs</h2><div class="bar"><input type="file" id="file" accept="image/*,.heic,.heif" multiple ${busy?'disabled':''}>`;
  if(up) h+=`<span>${esc(up)}</span>`;
  if(scan) h+=`<span>${esc(scan)}</span>`;
  h+='</div>';
  h+=`<h2>Photographs</h2>`;
  if(!A.length) h+='<p class="muted">None yet. Add some above.</p>';
  if(A.length&&need.progress) h+=`<p class="muted">How far each has been through isn’t known — <code>deep_progress {p_token}</code> isn’t on the server yet; only this session’s runs are shown.</p>`;
  h+='<table>';
  A.forEach(a=>{ const l=levelsOf(a.id);
    h+=`<tr class="${cur===a.id?'now':''}"><td><img src="${esc(a.thumb_url||a.url)}" alt=""></td>
      <td>${a.description?esc(a.description.slice(0,80))+(a.description.length>80?'…':''):'<span class="muted">not described yet</span>'}<br><span class="muted">${l?`through level ${l.n}${l.src}`:'not run'}</span></td>
      <td style="white-space:nowrap"><button class="run" data-run="${a.id}" ${busy||!a.description?'disabled':''}>${cur===a.id?'Showing':(l?'Carry on':'Run')}</button>
        ${l?`<button data-restart="${a.id}" ${busy?'disabled':''}>Start again</button>`:''}</td></tr>`; });
  h+='</table>';
  $('app').innerHTML=h;
  const f=$('file'); if(f) f.onchange=()=>upload([...f.files]);
}
function runPanel(){
  const a=A.find(x=>x.id===cur); if(!a) return '';
  const open=turns.length&&!turns[turns.length-1].answer?turns[turns.length-1]:null;
  let h=`<div class="turn now"><img id="big" src="${esc(a.url)}" alt="">
      <div class="bar"><button data-restart="${a.id}" ${busy?'disabled':''}>Start this one again</button><button data-close="1" ${busy?'disabled':''}>Close</button></div>`;
  turns.forEach(t=>{ h+=`<div class="turn${t.answer?' done':''}"><div class="lvl">level ${t.level??'?'} · ${esc(t.stage||'')}${t.saw_the_photograph?' · saw the photograph':''}</div>
      ${t.because_of?`<div class="because">because you said: “${esc(t.because_of)}”</div>`:''}
      <div class="q">${esc(t.question)}</div>${t.answer?`<div class="a">${esc(t.answer)}</div>`:''}</div>`; });
  if(open) h+=`<textarea id="ans" placeholder="Answer as the customer would"></textarea>
      <div class="bar"><button id="send" class="run" ${busy?'disabled':''}>${busy?'One moment…':'Send answer → next question'}</button>
      ${need.answer?`<span class="err">The live <code>deep</code> function doesn’t take an answer yet (it replied “waiting”). The page sends <code>{token, asset_id, turn_id, answer}</code>.</span>`:''}</div>`;
  else if(turns.length&&turns[turns.length-1].turn_id) h+=`<div class="bar"><button id="next" class="run" ${busy?'disabled':''}>Next question</button></div>`;
  if(err) h+=`<p class="err">${esc(err)}</p>`;
  return h+'</div>';
}
/* ── the engine ── */
function takeTurn(j){
  if(j.done||j.finished){ turns.push({level:j.level,stage:'done',question:'(the engine says this photograph is finished)',answer:' ',turn_id:null}); return; }
  if(j.turn_id&&!turns.some(t=>t.turn_id===j.turn_id)) turns.push({turn_id:j.turn_id,level:j.level,stage:j.stage,because_of:j.because_of,question:j.question,saw_the_photograph:j.saw_the_photograph,answer:''});
}
async function askNext(){
  busy=true; err=''; paint();
  const {ok,j}=await fn('deep',{asset_id:cur}); busy=false;
  if(!ok||!j||j.error){ err=`deep: ${JSON.stringify(j)}`; paint(); return; }
  if(j.waiting){ err=`deep says: ${j.detail||'waiting'} — there is an open question on the server for this photograph, but deep doesn’t return it, so it can’t be shown or answered here. Start this one again, or have deep return the open turn with “waiting”.`; paint(); return; }
  takeTurn(j); paint(); const ta=$('ans'); if(ta) ta.focus();
}
async function sendAnswer(){
  const t=turns[turns.length-1]; const a=($('ans')?.value||'').trim(); if(!t||!a) return;
  busy=true; err=''; paint();
  const {ok,j}=await fn('deep',{asset_id:cur,turn_id:t.turn_id,answer:a}); busy=false;
  if(!ok||!j||j.error){ err=`deep: ${JSON.stringify(j)}`; paint(); const ta=$('ans'); if(ta) ta.value=a; return; }
  if(j.waiting){ need.answer=true; paint(); const ta=$('ans'); if(ta) ta.value=a; return; }   // the answer was not taken
  need.answer=false; t.answer=a; takeTurn(j); paint(); const ta=$('ans'); if(ta) ta.focus();
}
async function restart(id){
  busy=true; err=''; paint();
  const {ok,status,j}=await rpc('deep_restart',{p_asset:id}); busy=false;
  if(!ok||(j&&j.error)){ err=`Start again needs deep_restart {p_token, p_asset} on the server — it isn’t there yet (HTTP ${status}${j&&(j.message||j.error)?': '+(j.message||j.error):''}). Nothing was cleared.`; if(cur!==id){ cur=id; turns=[]; } paint(); return; }
  delete prog[id]; cur=id; turns=[]; await readProgress(); await askNext();
}
/* ── the upload: the journey's calls, nothing else ── */
const EXT_MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',heif:'image/heif',webp:'image/webp',gif:'image/gif'};
const mimeOf=f=>(f.type&&f.type!=='application/octet-stream')?f.type:(EXT_MIME[(f.name.split('.').pop()||'').toLowerCase()]||'application/octet-stream');
const isHeic=f=>/^image\/hei[cf]$/i.test(f.type)||/\.(heic|heif)$/i.test(f.name);
let heicLib=null;
async function toJpeg(f){
  if(!heicLib) heicLib=await import('https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/heic-to.js');
  const blob=await heicLib.heicTo({blob:f,type:'image/jpeg',quality:0.9});
  return new File([blob],f.name.replace(/\.(heic|heif)$/i,'')+'.jpg',{type:'image/jpeg',lastModified:f.lastModified});
}
async function upload(files){
  if(!files.length) return;
  busy=true; let n=0, failed=[];
  for(let f of files){
    up=`Adding ${++n} of ${files.length}…`; paint();
    try{
      if(isHeic(f)) f=await toJpeg(f);
      const s=await fn('upload',{action:'sign',filename:f.name,mime:mimeOf(f),size:f.size,uploaded_by:'bench'});
      if(s.j.duplicate){ failed.push(`${f.name}: already in (${s.j.of||''})`); continue; }
      if(!s.ok||!s.j.signed_url) throw new Error(s.j.error||('sign HTTP '+s.status));
      const put=await fetch(s.j.signed_url,{method:'PUT',headers:{'Content-Type':mimeOf(f)},body:f});
      if(!put.ok) throw new Error('PUT '+put.status+' '+(await put.text()).slice(0,120));
      const c=await fn('upload',{action:'confirm',asset_id:s.j.asset_id});
      if(!c.ok) throw new Error(c.j.error||'confirm failed');
    }catch(e){ failed.push(`${f.name}: ${e.message}`); }
  }
  up=failed.length?`${files.length-failed.length} of ${files.length} in. Not in: ${failed.join(' · ')}`:`${files.length} in.`;
  await describeAll();
  busy=false; up=null; await load();
}
/* describe until it reports done — nobody should have to run a curl */
async function describeAll(){
  for(let i=0;i<60;i++){
    scan='Describing…'; paint();
    const {ok,j}=await fn('describe',{});
    if(!ok||j.error){ scan=`describe: ${j.error||'failed'}`; paint(); await sleep(3000); continue; }
    scan=`Described ${j.described||0} of ${j.total||'?'}`; paint();
    if(j.done){ scan=null; return; }
    if(j.stalled){ scan=`describe stalled at ${j.described||0} of ${j.total||'?'}`; paint(); return; }
    await sleep(+j.this_call>0?400:3000);
  }
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t||busy) return;
  if(t.dataset.run){ if(cur!==t.dataset.run){ cur=t.dataset.run; turns=[]; err=''; } await askNext(); scrollTo(0,0); return; }
  if(t.dataset.restart){ await restart(t.dataset.restart); scrollTo(0,0); return; }
  if(t.dataset.close){ cur=null; turns=[]; err=''; paint(); return; }
  if(t.id==='send'){ await sendAnswer(); return; }
  if(t.id==='next'){ await askNext(); return; }
});
load();
</script>
</body>
</html>
