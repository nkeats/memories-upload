/* Done on the sort page: save, ask the server for the questions, move on.
   ⚠ 422 means there is no question pack for this occasion. Say so and STOP —
   never carry her into the questions page with nothing to ask. */
async function finishSort(){
  const b=$('sortDone'); if(!b) return;
  b.disabled=true; b.textContent='One moment…';
  clearTimeout(saveTimer);
  /* She may press Done a second after typing the last name, while that save
     is still queued or in flight. Wait for it — up to a few tries — rather
     than bounce the button and leave her wondering. */
  for(let i=0;i<6&&dirty;i++){ await saveGroups(); if(dirty) await sleep(400); }
  if(dirty||failed||M.some(m=>!m.id)){ b.disabled=false; b.textContent='Done'; flash(false);
    const before=$('nav').querySelector('.before'); if(before) before.textContent="Still saving — please press Done again in a moment.";
    return; }
  const tryAgain=msg=>{ b.disabled=false; b.textContent='Done';
    const before=$('nav').querySelector('.before'); if(before) before.textContent=msg||"That didn't go through. Please press Done again."; };
  /* questions answers {written, waiting, done}. Like describe it may do a
     batch at a time, so go again while it is still writing. `waiting` names
     groups it has nothing for yet — they simply don't appear on the next page. */
  let written=0, waiting=[], done=false;
  for(let i=0;i<8;i++){
    const {ok,status,j}=await post('questions',{});
    if(status===422){
      report('questions: no pack',new Error(j.error||'422'),{occasion:J.occasion});
      prog({screen:'notready'});
      screen='notready'; paint(); scrollTo(0,0); return;
    }
    if(!ok){ report('questions',new Error(j.error||('HTTP '+status)),{status}); tryAgain(); return; }
    written+=+j.written||0;
    waiting=Array.isArray(j.waiting)?j.waiting:(j.waiting?[j.waiting]:[]);
    done=!!j.done;
    /* ⚠ spine_short: the interview produced details and no spine — every
       question anchored to a photograph, none about the marriage itself.
       Not hers to fix; reported so it is seen. */
    if(j.spine_short) report('questions: spine short',new Error('spine_short'),{broad_used:j.broad_used,broad_needed:j.broad_needed});
    if(done||!(+j.written)) break;                          // finished, or another call would do no more
  }
  if(waiting.length) report('questions: some groups waiting',new Error('waiting'),{written,waiting,done});
  /* ⚠ Never carry her on with nothing to ask. */
  let have=0;
  try{ const jj=await rpc('journey',{p_token:TOKEN}); if(jj&&!jj.error){ J={...J,...jj}; have=+jj.with_questions||0; } }
  catch(e){ report('journey after questions',e); }
  if(!have&&!written){
    tryAgain("We're still getting your questions ready. Please press Done again in a moment.");
    return;
  }
  try{ await setStage('answer'); }
  catch(e){ report('set_stage answer',e); b.disabled=false; b.textContent='Done';
    const before=$('nav').querySelector('.before'); if(before) before.textContent="That didn't go through. Please press Done again.";
    return; }
  prog({screen:'answer'});
  showAnswer();
}

/* ═══ 4 · ANSWER — tell us about each group ═══════════════════════ */
/* ═══ 4 · ANSWER — a conversation, one question at a time ═════════
   "How can we get three levels deep when the answer space is one big box?"
   — Nigel. So: one question, one box, then the next. Each group's questions
   are TURNS (next_turn / answer_turn). After every answer the server is asked
   whether that answer deserves a follow-up (probe); if so it is inserted as
   the NEXT turn — right after the answer that prompted it, because a
   follow-up asked three questions later isn't a follow-up. When a turn has
   `because_of`, her own words are shown above the question: that is what
   makes it read as listening rather than a form. Progress is a count,
   "3 of 5", and it can grow as follow-ups arrive — never a bar. Every
   question can be skipped. Resume is natural: next_turn is always the first
   one not yet answered. */
let askedAgain=false, TURN=null, draft='', turnBusy=false, wrongOpen=false, whatDraft='';
async function showAnswer(){
  page='answer'; screen='answer';
  plain('<p class="load">Loading your photos…</p>');
  try{
    let d=await api('load',{});
    A=d.assets.filter(a=>a.url);
    name=d.collection.owner_name||'';
    try{ const cs=await rpc('clip_state',{p_token:TOKEN}); CLIPS={}; (cs&&cs.clips||[]).forEach(c=>{ CLIPS[c.id]=c; }); }catch(_){}
    const all=d.chapters.map(c=>({id:c.id,title:c.title||'',register:c.register||'warm',story:c.story||'',
      photos:A.filter(a=>a.chapter_id===c.id&&!a.excluded).sort((x,y)=>(x.sort_index??0)-(y.sort_index??0))}));
    if(!all.length){ report('answer with no chapters',new Error('no chapters'));
      plain(`<h1>One moment</h1><p class="do">We can't find your groups. Please try the link again in a little while.</p>`); return; }
    /* Where each group is up to. ⚠ Only groups with something to ask are
       shown — a group with no turns is never put in front of her. */
    const readTurns=async()=>{ for(const m of all){
      try{ const t=await rpc('next_turn',{p_token:TOKEN,p_chapter:m.id}); m.turn=(t&&!t.error)?t:{done:true,total:0,answered:0}; }
      catch(e){ report('next_turn',e,{group:m.title}); m.turn={done:true,total:0,answered:0}; } } };
    await readTurns();
    if(page!=='answer') return;
    /* A group with no turns at all may have been waiting for its questions
       when she pressed Done. Ask once per visit, then read the turns again.
       ⚠ The turns are the truth here, not the old chapters.questions array. */
    if(!askedAgain&&all.some(m=>!(+m.turn.total))){
      askedAgain=true;
      try{ const {ok,j}=await post('questions',{}); if(ok&&+j.written>0) await readTurns(); }
      catch(e){ report('questions on answer page',e); }
      if(page!=='answer') return;
    }
    M=all.filter(m=>(+m.turn.total||0)>0);
    if(all.length>M.length) report('answer: groups without questions',new Error('waiting'),{without:all.length-M.length,of:all.length});
    if(!M.length){
      plain(`<h1>Nearly there</h1>
        <p class="do">We're still getting your questions ready. Please try the link again in a little while.</p>
        <button class="big" id="retryRoute">Try again</button>`);
      return; }
    const need=M.findIndex(m=>!m.turn.done);            // first group with something still to answer
    const pr=(d.collection&&d.collection.progress)||{};
    if(need<0){
      /* Everything answered. She may have been on the music page, or be back
         to press Finished. */
      if(pr.screen==='genre'){ cur=M.length-1; showGenre(); return; }
      cur=M.length-1; paintAllDone(); scrollTo(0,0); return; }
    cur=need; TURN=M[cur].turn; draft='';
    /* §7b once, before the first question of the whole film — this is where
       the song is actually made. Never on a resume part-way through. */
    paintTurn(); scrollTo(0,0);
  }catch(e){ report('load for answers',e);
    plain(`<h1>Couldn't load your photos</h1><p class="do">Please try the link again in a moment.</p>
      <button class="big" id="retryRoute">Try again</button>`); }
}
function photosStrip(m){
  let h=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(112px,1fr));margin-bottom:18px">`;
  m.photos.forEach((p,i)=>{ h+=`<div class="c" data-zoom="${i}">${tile(p)}<div class="n">${i+1}</div></div>`; });
  return h+`</div>`+(m.photos.length?`<p class="lede" style="margin-top:-10px;font-size:14.5px">Tap a photo to see it properly.</p>`:'');
}
function paintTurn(){
  atEnd=false;
  const m=M[cur], t=TURN; if(!m||!t||t.done) return;
  const n=Math.min(+t.answered+1, +t.total)||1, of=+t.total||1;
  let h=`<div class="step">Group <b>${cur+1}</b> of ${M.length} · ${esc(m.title||'')} · question <b>${n}</b> of ${of}</div>`;
  h+=tips('answer');
  h+=photosStrip(m);
  if(t.because_of) h+=`<p class="said">You said: <i>\u201c${esc(String(t.because_of).trim())}\u201d</i></p>`;
  h+=`<h2 style="margin-top:${t.because_of?8:14}px">${esc(t.question||'')}</h2>
      <textarea id="ans" class="beside" placeholder="Tell us what happened, not how it felt. The feeling comes with it.">${esc(draft)}</textarea>
      <div class="count" id="cnt"></div>
      <p class="lede" style="margin-top:6px"><button class="chip" id="askip" type="button" ${turnBusy?'disabled':''}>Skip this one</button>
        <button class="quiet" id="awrong" type="button" ${turnBusy?'disabled':''} aria-expanded="${wrongOpen?'true':'false'}">That’s not what’s in that photo</button></p>
      ${wrongOpen?`<div class="card" id="wrongcard"><label for="what">What is it?</label>
        <input type="text" id="what" value="${esc(whatDraft)}" placeholder="Tell us what’s really there" autocomplete="off">
        <div class="acts" style="margin-top:12px"><button class="yes" id="awrongsend" ${turnBusy||!whatDraft.trim()?'disabled':''}>That’s what it is</button>
          <button id="awrongcancel">Never mind</button></div></div>`:''}`;
  $('stage').innerHTML=h; $('stage').className='';
  countUp();
  nav(`<button class="go" id="anext" ${turnBusy?'disabled':''}>${turnBusy?'One moment…':(n<of?'Next question →':'Last one — next →')}</button>`,
      `${M.filter(x=>x.turn&&x.turn.done).length} of ${M.length} groups done`, cur>0, '');
  $('sheet').classList.add('hide');
  const ta=$('ans'); if(ta&&!turnBusy) ta.focus();
}
let atEnd=false;
function paintAllDone(){
  atEnd=true;
  $('stage').innerHTML=`<div class="step">Group ${M.length} of ${M.length}</div>
    <h1>That\u2019s all the questions</h1>
    <p class="do">You\u2019ve told us about every group. Press Finished and we\u2019ll make your film from your photos and your words.</p>
    <p class="lede">Want to change something? Use \u2190 to go back through the groups.</p>`;
  $('stage').className='';
  nav('<button class="go" id="tomusic">Finished</button>',`${M.length} of ${M.length} groups done`,true,
      'When you press Finished, that\u2019s everything — your film is made from your photos and your words.');
  $('sheet').classList.add('hide');
}
function countUp(){ const c=$('cnt'); if(!c) return;
  const w=words(draft);
  c.textContent=w?`${w} words`:'a few sentences is plenty';
  c.className='count'+(w>=25?' good':''); }
/* answer or skip → probe → next_turn. The probe is a model call and takes a
   few seconds; the button says so. */
async function answerTurn(skip){
  const m=M[cur], t=TURN; if(!m||!t||turnBusy) return;
  const text=(draft||'').trim();
  if(!skip&&!text){ const ta=$('ans'); if(ta) ta.focus(); return; }
  turnBusy=true; paintTurn();
  const fail=()=>{ turnBusy=false; paintTurn(); flash(false);
    const before=$('nav').querySelector('.before'); if(before) before.textContent="That didn't go through. Please press Next again."; };
  try{
    const r=await rpc('answer_turn', skip?{p_token:TOKEN,p_turn:t.turn_id,p_skip:true}:{p_token:TOKEN,p_turn:t.turn_id,p_answer:text});
    if(!r||r.error) throw new Error((r&&r.error)||'answer_turn failed');
  }catch(e){ report(skip?'skip turn':'answer turn',e,{group:m.title,seq:t.seq}); fail(); return; }
  if(!skip){
    /* Does that answer deserve a follow-up? If so the server has already put
       it in as the next turn. */
    try{ const {ok,j}=await post('probe',{chapter_id:m.id}); if(!ok||j.error) report('probe',new Error((j&&j.error)||'probe failed'),{group:m.title}); }
    catch(e){ report('probe',e,{group:m.title}); }
  }
  let nt;
  try{ nt=await rpc('next_turn',{p_token:TOKEN,p_chapter:m.id}); if(!nt||nt.error) throw new Error((nt&&nt.error)||'next_turn failed'); }
  catch(e){ report('next_turn',e,{group:m.title}); fail(); return; }
  if(page!=='answer') return;
  turnBusy=false; draft=''; wrongOpen=false; whatDraft='';
  /* ⚠ Same chapter until it says done. If it says done with NO turns at all
     straight after an answer, the questions were rewritten underneath her;
     say so rather than jumping on. */
  if(nt.done&&!(+nt.total)&&(+t.total)>0){ report('turns vanished mid-answer',new Error('total 0'),{group:m.title}); m.turn=nt; TURN=nt;
    $('stage').innerHTML=`<div class="step">Group <b>${cur+1}</b> of ${M.length} · ${esc(m.title||'')}</div><h2>One moment</h2>
      <p class="do">We’re getting more questions ready for this group. Please try the link again in a little while.</p>`;
    nav('<button class="go" id="retryRoute">Try again</button>','',cur>0,''); return; }
  m.turn=nt; TURN=nt;
  prog({screen:'answer',part:cur+1,turn:nt.seq||null});
  if(!nt.done){ paintTurn(); scrollTo(0,0); return; }
  /* this group is done: the move between memories looks different from the
     move between questions — a pause, then the next group by name */
  const next=M.findIndex((x,i)=>i>cur&&!x.turn.done);
  if(next>=0){ paintGroupDone(next); scrollTo(0,0); return; }
  paintAllDone(); scrollTo(0,0);
}
function paintGroupDone(next){
  const m=M[cur];
  $('stage').innerHTML=`<div class="step">Group <b>${cur+1}</b> of ${M.length} · ${esc(m.title||'')}</div>
    <h1>That’s everything about “${esc(m.title||'this group')}”</h1>
    <p class="do">Thank you. Next: “${esc(M[next].title||'the next group')}”.</p>${photosStrip(m)}`;
  $('stage').className='';
  nav(`<button class="go" id="agroupnext" data-next="${next}">On to “${esc(M[next].title||'the next group')}” →</button>`,`${M.filter(x=>x.turn&&x.turn.done).length} of ${M.length} groups done`,cur>0,'');
  $('sheet').classList.add('hide');
}
/* "That's not what's in that photo." A description is a model's READING of
   a photograph, not the photograph; the question is where a wrong reading
   gets caught, but only if she can tell us. Her correction is testimony —
   worth more than the description it replaces — and the turn is marked
   wrong_premise and skipped so nothing downstream builds on it. */
async function flagWrong(){
  const m=M[cur], t=TURN; if(!m||!t||turnBusy) return;
  const what=(whatDraft||'').trim(); if(!what){ const f=$('what'); if(f) f.focus(); return; }
  turnBusy=true; paintTurn();
  try{ const r=await rpc('flag_wrong_premise',{p_token:TOKEN,p_turn:t.turn_id,p_what_it_really_is:what}); if(!r||r.error) throw new Error((r&&r.error)||'flag_wrong_premise failed'); }
  catch(e){ report('flag_wrong_premise',e,{group:m.title,seq:t.seq}); turnBusy=false; paintTurn(); flash(false); return; }
  let nt;
  try{ nt=await rpc('next_turn',{p_token:TOKEN,p_chapter:m.id}); if(!nt||nt.error) throw new Error((nt&&nt.error)||'next_turn failed'); }
  catch(e){ report('next_turn',e,{group:m.title}); turnBusy=false; paintTurn(); flash(false); return; }
  if(page!=='answer') return;
  turnBusy=false; draft=''; wrongOpen=false; whatDraft=''; m.turn=nt; TURN=nt;
  if(!nt.done){ paintTurn(); scrollTo(0,0); return; }
  const next=M.findIndex((x,i)=>i>cur&&!x.turn.done);
  if(next>=0){ cur=next; TURN=M[cur].turn; paintTurn(); scrollTo(0,0); return; }
  paintAllDone(); scrollTo(0,0);
}
async function gotoGroup(i){
  atEnd=false; cur=Math.max(0,Math.min(M.length-1,i)); draft='';
  try{ const t=await rpc('next_turn',{p_token:TOKEN,p_chapter:M[cur].id}); M[cur].turn=(t&&!t.error)?t:M[cur].turn; }catch(_){}
  TURN=M[cur].turn;
  if(TURN.done){
    /* nothing left to ask here: say so, with the way on */
    $('stage').innerHTML=`<div class="step">Group <b>${cur+1}</b> of ${M.length} · ${esc(M[cur].title||'')}</div>
      <h2>You\u2019ve answered everything about this group.</h2>${photosStrip(M[cur])}`;
    $('stage').className='';
    nav('<button class="go" id="anext">Next →</button>',`${M.filter(x=>x.turn&&x.turn.done).length} of ${M.length} groups done`,cur>0,'');
    $('sheet').classList.add('hide'); return;
  }
  paintTurn();
}

async function toMusic(){
  /* Finished on the last group. If a sound is already chosen and confirmed —
     usually, from the scan page — that's everything. Otherwise the music page
     comes once more, on its own, before Finished. */
  const b=$('tomusic'); if(!b) return;
  b.disabled=true; b.textContent='One moment…';
  await loadMusic();
  if(page!=='answer') return;
  if(G.chosen&&G.chosen.confirmed){ await finishFilm(b); return; }
  prog({screen:'genre'}); showGenre();
}
async function finishFilm(b){
  try{ await setStage('submitted'); }
  catch(e){ report('set_stage submitted',e); if(b){ b.disabled=false; b.textContent='Finished'; }
    const before=$('nav').querySelector('.before'); if(before) before.textContent="That didn't go through. Please press Finished again."; return; }
  if(audio){ audio.pause(); audio=null; }
  prog({screen:'submitted'});
  showThanks();
}

/* ═══ 4b · THE MUSIC ══════════════════════════════════════════════
   The three anchor questions (genre_anchors), what we heard (translate-genre),
   the nine sounds and the three voices — all on one page, all with a play
   button where a sample exists. ⚠ `plain` is the sentence she is shown and
   the sentence she agrees to; `styles` is for the composition plan and is
   never shown. ⚠ `sample` is the row's own path (a content hash in the name);
   never built from the slug. Tapping a sound or a voice records it at once. */
let G={anchors:[],genres:[],voices:[],suggested:null,why:null,vsuggested:null,vwhy:null,chosen:null,voice:null,
       answers:{},plain:'',notice:'',guess:'',busy:false,finishMode:false};
function takeChosen(c){ G.chosen=(c&&typeof c==='object')?c:null; }
function heardSentence(){
  if(G.plain) return G.plain;
  const c=G.chosen; if(!c||c.slug) return '';
  return c.plain||c.styles||'';
}
async function loadMusic(){
  const [anchors,sg,sv]=await Promise.all([
    rpc('genre_anchors',{p_token:TOKEN}).catch(e=>({error:e.message})),
    rpc('suggest_genre',{p_token:TOKEN}).catch(e=>({error:e.message})),
    rpc('suggest_voice',{p_token:TOKEN}).catch(e=>({error:e.message}))]);
  if(Array.isArray(anchors)) G.anchors=anchors; else report('genre_anchors',new Error((anchors&&anchors.error)||'failed'));
  if(sg&&!sg.error){ G.genres=sg.genres||[]; G.suggested=sg.suggested||null; G.why=sg.why||null; takeChosen(sg.chosen); }
  else report('suggest_genre',new Error((sg&&sg.error)||'failed'));
  if(sv&&!sv.error){ G.voices=sv.voices||[]; G.vsuggested=sv.suggested||null; G.vwhy=sv.why||null; G.voice=sv.chosen||null; }
  else report('suggest_voice',new Error((sv&&sv.error)||'failed'));
}
async function showGenre(){
  /* the fallback: Finished pressed with no sound chosen */
  page='answer'; screen='genre'; G.finishMode=true;
  plain('<p class="load">One moment…</p>');
  await loadMusic(); if(page!=='answer') return;
  paintMusic(); scrollTo(0,0);
}
const sampleUrl=p=>/^https?:\/\//.test(p)?p:`${SB}/storage/v1/object/public/${String(p).replace(/^\/+/,'')}`;
function card(kind,g,on,sug){
  return `<div class="genre ${on?'on':''}" data-${kind}="${esc(g.slug)}">
    <div class="gt"><b>${esc(g.label)}</b>${sug?' <span class="sug">our suggestion</span>':''}${on?' <span class="sug on">chosen</span>':''}</div>
    <div class="gp">${esc(g.plain)}</div>
    ${g.sample?`<button class="play" type="button" data-play="${esc(sampleUrl(g.sample))}" aria-label="Hear a little of ${esc(g.label)}">▶ Hear it</button>`:''}
  </div>`;
}
function paintMusic(){
  const st=$('stage'); st.className=''; $('sheet').classList.add('hide');
  /* A sentence translated in this session is shown with its Yes button even if
     the server already says confirmed (a fresh translation inherits the flag
     from an earlier pick — she has not agreed to THIS sentence yet). */
  const heard=heardSentence(), c=G.chosen, confirmedHeard=!!(c&&!c.slug&&c.confirmed)&&!G.fresh;
  let h='';
  if(G.finishMode){
    h+=`<div class="step">Nearly done · the music</div><h1>Now, the music</h1>
      ${tips('music')}`;
  }else{
    h+=`<div class="step">Getting your photos ready</div><h1>While we look at your photos, choose the music</h1>
      ${tips('music')}
      <p class="lede" id="scan">${scanLine()}</p>
      <button class="chip ${scan.stalled?'':'hide'}" id="dretry" type="button">Try the photos again</button>`;
  }
  /* the three questions */
  h+=`<div class="card" style="margin-top:8px">`;
  G.anchors.forEach((a,i)=>{ h+=`<label for="a_${esc(a.key)}" style="margin-top:${i?14:0}px">${esc(a.ask)}</label>
    <input type="text" class="anchor" id="a_${esc(a.key)}" data-key="${esc(a.key)}" value="${esc(G.answers[a.key]||'')}" placeholder="Anything you like" autocomplete="off">`; });
  h+=`<div style="margin-top:16px"><button class="big" id="gnext" ${G.busy?'disabled':''}>${G.busy?'One moment…':'See what we heard →'}</button></div></div>`;
  /* what we heard */
  if(G.notice) h+=`<div class="clock">${esc(G.notice)}${G.guess?`<br><span style="color:var(--fg2)">Our guess: ${esc(G.guess)}</span>`:''}</div>`;
  if(heard) h+=`<div class="card"><h2 style="margin:0 0 8px">Here\u2019s what we heard</h2><p class="do" style="margin-bottom:12px">${esc(heard)}</p>
    ${confirmedHeard?`<p class="lede" style="margin:0"><span class="sug on">chosen</span> That\u2019s the sound we\u2019ll use. Tap one below if you\u2019d rather.</p>`
      :`<div class="acts"><button class="yes" id="gyes">Yes, that\u2019s right</button></div>`}</div>`;
  /* the nine */
  h+=`<h2 style="margin-top:26px">${heard?'Or choose a sound':'Choose a sound'}</h2>
    <p class="lede">Tap ▶ to hear a little of each. Tap the one that feels most like the two of you.</p>`;
  if(G.suggested&&G.why){ const sug=G.genres.find(g=>g.slug===G.suggested);
    h+=`<div class="clock"><b>We\u2019d suggest ${esc(sug?sug.label:G.suggested)}.</b><br>${esc(G.why)}</div>`; }
  if(G.genres.length){ h+='<div class="genres">'; G.genres.forEach(g=>{ h+=card('genre',g,!!(c&&c.slug===g.slug),g.slug===G.suggested); }); h+='</div>'; }
  else h+=`<p class="lede">We couldn\u2019t fetch the sounds just now. <button class="chip" id="glist" type="button">Try again</button></p>`;
  /* the voices */
  h+=`<h2 style="margin-top:30px">Whose voice?</h2>`;
  if(G.vwhy) h+=`<div class="clock">${esc(G.vwhy)}</div>`;
  if(G.voices.length){ h+='<div class="genres">'; G.voices.forEach(v=>{ h+=card('voice',v,G.voice===v.slug,v.slug===G.vsuggested); }); h+='</div>'; }
  st.innerHTML=h;
  if(G.finishMode){
    const ready=!!(c&&c.confirmed);
    nav(`<button class="go" id="gdone" ${ready?'':'disabled'}>Finished</button>`,'',true,
        ready?'When you press Finished, that\u2019s everything — your film is made from your photos, your words and this music.':'Choose a sound first — tap one above, or tell us what you love.');
  }else{
    nav(`<button class="go" id="tosort" ${scan.done?'':'disabled'}>${scan.done?'Next: put them in order →':'Looking at your photos…'}</button>`, scanLine(), false, '');
  }
}
/* Her answers → set_anchor each; the joined music note → translate-genre;
   then suggest_genre again so the recommendation reflects the year. */
async function translateGenre(){
  const b=$('gnext'); if(!b||G.busy) return;
  const given=G.anchors.filter(a=>(G.answers[a.key]||'').trim());
  if(!given.length){ const f=document.querySelector('input.anchor'); if(f) f.focus(); return; }
  G.busy=true; b.disabled=true; b.textContent='One moment…';
  const fail=()=>{ G.busy=false; paintMusic(); const before=$('nav').querySelector('.before'); if(before) before.textContent="That didn't go through. Please try again."; };
  let note='';
  for(const a of given){
    try{ const r=await rpc('set_anchor',{p_token:TOKEN,p_key:a.key,p_answer:G.answers[a.key].trim()});
      if(!r||r.error) throw new Error((r&&r.error)||'set_anchor failed'); if(r.music_note) note=r.music_note; }
    catch(e){ report('set_anchor',e,{key:a.key}); fail(); return; }
  }
  try{ const sg=await rpc('suggest_genre',{p_token:TOKEN}); if(sg&&!sg.error){ G.genres=sg.genres||G.genres; G.suggested=sg.suggested||null; G.why=sg.why||null; takeChosen(sg.chosen); } }
  catch(e){ report('suggest_genre',e); }
  if(note){
    const {ok,status,j}=await post('translate-genre',{note});
    if(!ok||j.error){ report('translate-genre',new Error(j.error||('HTTP '+status))); fail(); return; }
    if(j.confident===false||!j.plain||j.saved===false){
      G.plain=''; G.notice=j.ask||"We couldn't tell from that what you like. Please pick one of the sounds below."; G.guess=j.plain||'';
    }else{ G.plain=j.plain; G.notice=''; G.guess=''; G.fresh=true; try{ const sg=await rpc('suggest_genre',{p_token:TOKEN}); if(sg&&!sg.error) takeChosen(sg.chosen); }catch(_){} }
  }
  G.busy=false; paintMusic();
  const el=document.querySelector('.card h2'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}

  const b=$('gyes'); if(!b) return; b.disabled=true; b.textContent='One moment…';

/* ═══ HELP — "something not right?" ═══════════════════════════════
   ⚠ Not a chat box. A chat box listens sympathetically and changes nothing,
   which is worse than no help at all. POST help {token, asked} answers one of
   three kinds: `do` — an action the PAGE applies, then shows the reply (⚠ if
   the action fails, say so; never show a reply that claims something worked
   when it didn't); `cannot` — show the reply and stop (logged as roadmap);
   `person` — show the reply and stop (logged for a human: money, dates,
   complaints, anybody upset — a tribute film is about a death and somebody
   will write at 2am). After every reply, one line: "anything else you'd want
   to be able to change here?" — what they ask for is what we build next. */
let HELP={open:false,busy:false,asked:'',reply:'',bad:false,replied:false};
function paintHelp(){
  const sh=$('sheet');
  if(!HELP.open){ if(sh.classList.contains('help')){ sh.classList.add('hide'); sh.classList.remove('help'); sh.innerHTML=''; } return; }
  sh.classList.add('help'); sh.classList.remove('hide');
  sh.innerHTML=`<div class="in"><h3>What\u2019s not right?</h3>
    ${HELP.replied?'':'<p>Tell us in your own words \u2014 a name said wrongly, a photo in the wrong place, the wrong music \u2014 and we\u2019ll put it right if we can.</p>'}
    ${HELP.reply?`<p class="reply ${HELP.bad?'bad':''}">${esc(HELP.reply)}</p>`:''}
    ${HELP.replied?`<p class="ask2">Anything else you\u2019d want to be able to change here?</p>`:''}
    <textarea id="helpAsk" placeholder="${HELP.replied?'Anything else\u2026':'What\u2019s wrong, or what would you change?'}" ${HELP.busy?'disabled':''}>${esc(HELP.asked)}</textarea>
    <div class="acts" style="margin-top:12px"><button class="yes" id="helpSend" ${HELP.busy?'disabled':''}>${HELP.busy?'One moment\u2026':'Send'}</button>
      <button id="helpClose">${HELP.replied?'Done':'Never mind'}</button></div></div>`;
  if(!HELP.busy){ const t=$('helpAsk'); if(t) t.focus(); }
}
async function sendHelp(){
  const asked=(HELP.asked||'').trim(); if(!asked||HELP.busy){ const t=$('helpAsk'); if(t) t.focus(); return; }
  HELP.busy=true; HELP.reply=''; HELP.bad=false; paintHelp();
  let j;
  try{ const r=await post('help',{asked}); j=r.j; if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('HTTP '+r.status)); }
  catch(e){ report('help',e,{asked:asked.slice(0,200)}); HELP.busy=false; HELP.bad=true; HELP.reply="That didn\u2019t go through. Please try again in a moment."; HELP.replied=true; paintHelp(); return; }
  if(j.kind==='do'){
    const out=await applyHelp(j.action,j.details||{});
    if(out.ok){ HELP.reply=j.reply||'Done.'; HELP.bad=false; }
    else{ HELP.reply=out.why||"We couldn\u2019t make that change from here."; HELP.bad=true;
      report('help: action not applied',new Error(j.action),{action:j.action,details:j.details,why:out.why}); }
  }else{ HELP.reply=j.reply||''; HELP.bad=false; }
  HELP.busy=false; HELP.asked=''; HELP.replied=true; paintHelp();
  setTimeout(()=>{ if(HELP.open) paintHelp(); },600);   // a repaint of the page underneath may have hidden the sheet
}
/* Which photograph does she mean? Her words against what we know of each
   one — description, subject, notable, filename. Only a clear, single best
   match is acted on; anything less is said so, not guessed. */
const STOP=new Set(['the','a','an','of','one','ones','photo','photos','photograph','picture','pic','image','that','this','with','and','in','on','at','to','it','is','was','my','our','us','me','two','both','from','into','where']);
const toks=t=>String(t||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
function findAsset(assets,desc){
  const q=toks(desc); if(!q.length) return {asset:null,why:'nothing to go on'};
  const scored=assets.map(a=>{ const text=toks([a.description,a.subject,a.notable,a.original_filename,(a.who||[]).join(' ')].join(' ')).join(' ');
    return {a,n:q.filter(w=>text.includes(w)).length}; }).sort((x,y)=>y.n-x.n);
  const best=scored[0], second=scored[1];
  if(!best||best.n===0) return {asset:null,why:'no match'};
  if(second&&second.n===best.n) return {asset:null,why:'more than one match'};
  return {asset:best.a,why:''};
}
/* help's `details` keys are not fixed: one call says {description, from, to}, the next
   {photo_description, from_memory, to_memory}. Read them by shape, not by name. */
const pickKey=(d,re)=>{ for(const k of Object.keys(d||{})){ if(re.test(k)&&typeof d[k]==='string'&&d[k].trim()) return d[k]; } return ''; };
const descOf=d=>pickKey(d,/desc|photo|which|asset|move|image|pic/i)||'';
const toOf=d=>pickKey(d,/^to|target|into|new_memory|new_group/i)||'';
const findChapter=(chapters,name)=>{ const n=String(name||'').trim().toLowerCase(); return chapters.find(c=>(c.title||'').trim().toLowerCase()===n)||chapters.find(c=>(c.title||'').toLowerCase().includes(n)&&n.length>2)||null; };
/* The grouping as the server has it, whole — save_groups replaces the lot,
   so it must be built from every chapter, never from a page's partial list. */
async function groupsNow(){
  const d=await api('load',{});
  const chapters=d.chapters.map(c=>({id:c.id,title:c.title||'',register:c.register||'warm',story:c.story||'',
    photos:d.assets.filter(a=>a.chapter_id===c.id&&!a.excluded).sort((x,y)=>(x.sort_index??0)-(y.sort_index??0))}));
  return {d,chapters,assets:d.assets};
}
async function saveGroupsNow(g){
  const payload={groups:g.chapters.map(m=>({title:m.title,register:m.register,story:m.story||'',
      assets:m.photos.filter(p=>!p.excluded).map(p=>p.id), hero:(m.photos.find(p=>p.is_hero)||{}).id||null})),
    excluded:g.assets.filter(p=>p.excluded).map(p=>p.id)};
  const r=await api('save_groups',payload);
  if(!r.ids||r.ids.length!==g.chapters.length) throw new Error('save_groups: no ids back');
}
const VOICE_WORDS=[['female',/woman|female|her voice|girl|lady/],['male',/\bman\b|male|his voice|bloke/],['duet',/both|together|duet|two voices/]];
async function applyHelp(action,d){
  try{
    if(action==='fix_pronunciation'){
      const nm=pickKey(d,/^name|person|who/i), snd=pickKey(d,/sound|said|pronounc|say/i); if(!nm||!snd) return {ok:false,why:"We couldn\u2019t tell which name, or how it should sound."};
      const people=await rpc('get_people',{p_token:TOKEN});
      const who=(Array.isArray(people)?people:[]).find(x=>x.name.toLowerCase()===nm.toLowerCase());
      if(!who) return {ok:false,why:`We don\u2019t have anyone called ${nm} on this film yet \u2014 add them on the first screen and we\u2019ll say it right.`};
      const r=await rpc('confirm_person_sound',{p_token:TOKEN,p_name:who.name,p_corrected_said_as:snd});
      if(!r||r.error) throw new Error((r&&r.error)||'confirm_person_sound failed');
      return {ok:true};
    }
    if(action==='wrong_photo'){
      /* Only the question in front of her can be flagged with certainty. */
      const bad=toks(d.incorrect_description), q=toks(TURN&&!TURN.done?TURN.question:'');
      if(screen==='answer'&&TURN&&!TURN.done&&bad.some(w=>q.includes(w))&&d.correct_description){
        const r=await rpc('flag_wrong_premise',{p_token:TOKEN,p_turn:TURN.turn_id,p_what_it_really_is:String(d.correct_description)});
        if(!r||r.error) throw new Error((r&&r.error)||'flag_wrong_premise failed');
        const nt=await rpc('next_turn',{p_token:TOKEN,p_chapter:M[cur].id}); if(nt&&!nt.error){ M[cur].turn=nt; TURN=nt; draft=''; if(!nt.done) paintTurn(); }
        return {ok:true};
      }
      return {ok:false,why:"Thank you \u2014 to fix that one, go to the question it belongs to and press \u201cthat\u2019s not what\u2019s in that photo\u201d under it."};
    }
    if(action==='rename_memory'){
      const oldN=pickKey(d,/old|from|current/i), newN=pickKey(d,/new|rename/i); const g=await groupsNow(); const c=findChapter(g.chapters,oldN);
      if(!c||!newN) return {ok:false,why:`We couldn\u2019t find a group called \u201c${oldN}\u201d.`};
      c.title=String(newN).trim(); await saveGroupsNow(g); await afterGroupsChanged(); return {ok:true};
    }
    if(action==='move_photo'||action==='remove_photo'||action==='reorder'){
      const g=await groupsNow();
      const mem=pickKey(d,/^memory|^group|^in_/i); const pool=action==='reorder'&&mem?((findChapter(g.chapters,mem)||{}).photos||[]):g.assets.filter(a=>!a.excluded);
      const {asset,why}=findAsset(pool,descOf(d));
      if(!asset) return {ok:false,why:why==='more than one match'?"A few photos match that \u2014 on the grouping screen, tap the one you mean.":"We couldn\u2019t tell which photo you mean \u2014 on the grouping screen, tap it and choose what to do."};
      const from=g.chapters.find(c=>c.photos.some(p=>p.id===asset.id));
      if(action==='remove_photo'){ if(from) from.photos=from.photos.filter(p=>p.id!==asset.id); asset.excluded=true; }
      if(action==='move_photo'){ const to=findChapter(g.chapters,toOf(d)); if(!to) return {ok:false,why:`We couldn\u2019t find a group called \u201c${toOf(d)}\u201d.`};
        if(from) from.photos=from.photos.filter(p=>p.id!==asset.id); to.photos.push(asset); }
      if(action==='reorder'){ const ch=from; if(!ch) return {ok:false,why:"We couldn\u2019t tell which group that\u2019s in."};
        const before=pickKey(d,/before|ahead|earlier/i), after=pickKey(d,/after|behind|later/i); const ref=findAsset(ch.photos.filter(p=>p.id!==asset.id),before||after).asset; if(!ref) return {ok:false,why:"We couldn\u2019t tell which photo it should go next to."};
        ch.photos=ch.photos.filter(p=>p.id!==asset.id); const i=ch.photos.indexOf(ref); ch.photos.splice(after&&!before?i+1:i,0,asset); }
      await saveGroupsNow(g); await afterGroupsChanged(); return {ok:true};
    }
    if(action==='change_sound'){
      await loadMusic();
      const want0=toOf(d)||pickKey(d,/genre|sound|voice|style/i); if(/voice/i.test(d.change||'')||/voice/i.test(pickKey(d,/change|what|kind/i))){ const want=String(want0).toLowerCase(); const v=(VOICE_WORDS.find(([slug,re])=>re.test(want))||[])[0]||G.voices.find(x=>x.slug===want||x.label.toLowerCase()===want)?.slug;
        if(!v) return {ok:false,why:"We couldn\u2019t tell which voice you mean \u2014 the choices are on the music screen."};
        const r=await rpc('set_voice',{p_token:TOKEN,p_slug:v}); if(!r||r.error) throw new Error((r&&r.error)||'set_voice failed'); G.voice=v; }
      else{ const want=String(want0).toLowerCase(); const gn=G.genres.find(x=>x.slug===want||x.label.toLowerCase()===want)||G.genres.find(x=>x.label.toLowerCase().includes(want)&&want.length>2);
        if(!gn) return {ok:false,why:`We don\u2019t have a sound called \u201c${want0}\u201d \u2014 the choices are on the music screen.`};
        const r=await rpc('set_genre',{p_token:TOKEN,p_slug:gn.slug,p_plain:null}); if(!r||r.error) throw new Error((r&&r.error)||'set_genre failed'); }
      if(screen==='describing'||screen==='genre'){ try{ await loadMusic(); paintMusic(); }catch(_){} }
      return {ok:true};
    }
    if(action==='add_person'){
      const nm=pickKey(d,/^name|person|who/i), rel=pickKey(d,/relation|role|relationship/i); if(!nm) return {ok:false,why:"We couldn\u2019t tell the name."};
      const r=await rpc('set_person',{p_token:TOKEN,p_name:nm.trim(),p_relation:rel||null,p_is_subject:!!d.is_subject,p_is_you:false});
      if(!r||r.error) throw new Error((r&&r.error)||'set_person failed');
      P.people.push({name:r.name||nm,relation:rel||null,is_subject:!!d.is_subject,said_as:r.said_as||null,sound_ok:false});
      if(page==='upload'&&P.mode==='list') paintWho();
      return {ok:true};
    }
    return {ok:false,why:"That\u2019s not something we can change from here yet."};
  }catch(e){ report('help apply',e,{action,details:d}); return {ok:false,why:"We tried to make that change and it didn\u2019t go through. Nothing has been altered."}; }
}

/* ═══ interaction ════════════════════════════════════════════════ */
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='retryRoute'){ route(); return; }
  if(t.id==='dretry'){ scan.stalled=false; paintScan(); describeLoop(++describeRun); return; }
  if(t.id==='tosort'){ toSort(); return; }

  /* help */
  if(t.id==='helpOpen'){ HELP.open=true; HELP.reply=''; HELP.bad=false; HELP.replied=false; HELP.asked=''; paintHelp(); return; }
  if(t.id==='helpClose'){ HELP.open=false; paintHelp(); return; }
  if(t.id==='helpSend'){ sendHelp(); return; }
  /* before they start */
  if(t.id==='welcomeGo'){ P.welcomed=true; P.mode='list'; paintWho(); scrollTo(0,0); return; }
  if(t.id==='printsGo'||t.id==='printsSkip'){ showUploadPage(); scrollTo(0,0); return; }
  /* who */
  if(t.id==='padd'){ addPerson(); return; }
  if(t.id==='pdone'){ sayNames(); return; }
  if(t.dataset.premove!==undefined){ removePerson(+t.dataset.premove); return; }
  if(t.id==='psayagain'){ sayNames(); return; }
  if(t.id==='pmore'){ P.mode='list'; paintWho(); scrollTo(0,0); return; }
  if(t.dataset.sayok!==undefined){ const i=+t.dataset.sayok, x=P.say[i]; x.answer='yes'; x.typed=''; paintSayRow(i); return; }
  if(t.dataset.sayno!==undefined){ const i=+t.dataset.sayno, x=P.say[i]; x.answer=x.answer==='no'?null:'no'; paintSayRow(i); if(x.answer==='no'){ const f=document.querySelector(`input[data-saytype="${i}"]`); if(f) f.focus(); } return; }
  if(t.dataset.trytake!==undefined){ tryTake(+t.dataset.trytake); return; }
  if(t.dataset.choosetake!==undefined){ chooseTake(+t.dataset.choosetake); return; }
  if(t.id==='sayDone'){ finishSay(); return; }
  /* upload */
  if(t.dataset.anyway!==undefined){ const q=queue[+t.dataset.anyway]; if(q&&q.status==='dup'){ q.status='ready'; q.force=true; paintQueue(); $('send').disabled=false; } return; }
  if(t.id==='allin'){ askAllIn(); return; }
  if(t.id==='allinNo'){ $('sheet').classList.add('hide'); return; }
  if(t.id==='allinYes'){ finishUpload(); return; }

  /* sort */
  if(t.id==='start'){ name=($('who')||{}).value||'';
    api('set_owner',{name}).catch(e=>report('save name',e));
    dups=findDups().map(d=>{ d.keep=(d[0].sharpness||0)>=(d[1].sharpness||0)?0:1; return d; });
    screen=dups.length?'dups':'organise'; cur=0;
    if(screen==='organise') propose();
    prog({screen,name_given:!!name}); paint(); scrollTo(0,0); return; }
  if(t.dataset.voicewant!==undefined){ decideVoice(t.dataset.voicewant==='1'); return; }
  if(t.dataset.keep!==undefined){ dups[cur].keep=+t.dataset.keep; paint(); return; }
  if(t.id==='bothd'){ dups[cur].keep=-1; if(cur<dups.length-1){cur++;}else{screen='organise';cur=0;propose();}
    paint(); scrollTo(0,0); return; }
  if(t.id==='dnext'){ const d=dups[cur];
    if(d.keep>=0){ const drop=d[1-d.keep], keep=d[d.keep];
      drop.excluded=true; api('mark_dup',{keep:keep.id,drop:drop.id}).catch(e=>report('mark duplicate',e)); }
    if(cur<dups.length-1) cur++; else { screen='organise'; cur=0; propose(); prog({screen:'organise'}); }
    paint(); scrollTo(0,0); return; }
  if(t.id==='fixclock'){ A.forEach(p=>{ if(/^DSC/i.test(p.original_filename))
      p.taken_at=new Date(new Date(p.taken_at).getTime()-skew*3600000).toISOString(); });
    A.sort((a,b)=>new Date(a.taken_at)-new Date(b.taken_at));
    skewDone=true; propose(); cur=0; queueSave(); paint(); return; }
  if(t.id==='skipclock'){ skewDone=true; paint(); return; }
  if(t.dataset.reg){ M[cur].register=t.dataset.reg; queueSave(); paint(); return; }
  if(t.id==='onext'){ cur++; sel=null; picking=false; saveGroups(); prog({screen:'organise',part:cur+1}); paint(); scrollTo(0,0); return; }
  if(t.id==='back'){
    if(page==='upload'&&P.mode==='say'){ P.mode='list'; paintWho(); scrollTo(0,0); return; }
    if(screen==='genre'){ screen='answer'; gotoGroup(M.length-1); scrollTo(0,0); return; }
    if(screen==='answer'){ if(atEnd){ atEnd=false; gotoGroup(M.length-1); } else if(cur>0) gotoGroup(cur-1); scrollTo(0,0); return; }
    if(cur>0){cur--;} sel=null; picking=false;
    paint();
    scrollTo(0,0); return; }
  if(t.id==='tofirst'){ const i=M.findIndex(x=>!(x.title||'').trim());
    if(i>=0){ cur=i; sel=null; picking=false; paint(); scrollTo(0,0); } return; }
  if(t.id==='sortDone'){ finishSort(); return; }
  if(t.id==='cancel'){ sel=null; picking=false; sheet(); paint(); return; }
  if(t.dataset.to!==undefined){
    const m=M[cur], p=m.photos.find(x=>x.id===sel);
    m.photos.splice(m.photos.indexOf(p),1);
    if(t.dataset.to==='new') M.splice(cur+1,0,{title:'',register:'warm',story:'',photos:[p]});
    else M[+t.dataset.to].photos.push(p);
    if(!m.photos.length){ M.splice(M.indexOf(m),1); cur=Math.min(cur,M.length-1); }
    sel=null; picking=false; queueSave(); paint(); return; }
  if(t.dataset.a){
    const m=M[cur], inn=m.photos.filter(x=>!x.excluded), p=inn.find(x=>x.id===sel);
    const a=t.dataset.a, i=m.photos.indexOf(p);
    if(a==='move'){ picking=true; sheet(); return; }
    if(a==='see'){ zoom=inn.indexOf(p); sel=null; drawZoom(); paint(); return; }
    if(a==='up'&&i>0){ m.photos.splice(i,1); m.photos.splice(i-1,0,p); }
    if(a==='down'&&i<m.photos.length-1){ m.photos.splice(i,1); m.photos.splice(i+1,0,p); }
    if(a==='best'){ m.photos.forEach(x=>x.is_hero=false); p.is_hero=!p.is_hero; sel=null; }
    if(a==='out'){ p.excluded=true; sel=null; }
    queueSave(); paint(); return; }
  const back=t.closest('[data-back]');
  if(back){ const p=A.find(x=>x.id===back.dataset.back); p.excluded=false; queueSave(); paint(); return; }

  /* zoom (sort and answer) */
  const pc=t.closest('[data-playclip]');
  if(pc){ const inn=(M[cur]||{photos:[]}).photos.filter(x=>!x.excluded); const i=inn.findIndex(x=>x.url===pc.dataset.playclip);
    if(i>=0){ zoom=i; drawZoom(); const v=document.querySelector('#lb video'); if(v) v.play().catch(()=>{}); } return; }
  const z=t.closest('[data-zoom]');
  if(z){ zoom=+z.dataset.zoom; drawZoom(); return; }
  if(t.dataset.z){ const inn=M[cur].photos.filter(p=>!p.excluded);
    if(t.dataset.z==='close') zoom=null;
    if(t.dataset.z==='prev'&&zoom>0) zoom--;
    if(t.dataset.z==='next'&&zoom<inn.length-1) zoom++;
    drawZoom(); return; }
  if(t.id==='lb'||t.tagName==='IMG'&&t.closest('#lb')){ zoom=null; drawZoom(); return; }
  const c=t.closest('[data-p]');
  if(c&&screen==='organise'){ sel=sel===c.dataset.p?null:c.dataset.p; picking=false; paint(); return; }

  /* answer */
  if(t.id==='anext'){
    if(TURN&&TURN.done){ const next=M.findIndex((x,i)=>i>cur&&!x.turn.done); if(next>=0) gotoGroup(next); else paintAllDone(); scrollTo(0,0); return; }
    answerTurn(false); return; }
  if(t.id==='askip'){ answerTurn(true); return; }
  if(t.id==='agroupnext'){ cur=+t.dataset.next; TURN=M[cur].turn; draft=''; paintTurn(); scrollTo(0,0); return; }
  if(t.id==='awrong'){ wrongOpen=!wrongOpen; paintTurn(); if(wrongOpen){ const f=$('what'); if(f) f.focus(); } return; }
  if(t.id==='awrongcancel'){ wrongOpen=false; whatDraft=''; paintTurn(); return; }
  if(t.id==='awrongsend'){ flagWrong(); return; }
  if(t.id==='tomusic'){ toMusic(); return; }
  /* the music */
  if(t.id==='gnext'){ translateGenre(); return; }
  if(t.id==='gyes'){ keepHeard(); return; }
  if(t.id==='glist'){ loadMusic().then(paintMusic); return; }
  if(t.id==='gdone'){ finishGenre(); return; }
  const gp=t.closest('[data-play]');
  if(gp){ playSample(gp.dataset.play,gp); return; }
  const gc=t.closest('[data-genre]');
  if(gc){ pickGenre(gc.dataset.genre); return; }
  const gv=t.closest('[data-voice]');
  if(gv){ pickVoice(gv.dataset.voice); return; }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.target.id==='pname'||e.target.id==='prel')){ e.preventDefault(); addPerson(); }
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('anchor')){ e.preventDefault(); translateGenre(); }
  if(e.key==='Enter'&&e.target.id==='what'){ e.preventDefault(); flagWrong(); }
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.sung!==undefined){ e.preventDefault(); tryTake(+e.target.dataset.sung); }
});
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('anchor')){ G.answers[e.target.dataset.key]=e.target.value; return; }
  if(e.target.dataset&&e.target.dataset.saytype!==undefined){ const x=P.say[+e.target.dataset.saytype]; x.typed=e.target.value;
    const b=$('sayDone'); if(b) b.disabled=!P.say.every(y=>!y.needs||y.answer==='yes'||(y.answer==='no'&&y.typed.trim())); return; }
  if(e.target.dataset&&e.target.dataset.sung!==undefined){ const i=+e.target.dataset.sung, x=P.say[i]; x.sung=e.target.value;
    /* a different spelling than the one that's playing: the button becomes "Hear this spelling" */
    if(x.sung.trim()!==x.tried){ const cached=null; const row=e.target.closest('.person'); const btn=row&&row.querySelector('.play');
      if(btn){ btn.outerHTML=`<button class="play" type="button" data-trytake="${i}">Hear this spelling</button>`; const c=row.querySelector('[data-choosetake]'); if(c) c.remove(); } }
    return; }
  if(e.target.id==='nm'){ M[cur].title=e.target.value; queueSave(); if(screen==='organise') orgNav(); }
  if(e.target.id==='ans'){ draft=e.target.value; countUp(); }
  if(e.target.id==='what'){ whatDraft=e.target.value; const b=$('awrongsend'); if(b) b.disabled=!whatDraft.trim(); }
  if(e.target.id==='helpAsk'){ HELP.asked=e.target.value; }
});
window.addEventListener('beforeunload',e=>{
  if(dirty||failed){ e.preventDefault(); e.returnValue=''; }
});

route();
</script>
