<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="build" content="2026-10-06a">
<title>Your film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C0D10;--panel:#15171C;--p2:#1D1F26;--line:#2A2E37;--l2:#3C414C;
  --fg:#F4F1EA;--fg2:#9BA0AB;--fg3:#6B707A;--brass:#D4A24C;--green:#5E8C6A;--red:#B4543A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--fg);font-family:"Public Sans",sans-serif;
  font-size:17px;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px calc(190px + env(safe-area-inset-bottom))}
h1{font-family:"Newsreader",serif;font-weight:300;font-size:clamp(28px,7vw,38px);margin:10px 0 8px;line-height:1.18}
h2{font-family:"Newsreader",serif;font-weight:300;font-size:clamp(22px,5.5vw,30px);
  line-height:1.3;margin:0 0 10px}
/* The one sentence that says what to do. Above the fold on every page, set large. */
p.do{font-size:clamp(19px,4.6vw,23px);line-height:1.5;margin:0 0 20px;max-width:56ch;color:var(--fg)}
p.lede{color:var(--fg2);font-size:16.5px;line-height:1.6;margin:0 0 22px;max-width:56ch}
.step{font-size:13px;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase}
.consent .cbox{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;font-size:16.5px;line-height:1.5;cursor:pointer}
.consent .cbox input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--brass)}
.consent .cq{font-size:16.5px;margin:6px 0 8px;color:var(--fg)}
.consent .crow{display:flex;gap:10px;margin:0 0 6px}
.consent .chip.on{background:var(--brass);border-color:var(--brass);color:#20180A}
.consent .cin{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;padding:11px 12px;margin:0 0 14px}
.step b{color:var(--goldtext,var(--brass))}

input[type=text],textarea{width:100%;background:var(--panel);border:1px solid var(--l2);
  border-radius:8px;color:var(--fg);font:inherit;font-size:18px;padding:16px 17px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--brass)}
textarea{min-height:170px;line-height:1.65;resize:vertical}
::placeholder{color:var(--fg3)}
.count{text-align:right;font-size:13.5px;color:var(--fg3);margin-top:7px}
.count.good{color:var(--green)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 24px}
.chips .lab{width:100%;font-size:15px;color:var(--fg2);margin-bottom:3px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:12px 20px;font:inherit;font-size:16px;color:var(--fg2);cursor:pointer}
.chip[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#20180A;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.c{background:var(--panel);border:3px solid var(--line);border-radius:7px;overflow:hidden;
  cursor:pointer;position:relative}
.c.sel{border-color:var(--brass)} .c.best{border-color:var(--green)}
.c img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--p2)}
.c .n{position:absolute;top:6px;left:6px;background:rgba(12,13,16,.82);font-size:12.5px;
  font-weight:600;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.c .tag{position:absolute;top:6px;right:6px;font-size:10.5px;font-weight:600;padding:3px 8px;
  border-radius:4px;background:var(--green);color:#fff}
.c.one{max-width:420px;margin-bottom:14px;cursor:pointer}
.grid.around .c{cursor:pointer} .grid.around .ph{border-radius:4px}
.c .ph{width:100%;aspect-ratio:4/3;background:var(--p2);display:flex;align-items:center;
  justify-content:center;color:var(--fg3);font-size:12px;text-align:center;padding:6px}
.c .chk{position:absolute;bottom:34px;left:6px;font-size:10.5px;font-weight:600;padding:3px 8px;
  border-radius:4px;background:rgba(12,13,16,.82);color:#fff}
.c .ph.gone{color:var(--fg2);font-weight:600}

.dup{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.dup .side{background:var(--panel);border:3px solid var(--line);border-radius:7px;
  overflow:hidden;cursor:pointer;text-align:center}
.dup .side.keep{border-color:var(--green)}
.dup .side img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.dup .side .t{padding:11px;font-size:14.5px;color:var(--fg2)}
.dup .side.keep .t{color:var(--green);font-weight:600}

.leftout{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
/* 2 Oct: the board (suggested groups) */
.boardg{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px}
.bg{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.bg.target{border-style:dashed;border-color:var(--brass)}
.bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.bh b{font-size:17px}
.bn{color:var(--fg2);font-size:13.5px}.bx{margin-left:auto;font-size:13px}
.bhint{color:var(--fg3);font-size:13.5px;margin:2px 0 6px}
.bmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px;min-height:20px}
.bmini .c{border-width:2px}.bdrop{color:var(--fg3);font-size:13.5px;grid-column:1/-1}
.addg{display:flex;gap:8px;margin:12px 0 4px}.addg input{flex:1;min-width:0}
.bun{padding-top:4px}
.lo[data-unput]{opacity:1}
.leftout h4{font-family:"Newsreader",serif;font-weight:300;font-size:19px;margin:0 0 4px}
.leftout p{color:var(--fg3);font-size:14px;margin:0 0 11px}
.lostrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.lo{border:2px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;opacity:.45;position:relative}
.lo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.lo .put{position:absolute;inset:auto 0 0 0;background:rgba(12,13,16,.86);font-size:11px;
  text-align:center;padding:4px;color:var(--fg2)}

/* upload */
.drop{border:2px dashed var(--l2);border-radius:10px;background:var(--panel);
  padding:40px 22px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:18px}
.drop:hover,.drop.over{border-color:var(--brass);background:var(--p2)}
.drop b{display:block;font-family:"Newsreader",serif;font-size:24px;font-weight:400;margin-bottom:6px}
.drop span{color:var(--fg2);font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.card label{display:block;font-size:15px;color:var(--fg2);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .3s}
.bar.big{height:14px;border-radius:7px;margin:26px 0 12px}
.rows{margin-top:12px;max-height:300px;overflow-y:auto;font-size:14px}
.row{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.row .st{font-size:12.5px;white-space:nowrap}
.row .st.bad{white-space:normal;flex:2;min-width:0;line-height:1.45}   /* the server's reason is a sentence: let it wrap */
.ok{color:var(--green)} .bad{color:var(--red)} .wait{color:var(--fg3)}
.tagd{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;
  background:var(--p2);color:var(--fg3);margin-left:6px}
.tagd.exif{color:var(--green)} .tagd.none{color:var(--red)}
.big{background:var(--brass);border:none;border-radius:8px;color:#20180A;font:inherit;font-weight:600;
  font-size:18px;padding:17px 30px;cursor:pointer}
.big:disabled{opacity:.4;cursor:not-allowed}
.sofar{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.sofar h4{font-family:"Newsreader",serif;font-weight:300;font-size:20px;margin:0 0 4px}
.sofar p{color:var(--fg3);font-size:14px;margin:0 0 12px}
.stamp{margin:0;padding:5px 7px;font-size:11.5px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the plain statement before a one-way button */
.before{font-size:16px;line-height:1.5;color:var(--fg);margin:0 0 12px}
.before b{color:var(--goldtext,var(--brass))}

.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--l2);
  padding:15px 18px calc(16px + env(safe-area-inset-bottom));z-index:40}
.sheet .in{max-width:980px;margin:0 auto}
.sheet h3{font-family:"Newsreader",serif;font-weight:300;font-size:20px;margin:0 0 11px}
.sheet p{color:var(--fg2);font-size:15.5px;line-height:1.5;margin:0 0 14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button,.picker button{flex:1;min-width:145px;background:var(--p2);border:1px solid var(--line);
  border-radius:7px;color:var(--fg);font:inherit;font-size:16px;padding:15px;cursor:pointer}
.acts button:disabled{opacity:.3}
.acts button.warn{color:var(--fg2)}
.acts button.yes{background:var(--brass);border-color:var(--brass);color:#20180A;font-weight:600}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.close{background:none;border:none;color:var(--fg3);font:inherit;font-size:15px;cursor:pointer;padding:13px 0 0}
/* the photo panel's Done: grey text was not found. A full-width primary button. */
.sheet .done{display:block;width:100%;margin-top:14px;background:var(--brass);border:none;border-radius:8px;
  color:#20180A;font:inherit;font-weight:600;font-size:18px;padding:16px;cursor:pointer}
/* tap-a-photo: the one she taps is unmistakable; the rest step back */
.grid.pick .c.sel{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}
.grid.pick.has .c:not(.sel){opacity:.45}
.fqerr{color:var(--red)}

.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,16,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:13px 18px calc(14px + env(safe-area-inset-bottom));z-index:30}
.nin{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px}
.nav .before{max-width:980px;margin:0 auto 12px}
.nav button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:7px;
  padding:15px 20px;font:inherit;font-size:17px;cursor:pointer}
.nav button:disabled{opacity:.3}
.nav button.go{background:var(--brass);border-color:var(--brass);color:#20180A;font-weight:600;flex:1;max-width:260px}
.tally{font-size:13px;color:var(--fg3);line-height:1.4}
.tally b{color:var(--fg);font-size:17px;font-family:"Newsreader",serif;font-weight:400}
.sp{flex:1}
.saved{font-size:13px;color:var(--green);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

.clock{background:#241F18;border:1px solid var(--brass);border-radius:8px;padding:16px;
  margin-bottom:22px;font-size:16px;line-height:1.55}
.clock b{color:var(--goldtext,var(--brass))}
.clock .row{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;border:none;padding:0}
.clock button{background:var(--brass);border:none;border-radius:6px;color:#20180A;font:inherit;
  font-weight:600;font-size:15px;padding:12px 18px;cursor:pointer}
.clock button.no{background:none;border:1px solid var(--l2);color:var(--fg2);font-weight:400}

.lb{position:fixed;inset:0;background:rgba(6,7,9,.97);z-index:60;display:flex;align-items:center;
  justify-content:center;flex-direction:column}
.lb img{max-width:94vw;max-height:80vh;object-fit:contain}
.lb .cap{color:var(--fg2);font-size:14.5px;margin-top:14px;display:flex;gap:14px;align-items:center}
.lb .cap button{background:none;border:1px solid var(--l2);color:var(--fg);border-radius:6px;
  font:inherit;font-size:15px;padding:10px 16px;cursor:pointer}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:6px 0 10px}
.genre{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer}
.genre.on{border-color:var(--brass)}
.genre .gt{font-family:"Newsreader",serif;font-size:21px;font-weight:400;margin-bottom:4px}
.genre .gp{color:var(--fg2);font-size:15px;line-height:1.45}
.sug{font-family:"Public Sans",sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:#20180A;background:var(--brass);border-radius:4px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.sug.on{background:var(--green);color:#fff}
.helpline{text-align:right;margin:0 0 -6px}
.tips{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:15px;line-height:1.5;color:var(--fg2)}
.tips summary{cursor:pointer;color:var(--fg3);font-size:13px;letter-spacing:.06em;text-transform:uppercase;list-style:none}
.tips summary::-webkit-details-marker{display:none}
.tips summary::after{content:' \25be';} .tips[open] summary::after{content:' \25b4'}
.tips ul{margin:8px 0 2px;padding-left:18px} .tips li{margin:4px 0}
@media (min-width:900px){ .tips{float:right;width:250px;margin:6px 0 16px 22px;position:sticky;top:12px} .tips summary{pointer-events:none} .tips summary::after{content:''} .beside{max-width:calc(100% - 290px)} }
.helpline .quiet{padding:6px 0}
.help textarea{min-height:90px}
.help .reply{font-size:17px;line-height:1.55;margin:14px 0 6px;color:var(--fg)}
.help .reply.bad{color:var(--red)}
.help .ask2{color:var(--fg3);font-size:14.5px;margin:0 0 10px}
.quiet{background:none;border:none;color:var(--fg3);font:inherit;font-size:14px;cursor:pointer;padding:12px 6px;text-decoration:underline;text-underline-offset:3px}
.quiet:hover{color:var(--fg2)}
.said{font-size:16.5px;line-height:1.5;color:var(--fg2);margin:8px 0 0;padding-left:14px;border-left:3px solid var(--brass)}
.said i{color:var(--fg)}
.lookedup{font-size:13px;line-height:1.45;color:var(--fg3);margin:-4px 0 10px;padding-left:10px;border-left:2px solid var(--line)}
.ph.clip{flex-direction:column;gap:6px;padding:10px;font-size:12.5px;color:var(--fg2);line-height:1.35}
.ph.clip b{color:var(--fg);font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph.clip small{color:var(--fg3);font-size:11px}
.ph.clip .play{margin:0;padding:6px 12px;font-size:13px}
.genre .play{margin-top:10px;background:var(--p2);border:1px solid var(--l2);border-radius:6px;color:var(--fg);
  font:inherit;font-size:15px;padding:9px 14px;cursor:pointer}
.genre .play.playing{border-color:var(--brass);color:var(--brass)}
.anchor{margin-bottom:4px}
.people{display:flex;flex-direction:column;gap:8px;margin:6px 0 20px}
.person{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:13px 16px;font-size:17px}
.person.ask{border-color:var(--brass)}
.person .rel{color:var(--fg2)}
.person .acts{margin-top:10px}
.sungrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sungrow label{font-size:13px;color:var(--fg3);width:100%}
.sungrow .sungbox{width:auto;flex:1;min-width:140px;max-width:260px;padding:10px 12px;font-size:17px}
.sungrow .play{margin:0;white-space:nowrap}
.person .note{font-size:14px;color:var(--fg3);margin:8px 0 0}
.person .note.bad{color:var(--red)}
.tick{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--fg2);cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--brass)}
.load{padding:70px 0;color:var(--fg2);line-height:1.8;text-align:center}
.hide{display:none}
</style>

<style id="preview-warm">
/* 11 Oct PREVIEW - the warm, light look (pipeline/make_preview_pages.py). Contrast >= 7:1, body text >= 18 px, targets >= 44 px. */
:root{--ink:#FBF6EC;--panel:#FFFDF8;--p2:#F3EBDC;--line:#CDBB9A;--l2:#A8926B;--fg:#1F1A12;--fg2:#3F3628;--fg3:#4E4434;
  --brass:#D4A24C;--green:#2A5234;--red:#7A2812;--goldtext:#5A3B06;--goldsoft:#F6E7C4;--goldline:#A87A22}
html,body{background:var(--ink)!important;color:var(--fg)!important}
body{font-size:18px!important;line-height:1.55}
p,li,label,dd,dt,td,th,blockquote,textarea,select,input,.lede,.do,.small,.err,.hint,.note,.said,.fqhint{font-size:18px!important}
h1,h2,h3,h4{color:var(--fg)!important}
.small,.hint,.fqhint{color:var(--fg2)!important}
.err,.fqerr,[role=alert]{color:var(--red)!important}
.ok,.done{color:var(--green)!important}
a{color:var(--goldtext)!important;text-decoration:underline!important;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px!important}
/* every button is a gold box: main actions filled gold, the rest gold-bordered on pale gold */
button,.b,.chip,.quiet,input[type=button],input[type=submit]{min-height:44px!important;min-width:44px!important;font-size:18px!important;
  background:var(--goldsoft)!important;color:var(--fg)!important;border:2px solid var(--goldline)!important;border-radius:10px!important;
  padding:10px 16px!important;cursor:pointer;font-weight:600}
button.go,button.yes,button.big,button.b.yes,#go,#open,#fqnext,#tosort,#send,#allinYes,#rpick,.acts .yes{background:var(--brass)!important;
  color:#1F1A12!important;border-color:var(--goldline)!important}
button[aria-pressed=true]{background:var(--brass)!important;color:#1F1A12!important}
button:disabled{opacity:.55}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--goldline)!important;outline-offset:2px}
input[type=text],input[type=email],input:not([type]),textarea,select{background:#fff!important;color:var(--fg)!important;
  border:2px solid var(--l2)!important;min-height:48px;border-radius:8px}
input::placeholder,textarea::placeholder{color:#6A5E4C!important;opacity:1}
input[type=checkbox],input[type=radio]{width:26px!important;height:26px!important;accent-color:var(--goldline)}
label.tick,label:has(> input[type=checkbox]),label:has(> input[type=radio]){min-height:44px;display:flex!important;align-items:center;gap:10px}
.card,.box,.person,.c,.sheet .in,.in{background:var(--panel)!important;border-color:var(--line)!important;color:var(--fg)}
.c img,.lo img,.side img,.dup img,figure img,.photo img,.strip img,.ph,video{box-shadow:0 1px 3px rgba(60,40,10,.28),0 0 0 1px #E2D3B6;border-radius:6px}
#nav,.nav{background:var(--panel)!important;border-color:var(--line)!important;color:var(--fg)!important}
/* 12 Oct: EVERY label at least 18 px (Nigel) - captions, counters, tallies, section names, the drop zone's line */
.tag,.chk,.stamp,.step,.n,.badge,.tally,.tally *,.drop span,summary,.tips summary,h3,h4,.meta,.count,small{font-size:18px!important}
.n{width:auto!important;min-width:32px;height:32px!important;padding:0 6px}
/* 13 Oct: the "checking" badge sits on the photo's top-left corner, clear of the date under it (at 18 px it covered the date) */
.c .chk{top:6px!important;bottom:auto!important;left:6px!important}
/* 12 Oct: every clickable thing is a gold box (Nigel: "text they can click on needs to have something saying click") -
   the photo drop zone is a gold button like every other action; the "What helps" opener, tick boxes' labels, genre cards and
   group boxes are gold-bordered */
.drop{background:var(--goldsoft)!important;border:2px solid var(--goldline)!important;border-radius:12px!important}
.drop:hover,.drop.over{background:var(--brass)!important}
.drop b{color:var(--fg)!important;font-weight:700}
summary,.tips summary{background:var(--goldsoft)!important;border:2px solid var(--goldline)!important;border-radius:10px;
  padding:10px 14px!important;min-height:44px;display:flex;align-items:center;color:var(--fg)!important}
label.tick,.cbox,.genre,.bg{border:2px solid var(--goldline)!important;border-radius:10px;padding:8px 12px}
.goldnote{background:var(--goldsoft);border:2px solid var(--goldline);border-radius:10px;padding:10px 14px;margin:0 0 16px;
  font-size:18px;color:var(--fg)}
</style>

<script id="preview-base">
/* 11 Oct PREVIEW: served from .../preview/, every link the page builds stays inside .../preview/ */
function __pv(b){ try{ return (b&&/\/preview\/[^/]*$/.test(location.pathname))?String(b).replace(/\/?$/,'/')+'preview/':b; }catch(e){ return b; } }

<script id="a11y-focus">
/* 20 Oct (WCAG 2.2 AA - focus order 2.4.3, status messages 4.1.3; the US launch): when a screen is redrawn and the control that
   had the focus has gone, the focus moves to the new screen's heading - not lost to the top of the page - so a screen reader
   reads the new screen. Only when the heading is new (a screen that redraws itself is not read again), and never while the
   focus is still on something. */
(function(){
  var last='';
  function root(){ return document.getElementById('stage')||document.querySelector('.wrap'); }
  function fix(){
    var a=document.activeElement; if(a&&a!==document.body&&document.contains(a)) return;
    var st=root(), h=st&&st.querySelector('h1,h2'); if(!h) return;
    var t=(h.textContent||'').trim(); if(!t||t===last) return; last=t;
    if(!h.hasAttribute('tabindex')) h.setAttribute('tabindex','-1');
    try{ h.focus({preventScroll:true}); }catch(e){}
  }
  function start(){ var st=root(); if(!st||!window.MutationObserver) return; var tm=null;
    new MutationObserver(function(){ clearTimeout(tm); tm=setTimeout(fix,80); }).observe(st,{childList:true}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════
   ONE LINK.  /?t=TOKEN  is the only address the customer ever has.
   On load we ask the server where she is (journey) and show that page.
   She never sees a stage name and is never sent a second link.

     upload      → add your photos            → set_stage('describing')
     describing  → we look at every photo     → set_stage('sort')  (automatic)
     sort        → group and name them        → questions, then set_stage('answer')
     answer      → tell us about each group   → set_stage('submitted')
     submitted   → thank you
   ═══════════════════════════════════════════════════════════════════ */
const SB='https://wkgkkxeooldeyzjfzmhu.supabase.co';
const FN=SB+'/functions/v1';
const KEY='sb_publishable_0HpiB8JZzbOq3Vd9lRjuXg_V_4jQnp_';
const BUILD='2026-10-21b';                                 // bump on every change (1 Oct: there was no stamp before)
document.documentElement.dataset.build=BUILD;
let TOKEN=new URLSearchParams(location.search).get('t')||'';
/* ?a=<answer token> — somebody else answering the same memories (on a film
   with two people, BOTH accounts go in the song). whos_answering turns it into
   the collection's token and who they are; everything after that is asked AS
   THEM (p_person / person_id) and sees only their own turns. ⚠⚠ They must
   never see the other person's answers — shown his, she would simply agree. */
const ANSWER=new URLSearchParams(location.search).get('a')||'';
let ASK=null;        // {person_id, name, relation, collection_id, finished} while someone is answering
const HDR={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const words=s=>s&&s.trim()?s.trim().split(/\s+/).length:0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;

/* Postgres functions (journey, set_stage). ⚠ These answer HTTP 200 with
   {"error":"unknown token"} on a bad token — the body must be checked. */
/* 17 Oct (a tester on a phone that kept dropping): a call whose connection drops ("Load failed" / "Failed to fetch") is sent
   again by itself - 3 tries with a short wait - before anything is shown. Only a NETWORK failure is retried; an answer from the
   server (even an error) is returned as it is. The upload's own send loop handles its retries (a re-sign would add a row). */
const NET_WAITS=[1500,3000,5000];
function isNetErr(e){ return e&&(e.name==='TypeError'||/load failed|failed to fetch|network/i.test(String(e.message||e))); }
async function fetchRetry(url,opts){
  for(let i=0;;i++){
    try{ return await fetch(url,opts); }
    catch(e){ if(!isNetErr(e)||i>=NET_WAITS.length) { if(isNetErr(e)) e.network=true; throw e; } await sleep(NET_WAITS[i]); }
  }
}
async function rpc(name,args){
  const r=await fetchRetry(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:HDR,body:JSON.stringify(args)});
  if(!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  const t=await r.text();
  return t?JSON.parse(t):null;
}
/* 17 Oct (Nigel: "people are very impatient these days"; NN/g: show what is happening for any wait over about a second):
   every wait screen says WHAT is happening and why it matters to them; one that runs past 8 s adds a calm line. */
let WAIT_T=null;
function waitScreen(line){
  plain(`<p class="load" data-wait="1" role="status">${esc(line)}</p><p class="lede hide" id="waitslow">Still working on it - on a slow connection this can take up to a minute.</p>`);
  clearTimeout(WAIT_T); WAIT_T=setTimeout(()=>{ const w=$('waitslow'); if(w) w.classList.remove('hide'); },8000);
}
/* Edge functions (flow, upload, gallery, describe, questions). */
async function post(fn,body){
  const go=fn==='upload'?fetch:fetchRetry;
  const r=await go(`${FN}/${fn}`,{method:'POST',headers:HDR,body:JSON.stringify({token:TOKEN,...body})});
  let j={}; try{ j=await r.json(); }catch(_){}
  return {ok:r.ok, status:r.status, j};
}
async function api(action,extra){                       // the flow function, throws on failure
  const {ok,status,j}=await post('flow',{action,...extra});
  if(!ok) throw Object.assign(new Error(j.error||'save failed'),{status,body:j});   // 2 Oct: callers read a 409's groups/message
  return j;
}
async function setStage(stage){
  const r=await rpc('set_stage',{p_token:TOKEN,p_stage:stage});
  if(r&&r.error) throw new Error(r.error);
  J.stage=stage;
  return r;
}

/* ⚠ A caught error that is not reported is a silent failure. On 15 Sep a save
   failed for an hour and the customer lost everything, because the catch block
   swallowed it. Every catch in this page reports. Never throws. */
function report(what,e,detail){
  try{
    /* An answerer's token is refused by flow; answer-flow takes it and files
       the error against the right collection. */
    fetch(FN+(ASK?'/answer-flow':'/flow'),{method:'POST',keepalive:true,headers:HDR,
      body:JSON.stringify({token:TOKEN,action:'report_error',page:'index.html',at:what,
        what, message:(e&&e.message)||String(e||''), detail:{...(detail||{}),build:BUILD},
        url:location.href, user_agent:navigator.userAgent})}).catch(()=>{});
  }catch(_){}
}
window.addEventListener('error', ev => report('uncaught', ev.error||ev.message));
window.addEventListener('unhandledrejection', ev => report('unhandled promise', ev.reason));
const prog=o=>ASK?Promise.resolve():api('save_progress',{progress:o}).catch(e=>report('save progress',e));   // progress is the builder's; an answerer never moves it

let J={};            // what journey told us: name, stage, photos, described, owner_name …
let page='';         // which page is showing

function plain(html){ $('stage').innerHTML=html; $('stage').className='';
  $('nav').classList.add('hide'); $('sheet').classList.add('hide'); }

/* ═══ ROUTER ═════════════════════════════════════════════════════ */
async function route(){
  if(ANSWER) return routeAnswering();
  if(!TOKEN){
    plain(`<h1>This link is missing its code</h1>
      <p class="do">Please open the full link you were sent — the long one, with everything after <b>?t=</b>.</p>`);
    return;
  }
  let j;
  try{ j=await rpc('journey',{p_token:TOKEN}); }
  catch(e){ report('journey',e);
    plain(`<h1>Couldn't open your film</h1>
      <p class="do">Something didn't connect. Please try the link again in a moment.</p>
      <button class="big" id="retryRoute">Try again</button>`);
    return; }
  if(!j||j.error){
    plain(`<h1>This link isn't right</h1>
      <p class="do">Please open the full link you were sent, exactly as it came.</p>`);
    return;
  }
  J=j;
  $('helpline').classList.remove('hide');
  /* 3 Oct: YOUR DATA - download or delete everything, on the delivery page (film.html#data); the builder's link only */
  if(!ASK){ const dl=$('dataLink'); dl.href=`film.html?t=${encodeURIComponent(TOKEN)}#data`; dl.classList.remove('hide'); }
  /* 3 Oct: REFERRAL - a friend's code on the link (?ref=), recorded once against this new film; the checkout applies any
     discount later. Nothing is asked of the friend and nobody is contacted. */
  try{
    const ref=(new URLSearchParams(location.search).get('ref')||localStorage.getItem('mf_ref')||'').trim().toUpperCase();
    if(ref&&!ASK&&localStorage.getItem('mf_ref_done_'+TOKEN)!==ref){
      localStorage.setItem('mf_ref',ref);
      rpc('record_referral',{p_token:TOKEN,p_code:ref}).then(r=>{ if(r&&!r.error) localStorage.setItem('mf_ref_done_'+TOKEN,ref); })
        .catch(e=>report('record_referral',e));
    }
  }catch(e){ report('referral',e); }
  switch(j.stage){
    case 'upload':      return showUpload();
    case 'describing':  return showDescribing();
    case 'sort':        return showSort();
    case 'answer':      return showAnswer();
    case 'submitted':   return showThanks();
    default:
      report('unknown stage',new Error(String(j.stage)));
      plain(`<h1>One moment</h1>
        <p class="do">Something on our side isn't right. Please try the link again in a little while.</p>`);
  }
}

/* ═══ 1 · UPLOAD ═════════════════════════════════════════════════ */
let exifr=null, queue=[], inSoFar=0, COUNTED=0;
/* SONG LENGTH GUIDE (1 Oct): one live line from rpc estimate_film(p_photos) - its numbers and its label, never ours (they
   may change). TIER is the collection's tier when the server sends it (gallery's collection.tier); a film that needs a
   quote stops taking photos unless its tier is already 'custom'. Photos already in stay.
   ⚠ (1 Oct, gallery v10) The number sent to estimate_film is the SERVER's stats.counted - confirmed photos that are
   not duplicates (dup_of) - never a count kept here. Mid-batch the page adds what it has just confirmed to the last
   counted figure, and the moment that says "quote" it asks gallery again: the stop is only ever decided on the
   server's figure (a repeat confirmed this batch may since have been marked dup_of). */
let QUOTE=false, TIER=null, GUIDE_N=-1;
/* Every hash already in this collection, AS THE SERVER HAS IT RIGHT NOW,
   plus what went in during this visit — so she is told "already added"
   before pressing Add. ⚠ The server is the authority: sign refuses a
   duplicate itself. ⚠⚠ There used to be a copy of this list in
   localStorage, from the afternoon the server wasn't storing hashes. On 19
   Sep it refused Nigel's clip after the row had been deleted server-side —
   a client-side memory of server state is wrong every time the two diverge,
   and it gave a confident wrong answer with no way to override it. Gone,
   and purged from any browser that still has one. */
/* ⚠⚠⚠ "Already added" means THE SAME FILE — the same bytes, by SHA-256 —
   and nothing else. It used to mean the same perceptual hash, and a blurred
   frame has exactly the same 8×8 hash as the sharp one (measured 26 Sep: 0
   bits apart; a smile doesn't move it either). So in a burst, whichever frame
   went up second was refused as "already added" and lost, before anybody could
   see the pictures. A look-alike is a BURST now: it goes in, the server links
   it to its twin (same_look_as), and she chooses on the "Which one?" screen. */
let inHashes=[];                     // SHA-256s, not perceptual hashes
function remember(h){ if(h&&!inHashes.includes(h)) inHashes.push(h); }
/* SHA-256 of the file's own bytes. Taken from the ORIGINAL before a HEIC is
   converted, so the same iPhone file chosen twice still matches. Null for a
   file too big to hash in the browser — it still goes in, and the server
   decides. */
async function shaOf(file){
  try{
    if(!crypto.subtle||file.size>300*1024*1024) return null;
    const d=new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()));
    return Array.from(d,b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ report('sha256',e,{file:file.name,size:file.size}); return null; }
}
try{ Object.keys(localStorage).filter(k=>k.startsWith('memories.phash.')).forEach(k=>localStorage.removeItem(k)); }catch(_){}

/* Perceptual hash, in the browser, at upload. The browser has already decoded
   the image, so this is nearly free. 8×8 greyscale average hash: shrink to
   8×8, take the mean luminance, one bit per cell above/below the mean → 64
   bits as 16 hex characters. ⚠ Two server-side attempts failed (no
   OffscreenCanvas in Deno; ImageScript blew the memory limit) — this is the
   only place it runs. Returns null for anything the browser can't decode
   (HEIC on Chrome, most video), and that photo still goes in, just unhashed. */
async function phashOf(file){
  let bmp=null;
  try{
    if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(file.name)) return null;
    /* Let the decoder do the shrink: a 4000px photo never becomes a full-size bitmap. */
    bmp=await createImageBitmap(file,{resizeWidth:64,resizeHeight:64,resizeQuality:'high',imageOrientation:'from-image'});
  }catch(_){
    /* Fallback for decoders that refuse the resize options. */
    try{
      const url=URL.createObjectURL(file);
      try{ bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
      finally{ setTimeout(()=>URL.revokeObjectURL(url),1000); }
    }catch(_2){ return null; }
  }
  try{
    const cv=document.createElement('canvas'); cv.width=8; cv.height=8;
    const cx=cv.getContext('2d',{willReadFrequently:true});
    cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
    cx.drawImage(bmp,0,0,8,8);
    const d=cx.getImageData(0,0,8,8).data, g=new Array(64);
    let sum=0;
    for(let i=0;i<64;i++){ g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; sum+=g[i]; }
    const mean=sum/64;
    let hex='';
    for(let b=0;b<64;b+=4){
      let nib=0;
      for(let k=0;k<4;k++) nib=(nib<<1)|(g[b+k]>mean?1:0);
      hex+=nib.toString(16);
    }
    return hex;
  }catch(e){ report('phash',e,{file:file.name}); return null; }
  finally{ if(bmp&&bmp.close) bmp.close(); }
}
/* What kind of file this is. ⚠ Chrome on Windows reports an empty type for
   .heic, and a PUT sent as application/octet-stream is refused by the bucket
   (415) — that was every iPhone photo failing on 19 Sep. Name it ourselves. */
const EXT_MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',
  heic:'image/heic',heif:'image/heif',tif:'image/tiff',tiff:'image/tiff',mp4:'video/mp4',mov:'video/quicktime',m4v:'video/mp4',
  '3gp':'video/3gpp',avi:'video/x-msvideo',webm:'video/webm'};
function mimeOf(file){
  if(file.type&&file.type!=='application/octet-stream') return file.type;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  return EXT_MIME[ext]||'application/octet-stream';
}
const isHeicFile=file=>/^image\/hei[cf]$/i.test(file.type)||/\.(heic|heif)$/i.test(file.name);
/* iPhone photos come as HEIC, which no browser but Safari can draw and the
   vision pass can't read. Convert to JPEG here, once, before the hash and the
   upload. The decoder (heic-to, libheif in wasm, ~3 MB) is fetched only when a
   HEIC is actually picked. The date and camera are read from the ORIGINAL
   first, since the converted file has no EXIF. */
let heicLib=null;
async function toJpeg(file){
  if(!heicLib) heicLib=await import('https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/heic-to.js');
  const blob=await heicLib.heicTo({blob:file,type:'image/jpeg',quality:0.9});
  const name=file.name.replace(/\.(heic|heif)$/i,'')+'.jpg';
  return new File([blob],name,{type:'image/jpeg',lastModified:file.lastModified});
}

/* ── Video ─────────────────────────────────────────────────────────────
   Two kinds, and they are different things: a moving photograph (waves, a
   scooter going past — muted, a few seconds) and a VOICE — a laugh, a toast,
   a grandchild saying a name — which the song ducks for. The browser reads
   what it can from the file here: how long it is, one frame for the
   thumbnail, the hash and the vision pass, and whether anybody is talking.
   ⚠ Real Chrome draws H.264 and (with hardware) HEVC; some machines cannot
   draw HEVC at all, so a missing frame is expected and the clip still goes
   in. The audio track decodes even where the picture will not. */
const isVideoFile=file=>/^video\//i.test(file.type)||/\.(mp4|mov|m4v|3gp|webm|avi|mkv)$/i.test(file.name);
function probeVideo(file){
  return new Promise(res=>{
    const out={duration:null,frame:null,has_speech:null,frameFailed:false};
    const url=URL.createObjectURL(file); const v=document.createElement('video');
    v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
    const finish=async()=>{ try{ out.has_speech=await speechIn(file); }catch(_){ } URL.revokeObjectURL(url); res(out); };
    const timer=setTimeout(()=>{ out.frameFailed=true; finish(); },15000);
    v.onerror=()=>{ clearTimeout(timer); out.frameFailed=true; finish(); };
    v.onloadedmetadata=()=>{
      if(isFinite(v.duration)) out.duration=Math.round(v.duration*10)/10;
      v.currentTime=Math.min(1,(v.duration||0)*0.2);
    };
    v.onseeked=()=>{
      clearTimeout(timer);
      try{
        if(!v.videoWidth) throw new Error('no picture');
        const c=document.createElement('canvas'); c.width=Math.min(1280,v.videoWidth); c.height=Math.round(c.width*v.videoHeight/v.videoWidth);
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        c.toBlob(b=>{ out.frame=b||null; if(!b) out.frameFailed=true; finish(); },'image/jpeg',0.85);
      }catch(_){ out.frameFailed=true; finish(); }
    };
  });
}
/* Is anybody talking? Speech has a syllable rhythm — the loudness in the
   voice band rises and falls a few times a second and is quiet between
   words; waves, wind and engines are steady; music pulses evenly. Measured
   19 Sep on spoken, noise and tone clips: CV 1.3 / 0.08 / 0.4. ⚠ Biased
   towards YES: a voice we miss is never asked about and never heard; a
   question about waves costs one tap. The middle is left as unknown. */
async function speechIn(file){
  const ac=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,1,16000);
  let src; try{ src=await ac.decodeAudioData(await file.arrayBuffer()); }catch(_){ return null; }
  if(!src||src.duration<0.5) return null;
  const oc=new OfflineAudioContext(1,Math.ceil(Math.min(src.duration,60)*16000),16000);
  const n=oc.createBufferSource(); n.buffer=src; const bp=oc.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1000; bp.Q.value=0.7;
  n.connect(bp).connect(oc.destination); n.start();
  const x=(await oc.startRendering()).getChannelData(0);
  const W=320, env=[]; for(let i=0;i+W<=x.length;i+=W){ let e=0; for(let j=i;j<i+W;j++) e+=x[j]*x[j]; env.push(Math.sqrt(e/W)); }
  if(env.length<25) return null;
  const peak=Math.max(...env); if(peak<1e-4) return false;                       // silent track
  const active=env.filter(e=>20*Math.log10(e/peak)>-30).length/env.length;
  const mean=env.reduce((a,b)=>a+b,0)/env.length, sd=Math.sqrt(env.reduce((a,b)=>a+(b-mean)**2,0)/env.length), cv=sd/mean;
  const sm=env.map((_,i)=>env.slice(Math.max(0,i-2),i+3).reduce((a,b)=>a+b,0)/Math.min(5,i+3));
  let peaks=0; for(let i=1;i<sm.length-1;i++) if(sm[i]>sm[i-1]&&sm[i]>=sm[i+1]&&sm[i]>0.15*peak) peaks++;
  const rate=peaks/Math.max(0.5,active*env.length/50);
  if(cv>0.5||(rate>=2.5&&rate<=9&&active>0.1&&active<0.95)) return true;
  if(cv<0.25) return false;
  return null;
}

/* A 1280-px JPEG of a photograph, drawn here. describe prefers the thumb to
   the original (a full-resolution JPEG is ~48 MB decoded), and the grids
   load faster. The same bitmap gives the sharpness and brightness used to
   choose between near-identical frames (see sharpOf). Nulls when the browser
   can't decode the file; never fatal. */
async function thumbOf(file){
  const none={blob:null,sharpness:null,brightness:null};
  let bmp=null;
  try{ bmp=await createImageBitmap(file,{resizeWidth:1280,resizeQuality:'high',imageOrientation:'from-image'}); }
  catch(_){ return none; }
  try{
    const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0);
    let m={sharpness:null,brightness:null};
    try{ m=sharpOf(c); }catch(e){ report('sharpness',e,{file:file.name}); }
    return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)),...m};
  }catch(_){ return none; }
  finally{ if(bmp&&bmp.close) bmp.close(); }
}
/* Sharpness = variance of the 3×3 Laplacian over a greyscale copy about
   256 px on its long side; brightness = mean grey, 0–255. ⚠ RELATIVE
   measures: only comparable between photos measured the same way, which is
   all a burst needs ("which of these four is sharpest?"). A blurred frame
   has little edge energy, so its Laplacian is flat and the variance low. */
function sharpOf(src){
  const k=256/Math.max(src.width,src.height,1), W=Math.max(3,Math.round(src.width*Math.min(1,k))), H=Math.max(3,Math.round(src.height*Math.min(1,k)));
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(src,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data, g=new Float32Array(W*H);
  let sum=0;
  for(let i=0;i<W*H;i++){ g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; sum+=g[i]; }
  let n=0, s=0, s2=0;
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    const i=y*W+x, l=g[i-W]+g[i+W]+g[i-1]+g[i+1]-4*g[i];
    n++; s+=l; s2+=l*l; }
  const mean=s/n;
  return {sharpness:Math.round((s2/n-mean*mean)*10)/10, brightness:Math.round(sum/(W*H)*10)/10};
}

const alreadyIn=s=>!!s&&inHashes.includes(s);     // s is a SHA-256

/* saving a person: set_person is an upsert by name, so the same call sets
   the name (steps 1–2) and later the relation (step 3). ⚠ Only one person is
   "me"; a different name as me replaces the old row. */
async function savePerson(name,rel,sub,you){
  const r=await rpc('set_person',{p_token:TOKEN,p_name:name,p_relation:rel||null,p_is_subject:!!sub,p_is_you:!!you});
  if(!r||r.error) throw new Error((r&&r.error)||'set_person failed');
  const i=P.people.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
  const old=i>=0?P.people[i]:null;
  const row={name:r.name||name,relation:rel||null,is_subject:!!sub,is_you:!!you,said_as:r.said_as||(old&&old.said_as)||null,sound_ok:false};
  if(i>=0) P.people[i]=row; else P.people.push(row);
  return row;
}

/* ── hearing a name ──────────────────────────────────────────────────
   "If the correct spelling gives the wrong pronunciation, they can play
   around with spellings until it does sound right." A spelling she can't
   hear is a spelling she's guessing at. So: we propose a spelling, she plays
   it; if it's wrong she types another and plays that — iterating until it
   sounds like her husband, not choosing from a list. A tried spelling is
   instant (take_for); a new one is made (ask_for_take, about a minute) while
   she carries on with the other names. Eight new spellings a film; cached
   ones never count. */
const NEW_TAKES_CAP=8;
const TAKE_OVER='Leave it with us \u2014 we\u2019ll make sure this name is sung right before your song is made.';
function takeState(x){ return x.take&&x.take.ready?'ready':x.making?'making':'idle'; }
async function lookForTake(i,sung){
  const x=P.say[i]; if(!x||!sung) return;
  try{ const r=await rpc('take_for',{p_sung:sung}); if(r&&!r.error&&r.ready&&x.tried===sung){ x.take=r; x.making=false; paintSayRow(i); } }
  catch(e){ report('take_for',e,{sung}); }
}
async function tryTake(i){
  const x=P.say[i]; if(!x||x.busy) return;
  const sung=(x.sung||'').trim(); if(!sung){ const f=document.querySelector(`input[data-sung="${i}"]`); if(f) f.focus(); return; }
  const why=oneNameOnly(sung); if(why){ x.note=why; paintSayRow(i); return; }
  x.busy=true; x.tried=sung; x.take=null; x.chosen=false; paintSayRow(i);
  try{
    const r=await rpc('take_for',{p_sung:sung});
    if(r&&!r.error&&r.ready){ x.take=r; x.making=false; x.busy=false; paintSayRow(i); return; }     // cached: instant
    if(P.newTakes>=NEW_TAKES_CAP){ x.busy=false; x.note=TAKE_OVER; paintSayRow(i); return; }
    const q=await rpc('ask_for_take',{p_token:TOKEN,p_sung:sung,p_said_as:x.said_as||sung});
    if(!q||q.error) throw new Error((q&&q.error)||'ask_for_take failed');
    /* 15 Oct: the server's own limit (server-wanted-2026-10-15.sql): over it, she is told plainly and Nigel is told (pc_notice);
       already made: it plays now */
    if(q.status==='over_limit'){ x.busy=false; x.making=false; x.note=TAKE_OVER; paintSayRow(i); return; }
    if(q.status==='ready'&&q.sample){ x.take={...q,ready:true}; x.making=false; x.busy=false; paintSayRow(i); return; }
    P.newTakes++; x.making=true; x.busy=false; x.note=''; paintSayRow(i);
    pollTake(i,sung);
  }catch(e){ report('ask_for_take',e,{sung}); x.busy=false; x.making=false; x.note="That didn\u2019t go through \u2014 try again in a moment."; paintSayRow(i); }
}
/* 15 Oct (Nigel's own film: "Hear this spelling" waited for ever): THE PAGE NEVER WAITS FOREVER. No sample within 2 minutes ->
   plain words, and she carries on ("That's right" never waits for a sample). It keeps listening quietly for a while longer, so a
   late sample still plays. */
const TAKE_GIVE_UP_MS=120000, TAKE_LISTEN_MS=600000;
const TAKE_LATE='We couldn\u2019t play this one just now. That\u2019s fine \u2014 we check every name before the song is made.';
async function pollTake(i,sung){
  const t0=Date.now(); let n=0, gaveUp=false;
  while(Date.now()-t0<TAKE_LISTEN_MS){
    await sleep(n++<6?5000:8000);
    const x=P.say[i]; if(!x||x.tried!==sung||P.mode!=='say') return;
    try{ const r=await rpc('take_for',{p_sung:sung}); if(r&&r.ready){ x.take=r; x.making=false; if(x.note===TAKE_LATE) x.note=''; paintSayRow(i); return; } }catch(_){}
    if(!gaveUp&&Date.now()-t0>=TAKE_GIVE_UP_MS){ gaveUp=true; x.making=false; x.note=TAKE_LATE; paintSayRow(i); }
  }
}
async function chooseTake(i){
  const x=P.say[i]; if(!x||!x.take||!x.take.ready||x.busy) return;
  x.busy=true; paintSayRow(i);
  try{ const r=await rpc('chose_take',{p_token:TOKEN,p_name:x.name,p_sung:x.tried}); if(!r||r.error) throw new Error((r&&r.error)||'chose_take failed');
    x.chosen=true; x.answer='yes'; if(x.take.said_as) x.said_as=x.take.said_as; }
  catch(e){ report('chose_take',e,{name:x.name,sung:x.tried}); x.note="That didn\u2019t go through \u2014 try again."; }
  x.busy=false; paintSayRow(i); paintSayNav();
}

const CONSENT_VERSION='2026-10-05.1';

/* 18 Oct (Nigel: "one easy-to-miss sentence"): THE FILM-LENGTH METER - a big running time, a bar marked at the 3-minute
   minimum and at each tier, one plain line, and what was set aside. Every number is the SERVER's (rpc film_meter: the
   usable photos x the occasion's measured pace, the tier by photo count - the same estimate the song is made to), never
   ours; a tier's price only once it is set (nothing while empty), so the tier and its price are seen before paying.
   filmMeter(container) is used on the upload page and the sort page. Without film_meter (not applied yet) it shows nothing
   and the line below carries on as before. */
/* 20 Oct: US prices - 'usd' only for a US English browser in an American time zone (many Australians' browsers say en-US);
   the server answers before_tax for USD, and the page then says so under the price. */
function meterCurrency(){
  const l=(navigator.language||'').toUpperCase();
  let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  if(/-US$/.test(l)&&/^(America\/|Pacific\/Honolulu$|US\/)/.test(tz)) return 'usd';
  return /-NZ$/.test(l)?'nzd':/-GB$|-UK$/.test(l)?'gbp':'aud';
}
function mmssLong(sec){ const m=Math.floor(sec/60), s=Math.round(sec%60); return `${m} min ${String(s).padStart(2,'0')} s`; }
function money(c,cur){ const sym={aud:'A$',nzd:'NZ$',gbp:'\u00a3',usd:'US$'}[cur]||'$'; return sym+(c%100?(c/100).toFixed(2):String(c/100)); }
async function filmMeter(container){
  if(!container) return null;
  let m=null;
  try{ m=await rpc('film_meter',{p_token:TOKEN,p_currency:meterCurrency()}); if(!m||m.error||m.usable===undefined) throw new Error((m&&m.error)||'no meter'); }
  catch(e){ container.classList.add('hide'); return null; }
  const tiers=(m.tiers||[]).filter(t=>t.max_seconds!=null);
  const cur=(m.tiers||[]).find(t=>t.slug===m.tier)||{};
  const secs=Math.round(cur.max_seconds!=null?Math.min(+m.photo_seconds,+cur.max_seconds):+m.photo_seconds);
  const top=Math.max(600,...tiers.map(t=>+t.max_seconds));
  const pct=x=>Math.max(0,Math.min(100,x/top*100));
  const marks=[{at:180,label:'3 min'},...tiers.filter(t=>+t.max_seconds<top).map(t=>({at:+t.max_seconds,label:`${Math.round(t.max_seconds/60)} min`}))];
  let line='';
  if(+m.to_minimum>0) line=`Add ${plural(+m.to_minimum,'more photo')} to reach 3 minutes.`;
  else{
    const next=(m.tiers||[]).find(t=>+t.photos_from>+m.usable&&t.max_seconds!=null);
    if(next&&!m.needs_quote) line=`${plural(+next.more_photos,'more photo')} ${+next.more_photos===1?'moves':'move'} you to the ${String(next.label||'').replace(/^./,c=>c.toLowerCase())} film.`;
  }
  const sa=m.set_aside||{}, aside=[];
  if(+sa.bursts) aside.push(`${sa.bursts} near-identical shot${+sa.bursts===1?'':'s'} set aside`);
  if(+sa.duplicates) aside.push(`${sa.duplicates} repeat${+sa.duplicates===1?'':'s'} not counted`);
  if(+sa.blurry) aside.push(`${sa.blurry} blurry photo${+sa.blurry===1?'':'s'} set aside`);
  const price=cur.price_cents!=null&&!m.needs_quote?` \u00b7 ${money(+cur.price_cents,m.currency)}`:'';
  container.innerHTML=`<p class="meterbig" id="metertime">Your film: ${mmssLong(secs)}</p>
    <div class="meterbar" role="img" aria-label="Your film is ${mmssLong(secs)} long; the shortest film is 3 minutes">
      <div class="meterfill${secs<180?' short':''}" style="width:${pct(secs).toFixed(1)}%"></div>
      ${marks.map(k=>`<span class="metermark" style="left:${pct(k.at).toFixed(1)}%"><span>${esc(k.label)}</span></span>`).join('')}
    </div>
    <p class="metertier" id="metertier">${m.needs_quote?'':esc(cur.label||'')}${esc(price)}</p>
    ${price&&(m.before_tax||m.currency==='usd')?`<p class="lede" id="metertax">US prices are before sales tax.</p>`:''}
    ${line?`<p class="meterline" id="meterline">${esc(line)}</p>`:''}
    ${aside.length?`<p class="lede" id="meteraside">${esc(aside.join(' \u00b7 '))}</p>`:''}`;
  container.classList.remove('hide');
  return m;
}

    return {counted:Number.isFinite(+j.stats.counted)?+j.stats.counted:j.stats.total, tier:(j.collection&&j.collection.tier)||null}; }

/* 16 Oct (Nigel: NO FILM UNDER 3 MINUTES). The USABLE count is the server's (photo_counts: burst extras, duplicates, blurry and
   excluded photos set aside; a video counts its seconds; the occasion's OWN minimum). It is shown as they upload; "That's all
   my photos" and "Finished" go on only at the minimums - or with "I don't have enough photos", which sends what they have and
   tells Nigel. Never a dead end: if the server can't count (photo_counts missing), nothing is held back. */

/* date detection: EXIF, then filename, then file date.
   Also the camera's make and model (`device`), so the server can tell one
   camera from another when it looks for a clock that is set wrong. */
/* exifr reads JPEG and most HEIC. ⚠ Some HEIC files make it throw "Malformed
   EXIF data" (seen 19 Sep); the EXIF is still in there as a plain TIFF block,
   so find the TIFF header in the bytes and hand exifr that slice. */
async function exifOf(file){
  const pick=['DateTimeOriginal','CreateDate','ModifyDate','Make','Model'];
  try{ const x=await exifr.parse(file,pick); if(x&&(x.DateTimeOriginal||x.CreateDate||x.Make)) return x; }catch(_){}
  if(!isHeicFile(file)||file.size>64*1024*1024) return null;
  try{
    const b=new Uint8Array(await file.arrayBuffer());
    for(let i=0,n=b.length-4;i<n;i++){
      const mm=b[i]===0x4D&&b[i+1]===0x4D&&b[i+2]===0&&b[i+3]===0x2A, ii=b[i]===0x49&&b[i+1]===0x49&&b[i+2]===0x2A&&b[i+3]===0;
      if(!mm&&!ii) continue;
      try{ const x=await exifr.parse(b.slice(i).buffer,{tiff:true,ifd0:true,exif:true,pick}); if(x&&(x.DateTimeOriginal||x.CreateDate||x.Make)) return x; }catch(_){}
    }
  }catch(_){}
  return null;
}
/* A video's recording date is not EXIF: it is the creation time in the
   QuickTime/MP4 `mvhd` atom (seconds since 1904, UTC). The moov box sits at
   the front of a faststart file and at the END of a phone's, so look in the
   first 256 KB and the last 2 MB rather than reading the whole file. */
async function videoDate(file){
  const when=async(blob)=>{
    const b=new Uint8Array(await blob.arrayBuffer());
    for(let i=0;i<b.length-24;i++){
      if(b[i]!==0x6D||b[i+1]!==0x76||b[i+2]!==0x68||b[i+3]!==0x64) continue;   // 'mvhd'
      const ver=b[i+4]; const dv=new DataView(b.buffer,b.byteOffset+i+8);
      const secs=ver===1?Number(dv.getBigUint64(0)):dv.getUint32(0);
      const d=new Date((secs-2082844800)*1000);                                  // 1904 → 1970
      if(d.getFullYear()>1990&&d.getFullYear()<2100) return d;
    }
    return null;
  };
  try{
    const head=await when(file.slice(0,262144)); if(head) return head;
    if(file.size>262144) return await when(file.slice(Math.max(0,file.size-2*1048576)));
  }catch(_){}
  return null;
}
async function dateOf(file){
  let device=null;
  if(isVideoFile(file)){
    const d=await videoDate(file);
    if(d) return {at:d.toISOString(),src:'exif',device:null};
  }
  try{
    if(exifr){
      const x=await exifOf(file);
      const mk=(x?.Make||'').toString().trim(), md=(x?.Model||'').toString().trim();
      device=[mk,md.startsWith(mk)&&mk?md.slice(mk.length).trim():md].filter(Boolean).join(' ').slice(0,80)||null;
      const d=x?.DateTimeOriginal||x?.CreateDate||x?.ModifyDate;
      if(d instanceof Date&&!isNaN(d)){
        // A photo's timestamp carries NO timezone — the camera just wrote
        // "19 Oct, 04:17". The browser assumes that means local time and shifts
        // it by wherever the uploader happens to be sitting. Undo that shift so
        // what we store is the camera's own reading.
        const wall=new Date(d.getTime()-d.getTimezoneOffset()*60000);
        return {at:wall.toISOString(),src:'exif',device};
      }
    }
  }catch(e){ /* no EXIF, or a format exifr can't read — fall through */ }
  const m=file.name.match(/(20\d{2})[-_]?(\d{2})[-_]?(\d{2})/);
  if(m){ const d=new Date(`${m[1]}-${m[2]}-${m[3]}T12:00:00Z`); if(!isNaN(d)) return {at:d.toISOString(),src:'filename',device}; }
  if(file.lastModified){ const d=new Date(file.lastModified);
    if(!isNaN(d)&&d.getFullYear()>1980) return {at:d.toISOString(),src:'modified',device}; }
  return {at:null,src:'none',device};
}
const LABEL={exif:'date from camera',filename:'date from filename',modified:'file date only',none:'no date'};
const CLS={exif:'exif',filename:'',modified:'',none:'none'};

/* ⚠ Picking a second batch ADDS to the list. It used to replace it — six
   photos she had just watched fail vanished the moment she chose more, which
   from her side is losing them. Rows already in, already refused or failed
   stay where she can see them. */
let pickRun=0;
const MAX_VIDEO_B=50*1024*1024, MAX_PHOTO_B=25*1024*1024;     // the upload function's own limits (413 above them)
async function pick(files){
  if(QUOTE){ songGuide(COUNTED); return; }                // over the long tier: nothing more until a price is agreed
  const run=++pickRun;
  const fresh=[...files].map(f=>({file:f,status:'reading'}));
  if(!fresh.length) return;
  queue.push(...fresh);
  $('picked').classList.remove('hide'); $('send').textContent='Add these'; $('prog').style.width='0';
  $('send').disabled=true;                                 // until every new file is read and hashed
  paintQueue();
  const batch=queue.filter(q=>q.sha&&q.status!=='dup').map(q=>q.sha);   // so the same file chosen twice is caught too
  let heicNote=false;
  for(const item of fresh){
    if(run!==pickRun) return;                              // she picked again — that pick carries on from here
    const d=await dateOf(item.file); item.at=d.at; item.src=d.src; item.device=d.device;
    item.sha=await shaOf(item.file);                      // before any conversion: the file as she has it
    if(isHeicFile(item.file)){
      item.status='converting'; item.heic=true; if(!heicNote){ heicNote=true; paintQueue(); }
      try{ item.file=await toJpeg(item.file); }
      catch(e){ report('heic convert',e,{file:item.file.name,size:item.file.size}); item.unconverted=true; }
      if(run!==pickRun) return;
    }
    if(isVideoFile(item.file)){
      item.video=true; item.status='reading'; paintQueue();
      const pv=await probeVideo(item.file);
      if(run!==pickRun) return;
      item.duration=pv.duration; item.thumb=pv.frame; item.has_speech=pv.has_speech; item.noFrame=pv.frameFailed;
      if(pv.frameFailed) report('video frame',new Error('no frame'),{file:item.file.name,type:item.file.type,size:item.file.size});
      item.phash=item.thumb?await phashOf(new File([item.thumb],'frame.jpg',{type:'image/jpeg'})):null;
    }else{ item.phash=await phashOf(item.file); const th=await thumbOf(item.file);
      item.thumb=th.blob; item.sharpness=th.sharpness; item.brightness=th.brightness; }
    /* 16 Oct (her 115 MB .mov): too big is said BEFORE anything is sent - the server's own limits (a video 50 MB, a photo 25 MB) */
    const mb=Math.round(item.file.size/1048576);
    if(item.video&&item.file.size>MAX_VIDEO_B){ item.status='toobig';
      item.err=`this video is ${mb} MB - we can take videos up to 50 MB. Trim it on your phone, or choose a shorter one.`; }
    else if(!item.video&&item.file.size>MAX_PHOTO_B){ item.status='toobig';
      item.err=`this photo is ${mb} MB - we can take photos up to 25 MB.`; }
    else if(item.sha&&(alreadyIn(item.sha)||batch.includes(item.sha))) item.status='dup';
    else { item.status='ready'; if(item.sha) batch.push(item.sha); }
    paintQueue();
  }
  if(run!==pickRun) return;
  $('send').disabled=!queue.some(q=>q.status==='ready'||q.status==='failed');
}
function paintQueue(){
  const dups=queue.filter(q=>q.status==='dup'), rest=queue.filter(q=>q.status!=='dup');
  const n=rest.length, undated=rest.filter(q=>q.src==='none').length;
  const reading=queue.some(q=>q.status==='reading'), converting=queue.some(q=>q.status==='converting');
  const inn=queue.filter(q=>q.status==='done').length, failed=queue.filter(q=>q.status==='failed').length;
  $('summary').innerHTML=(n?`<strong>${plural(n,'photo')}</strong>`:'<strong>Nothing new</strong>')+
    (converting?' — <span class="ok">iPhone photos need converting — one moment.</span>':
     reading?' — having a look…':
     (n?(undated?` — <span class="bad">${undated} with no date</span>, which you'll place by hand later.`:' — all dated.'):''))+
    (inn&&inn<n?`<br>${inn} of them in so far.`:'')+
    (failed?`<br><span class="bad">${failed===1?'One':failed} didn't go in</span> — the reason is next to ${failed===1?'it':'each one'}. Press the button to try again.`:'')+
    (queue.some(q=>q.status==='held')?`<br><span class="bad">${plural(queue.filter(q=>q.status==='held').length,'photo')} not added</span> — over the longest film. Contact us for a quote; the ones already in stay.`:'')+
    (dups.length?`<br><span class="ok">You've already added ${dups.length===1?'one of these':dups.length+' of these'}</span> — we'll skip ${dups.length===1?'it':'them'}.`:'');
  const word={reading:'having a look',converting:'converting',ready:'ready',adding:'adding'};
  $('rows').innerHTML=queue.map(q=>`<div class="row"><span class="nm">${esc(q.file.name)}</span>
    <span class="st ${q.status==='done'||q.status==='dup'?'ok':q.status==='failed'||q.status==='held'||q.status==='toobig'?'bad':'wait'}">
      ${q.status==='done'?'in':q.status==='dup'?(q.err?esc(q.err):"you've already added this one")+(q.err||QUOTE?'':` <button class="chip" type="button" data-anyway="${queue.indexOf(q)}" style="padding:4px 10px;font-size:12.5px;margin-left:6px">Add it anyway</button>`):q.status==='failed'||q.status==='held'||q.status==='toobig'?(esc(q.err)||"didn't go in"):(word[q.status]||esc(q.status))}
      ${q.video?`<span class="tagd">video${q.duration?' · '+Math.round(q.duration)+' s':''}${q.has_speech?' · someone talking':''}${q.noFrame?' · no still — it’ll still be in your film':''}</span>`:''}
      ${q.src&&q.status!=='dup'?`<span class="tagd ${CLS[q.src]}">${LABEL[q.src]}</span>`:''}</span></div>`).join('');
}
/* 16 Oct (Isabelle, iPhone Safari): ONE send loop at a time - two loops signed the same photo 0.1-0.4 s apart and left
   orphan rows. While it runs, a line asks her to keep the page open; the same film open in another tab gets a gentle note. */
let SENDING=false;
async function send(){
  if(SENDING) return;
  SENDING=true; keepOpen(true);
  try{ await sendLoop(); } finally{ SENDING=false; keepOpen(false); }
}
function keepOpen(on){
  let el=$('keepopen');
  if(!el){ const b=$('send'); if(!b||!b.parentNode) return; el=document.createElement('p'); el.id='keepopen'; el.className='lede';
    el.setAttribute('role','status'); b.parentNode.insertBefore(el,b.nextSibling); }
  el.textContent=on?'Keep this page open and your phone unlocked until it says done.':'';
  el.classList.toggle('hide',!on);
}
(function otherTab(){
  try{
    const ch=new BroadcastChannel('mf_film_'+TOKEN), me=Math.random().toString(36).slice(2);
    const note=()=>{ if($('othertab')) return; const p=document.createElement('p'); p.id='othertab'; p.className='goldnote';
      p.textContent='This film is also open in another tab or window. Please use just one, so nothing is sent twice.';
      const w=document.querySelector('.wrap')||document.body; w.insertBefore(p,w.firstChild); };
    ch.onmessage=e=>{ const m=e.data||{}; if(m.from===me) return; if(m.t==='hello') ch.postMessage({t:'here',from:me}); note(); };
    ch.postMessage({t:'hello',from:me});
  }catch(_){}
})();
const PUT_TRIES=3, PUT_WAIT_MS=[2000,4000,6000];
async function putOnce(q){
  /* "Load failed" (the phone lost the connection): the same file again, up to 3 times, with a short wait */
  for(let i=0;;i++){
    try{ return await fetch(q.signed_url,{method:'PUT',headers:{'Content-Type':mimeOf(q.file)},body:q.file}); }
    catch(e){ if(i>=PUT_TRIES-1) throw e; await sleep(PUT_WAIT_MS[i]||6000); }
  }
}
function alreadyThere(status,body){
  /* 16 Oct: a 409 "The resource already exists" (KeyAlreadyExists) on a retry means the FIRST try arrived - the phone just
     lost the reply. The file IS in storage: keep the asset and go to confirm (which checks the stored file's size and type). */
  return status===409||/already exists|KeyAlreadyExists|Duplicate/i.test(body||'');
}
async function sendLoop(){
  if(QUOTE){ paintQueue(); return; }                         // over the long tier: nothing more until a price is agreed
  const who=($('who').value||'').trim()||'unknown';
  $('send').disabled=true; if($('allin')) $('allin').disabled=true;
  const todo=queue.filter(q=>q.status!=='dup'&&q.status!=='toobig');
  let done=0;
  for(const q of todo){
    if(q.status==='done'){done++;continue;}
    if(q.status==='toobig'){done++;continue;}               // refused before sending (16 Oct)
    /* Last look before it goes: something with the same hash may have gone in
       moments ago from this very batch, or from another device on the same link. */
    if(!q.force&&alreadyIn(q.sha)){ q.status='dup'; paintQueue(); continue; }
    q.status='adding'; paintQueue();
    try{
      /* A retry after a dropped connection reuses the signed URL it already
         has rather than asking for another: one reservation per photo. (The
         server also ignores unconfirmed rows when it looks for duplicates and
         clears abandoned ones, so a retry after a reload works too.) */
      if(!q.signed_url){
        const {ok,status,j}=await post('upload',{action:'sign',filename:q.file.name,mime:mimeOf(q.file),
          size:q.file.size,taken_at:q.at,date_source:q.src,uploaded_by:who,phash:q.phash,sha256:q.sha,device:q.device,
          ...(q.video?{duration_s:q.duration,has_speech:q.has_speech,frame_ok:!!q.thumb}:{})});
        /* The server is the authority on "already in": it answers
           {duplicate:true, of:<filename>, message} instead of a signed URL. It
           knows about every device; the page's own list only knows this one. */
        if(j.duplicate){ q.status='dup'; q.err=j.message||''; q.of=j.of||''; remember(q.sha); paintQueue(); continue; }
        if(!ok&&!j.detail&&/unsupported file type|mime/i.test(j.error||'')){ const ext=(q.file.name.split('.').pop()||'').toLowerCase();
          const e=new Error(`we can't take .${ext} files — photos and short videos only`); e.detail={http:status,server:j.error,mime:mimeOf(q.file)}; throw e; }
        /* ⚠ 409 "This one is finished": she has already said that's everything
           and the server keeps that promise, whatever tab or back button got
           her here. Stop the batch, say so in the server's words, and take her
           to where she actually is. */
        if(status===409){ finished(j.detail||j.error||"You've already told us that's everything, so we can't add more photos to this film."); return; }
        /* the server's plain explanation (a finished video; a photo over 25MB or a video over 50MB - upload 413, checked live 2 Oct) is `detail`; `error` is its code word */
        if(!ok){ const e=new Error(j.detail||j.error||'rejected'); e.detail={http:status,server:j.error||null}; throw e; }
        q.signed_url=j.signed_url; q.asset_id=j.asset_id;
      }
      const put=await putOnce(q);
      let body='';
      if(!put.ok){ try{ body=await put.text(); }catch(_){} }
      if(!put.ok&&!alreadyThere(put.status,body)){
        if(put.status>=400&&put.status<500) q.signed_url=null;   // expired or refused — sign afresh next time
        /* ⚠ Never "upload failed" with no reason. Say what the server said, in
           her words where we know them, and keep the raw reply for the log. */
        let why=''; try{ why=JSON.parse(body).message||''; }catch(_){}
        const ext=(q.file.name.split('.').pop()||'').toLowerCase();
        const plainWhy=/mime type/i.test(why)?`we can't take .${ext} files yet`:(why||`the upload was refused (HTTP ${put.status})`);
        const e=new Error(plainWhy); e.detail={http:put.status,server:body.slice(0,300),mime:mimeOf(q.file),ext,size:q.file.size};
        throw e; }
      if(q.thumb) await sendThumb(q);
      const c=await post('upload',{action:'confirm',asset_id:q.asset_id,phash:q.phash,sha256:q.sha,device:q.device,
        ...(q.video?{duration_s:q.duration,has_speech:q.has_speech,frame_ok:!!q.thumb,thumb_path:q.thumb_path||null}
                   :{sharpness:q.sharpness??null,brightness:q.brightness??null})});
      if(!c.ok) throw new Error(c.j.error||'confirm failed');
      q.status='done';
      remember(q.sha);
      inSoFar++; COUNTED++;                                 // provisional until gallery says otherwise
      let e=await songGuide(COUNTED);
      if(e&&QUOTE){ const s=await countedNow(); if(s){ COUNTED=s.counted; TIER=s.tier; e=await songGuide(COUNTED); } }
      if(e&&QUOTE){                                         // stop here: the rest are not sent, the ones in stay
        queue.forEach(x=>{ if(x.status==='ready'||x.status==='failed'||x.status==='adding') { x.status='held'; x.err='not added — over the longest film; contact us for a quote'; } });
        paintQueue(); break; }
    }catch(e){ q.status='failed'; q.err="didn't go in — "+e.message; report('upload',e,{file:q.file.name,size:q.file.size,mime:mimeOf(q.file),heic:!!q.heic,...(e.detail||{})}); }
    done++; $('prog').style.width=Math.round(done/Math.max(1,todo.length)*100)+'%'; paintQueue();
  }
  const failed=queue.filter(q=>q.status==='failed').length;
  $('send').disabled=!failed||QUOTE;
  $('send').textContent=QUOTE?'Stopped — contact us for a quote':failed?`Try the ${failed} that didn't go in`:'All in';
  $('file').value='';
  if(!failed&&!QUOTE){ setTimeout(()=>{ if(page!=='upload'||queue.some(q=>q.status==='failed'||q.status==='held')) return;
    queue=[]; $('picked').classList.add('hide'); $('send').textContent='Add these'; $('prog').style.width='0'; },2200); }
  await look();
}
function finished(sentence){
  queue.forEach(q=>{ if(q.status==='adding'||q.status==='ready') q.status='not added'; });
  paintQueue();
  const s=$('sheet');
  s.innerHTML=`<div class="in"><h3>This one is finished</h3><p>${esc(sentence)}</p>
    <div class="acts"><button class="yes" id="retryRoute">Carry on</button></div></div>`;
  s.classList.remove('hide');
  report('upload after submitted',new Error('409'),{queued:queue.length});
}
/* The thumbnail — a clip's frame or a photograph's 1280-px JPEG — goes up
   through sign-thumb: {token, asset_id} → {path, signed_url}, the path derived
   from the asset's own storage path (<collection>/thumbs/<uuid>.jpg), so it
   can land nowhere else. thumb_path is recorded by the server at once; if the
   bytes never arrive, describe falls through to the transcript or the honest
   line. Never fatal here. */
async function sendThumb(q){
  try{
    const {ok,status,j}=await post('sign-thumb',{asset_id:q.asset_id});
    if(!ok||!j.signed_url){ report('sign-thumb',new Error(j.error||('HTTP '+status)),{asset:q.asset_id}); return; }
    const put=await fetch(j.signed_url,{method:'PUT',headers:{'Content-Type':'image/jpeg'},body:q.thumb});
    if(!put.ok) throw new Error('thumb PUT '+put.status);
    q.thumb_path=j.path||null;
  }catch(e){ report('send thumb',e,{asset:q.asset_id}); }
}
async function look(){
  const {ok,j}=await post('gallery',{});
  if(page!=='upload') return;
  if(!ok){ $('sofarP').textContent="Couldn't check what's in. It will show once you add some."; report('gallery',new Error(j.error||'gallery failed')); return; }
  inSoFar=j.stats.total;
  COUNTED=Number.isFinite(+j.stats.counted)?+j.stats.counted:j.stats.total;   // gallery < v10 had no counted
  GAL={}; (j.assets||[]).forEach(a=>{ if(a.id) GAL[a.id]=a; });   // the burst screen's pictures
  /* The SHA-256s of everything already in, so the same file a second time is
     caught before it is sent. gallery may not carry them; flow load may. */
  let hs=j.assets.map(a=>a.sha256).filter(Boolean);

    :'They will appear here as they go in.';

    const heic=/hei[cf]/i.test(a.mime_type), vid=/^video/.test(a.mime_type)||/\.(mp4|mov|m4v|3gp|webm)$/i.test(a.storage_path||'');

    const gone=a.intake==='removed'||a.intake==='could_not_check';

    return `<div class="c" style="cursor:default" data-intake="${esc(a.intake||'')}">${top}${badge}<p class="stamp">${when}${a.uploaded_by?' · '+esc(a.uploaded_by):''}</p></div>`;
  }).join('');

}
/* 17 Oct (a live tester: 48 photos failed with "Load failed", the page let her move on and submit, and the second half of her

/* ═══ 1b · WHICH ONE? — near-identical photographs ══════════════════
   AFTER upload, BEFORE describe: describing is a model call per photograph
   (400 ≈ 27 minutes), and cutting the bursts first costs nothing.
     rpc find_bursts     {p_token}         → groups anything taken within 40 s
     rpc burst_groups    {p_token}         → each group, our pick first, sharpness on each
     rpc keep_from_burst {p_token, p_keep} → the ids she keeps, sent once at the end
   ⚠⚠⚠ NOTHING IS DELETED. The ones she doesn't pick stay in the collection
   and go in the bonus film, and the screen says so, or people refuse to
   choose. Most customers have no bursts and never see this screen. If
   finding them fails she is not stopped: every photo goes on to be described,
   which costs time, not photographs. */
let GAL={}, BZ={on:false,groups:[],i:0,keep:[]};
async function findBursts(){
  try{
    const f=await rpc('find_bursts',{p_token:TOKEN}); if(f&&f.error) throw new Error(f.error);
    const g=await rpc('burst_groups',{p_token:TOKEN}); if(g&&g.error) throw new Error(g.error);
    const list=Array.isArray(g)?g:((g&&(g.groups||g.bursts))||[]);
    return list.map(x=>{
      const ph=(Array.isArray(x)?x:(x.photos||x.assets||x.photographs||[])).map(p=>({...(GAL[p.id||p.asset_id]||{}),...p,id:p.id||p.asset_id}));
      const flagged=ph.some(p=>p.pick===true||p.our_pick===true||p.is_pick===true);
      ph.forEach((p,i)=>{ p.pick=flagged?(p.pick===true||p.our_pick===true||p.is_pick===true):i===0; });   // "our pick first"
      return {id:x.id||x.burst_id||null,photos:ph.filter(p=>p.id)};
    }).filter(x=>x.photos.length>1);
  }catch(e){ report('bursts',e); return []; }
}
function paintBurst(){
  const g=BZ.groups[BZ.i], keep=BZ.keep[BZ.i], n=g.photos.length, N=BZ.groups.length;
  let h=`<div class="step">Similar photos${N>1?` · <b>${BZ.i+1}</b> of ${N}`:''}</div>
    <h1>Which would you like in your film?</h1>
    <p class="do">Here are ${n} very similar photos taken around the same time — which would you like in the final film? Tap to choose. You can pick more than one.</p>
    <p class="lede">We’ve ticked the one we’d choose. Nothing is thrown away — the rest stay in your full album.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-bottom:14px">`;
  g.photos.forEach(p=>{ const on=keep.has(p.id), src=p.thumb_url||p.url;
    h+=`<div class="c${on?' sel':''}" data-burst="${esc(p.id)}" role="checkbox" aria-checked="${on}" tabindex="0">
      ${src?`<img src="${esc(src)}" alt="" style="aspect-ratio:auto;object-fit:contain">`:`<div class="ph">no preview</div>`}
      ${on?'<div class="tag">In the film</div>':''}${p.pick?'<div class="n" style="width:auto;padding:0 8px;border-radius:4px">our pick</div>':''}</div>`; });
  h+=`</div><p class="lede"><button class="chip" id="bzall" type="button" ${BZ.sending?'disabled':''}>Keep them all</button></p>`;
  $('stage').innerHTML=h; $('stage').className='';
  nav(`<button class="go" id="bznext" ${!keep.size||BZ.sending?'disabled':''}>${BZ.sending?'One moment…':'Next →'}</button>`,
      keep.size?`${keep.size} of ${n} in the film`:'Tap at least one',true,
      BZ.failed?"That didn't go through. Please press Next again.":'');
