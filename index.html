async function burstNext(){
  if(!BZ.keep[BZ.i].size||BZ.sending) return;
  if(BZ.i<BZ.groups.length-1){ BZ.i++; paintBurst(); scrollTo(0,0); return; }
  BZ.sending=true; BZ.failed=false; paintBurst();
  const keep=BZ.keep.flatMap(s=>[...s]);
  const left=BZ.groups.reduce((a,g,i)=>a+g.photos.length-BZ.keep[i].size,0);
  try{ const r=await rpc('keep_from_burst',{p_token:TOKEN,p_keep:keep}); if(r&&r.error) throw new Error(r.error); }
  catch(e){ report('keep_from_burst',e,{keep:keep.length,left}); BZ.sending=false; BZ.failed=true; paintBurst(); return; }
  await toDescribing(left,()=>{ BZ.sending=false; BZ.failed=true; paintBurst(); });
}

/* ═══ 2 · WHILE WE LOOK — the music page ══════════════════════════
   Looking at every photograph takes about four seconds each (measured 19 Sep:
   80 photographs ≈ 5 minutes). Listening to the twelve samples takes about
   as long. So they are the same screen: the scan runs quietly in the corner
   while she tells us about the music and has a listen. Everything is on the
   page — no "choose from a list" link, nothing to click to reveal. ⚠ Nothing
   here invites her to leave; a reload lands back here and carries on. When
   the scan is finished the page says so and the button to sorting appears. */
let describeRun=0, scan={described:0,total:0,done:false,stalled:false};
/* 17 Oct: THE WAIT, SAID. "Looking at each of your photos so we can ask you the right questions - 52 of 87, about 4 minutes
   left": the estimate from the MEASURED rate (the first minute: about 4 s a photo, measured 19 Sep) and only when more than
   10 seconds are left (NN/g). A dropped reply is retried quietly - the server keeps what it already described, so a retry
   carries on from there and never pays twice. After 3 failed tries in a row: "Your connection dropped - we'll carry on as
   soon as it's back." Never "snag" or "error" for something we retry. Describing also carries on WITHOUT the page (the PC
   takes over when the phone goes quiet - pipeline/describe_driver.py), so she can truly close it. */
const DESC_S_PER_PHOTO=4;
let RATE=[];                                   // [ms, described] as the count moves
function showDescribing(){
  page='describing'; screen='describing';
  setTimeout(()=>{ const st=$('stage'); if(st&&!$('unotices')){ const d=document.createElement('div'); d.id='unotices'; st.prepend(d); } startNotices(); },0);
  scan={described:+J.progress_n||+J.described||0,total:+J.progress_of||+J.photos||0,done:false,stalled:false,fails:0,stalls:0,seen:''};
  RATE=[];
  waitScreen('Getting the music ready while we start looking at your photos\u2026');
  G.finishMode=false;
  loadMusic().then(()=>{ if(page!=='describing') return; paintMusic(); scrollTo(0,0); describeLoop(++describeRun); });
}
function noteRate(){
  const now=Date.now(); const last=RATE[RATE.length-1];
  if(!last||last[1]!==scan.described) RATE.push([now,scan.described]);
  if(RATE.length>12) RATE.shift();
}
function secondsLeft(){
  const left=Math.max(0,scan.total-scan.described); if(!left) return 0;
  if(RATE.length>=2){ const [t0,d0]=RATE[0], [t1,d1]=RATE[RATE.length-1];
    if(d1>d0&&t1>t0) return left*((t1-t0)/1000)/(d1-d0); }
  return left*DESC_S_PER_PHOTO;
}
function leftWords(sec){
  if(sec<=10) return '';
  if(sec<60) return 'less than a minute left';
  const m=Math.round(sec/60); return m<=1?'about a minute left':`about ${m} minutes left`;
}
async function describeLoop(run){
  let wait=3000;
  while(page==='describing'&&run===describeRun){
    try{
      const {ok,status,j}=await post('describe',{});
      if(!ok||j.error) throw new Error(j.error||('describe: HTTP '+status));
      if(page!=='describing'||run!==describeRun) return;
      scan.described=+j.described||0; scan.total=+j.total||(scan.described+(+j.remaining||0));
      scan.done=!!j.done; scan.trouble=false; scan.fails=0; scan.offline=false;
      scan.checking=+j.checking||0; scan.removed=+j.removed||0; scan.unchecked=+j.could_not_check||0;
      if(Array.isArray(j.just)&&j.just.length){ const d=j.just[j.just.length-1]; scan.seen=String((d&&d.description)||'').slice(0,140); }
      noteRate();
      if(j.done){ scan.stalled=false; paintScan(); prog({screen:'describing',done:true}); return; }
      if(j.stalled){
        /* a stall is retried quietly first (a reply lost mid-batch can look like one); only a stall that persists is said - and
           calmly. If what's left is only clips, she may carry on: the clips are still in the film. */
        scan.stalls=(scan.stalls||0)+1;
        if(scan.stalls>=3){
          scan.stalled=true;
          if(scan.stalls===3) report('describe stalled',new Error('stalled'),{described:scan.described,total:scan.total,remaining:+j.remaining||0,failed:+j.failed||0});
          try{ const cs=await rpc('clip_state',{p_token:TOKEN}); const undone=(cs&&cs.clips||[]).filter(c=>!c.described).length;
            scan.onlyClipsLeft=undone>0&&undone>=(+j.remaining||0); }catch(_){ scan.onlyClipsLeft=false; }
        }
        paintScan();
        await sleep(scan.stalls>=3?15000:4000); continue;
      }
      scan.stalls=0; scan.stalled=false;
      paintScan();
      /* a call that did nothing: don't hammer. 7 Oct: when all that is left is photos still being CHECKED on our side (the
         worker looks every couple of minutes), ask every 15 s, not every 3. */
      wait=3000; await sleep(+j.this_call>0?400:(scan.checking>0?15000:3000));
    }catch(e){
      scan.fails=(scan.fails||0)+1;
      if(scan.fails>=3) scan.offline=true;                 // fetchRetry already tried 3 times under each of these
      if(scan.fails===3) report('describe',e,{network:!!e.network});
      paintScan();
      await sleep(wait); wait=Math.min(wait*2,15000);
    }
  }
}
/* 7 Oct: photos we didn't use are SAID - never a silent drop. 'removed' is the nudity check; 'could_not_check' is our fault. */
function notUsedLine(){
  const out=[];
  if(scan.removed) out.push(`${scan.removed===1?'One photo':plural(scan.removed,'photo')} couldn't be included. Our films don't include nudity.`);
  if(scan.unchecked) out.push(`${scan.unchecked===1?'One photo':plural(scan.unchecked,'photo')} couldn't be checked, so ${scan.unchecked===1?"it won't":"they won't"} be used. We've been told and we're looking into it.`);
  return out.join(' ');
}
function scanLine(){
  if(scan.done) return `All ${plural(scan.total,'photo')} looked at.`+(notUsedLine()?' '+notUsedLine():'');
  if(scan.offline) return `Your connection dropped - we'll carry on as soon as it's back.`;
  if(scan.checking>0&&!scan.stalled) return `Checking your photos so they're safe to use - ${scan.checking} still being checked`;
  if(scan.stalled&&scan.onlyClipsLeft) return `All your photos looked at. We couldn't look inside your video clips - they'll still be in your film.`;
  if(scan.stalled) return `Some photos are taking longer to look at - we're still on it.`;
  if(!scan.total) return `Looking at each of your photos so we can ask you the right questions\u2026`;
  const left=leftWords(secondsLeft());
  return `Looking at each of your photos so we can ask you the right questions - ${scan.described} of ${scan.total}${left?', '+left:''}`;
}
function scanShort(){
  if(scan.done) return `All ${scan.total} looked at`;
  if(scan.offline) return 'Connection dropped - carrying on when it’s back';
  if(scan.stalled) return 'Still on it';
  if(!scan.total) return 'Looking at your photos';
  const left=leftWords(secondsLeft());
  return `${scan.described} of ${scan.total}${left?' · '+left:''}`;
}
function scanExtra(){
  if(scan.done) return '';
  return (scan.seen?`<span class="seen">Just looked at: \u201c${esc(scan.seen)}\u201d</span><br>`:'')+
    `<span class="leave">You can close this page - we'll keep going, and the link in your email brings you back here.</span>`;
}
function paintScan(){
  const el=$('scan'); if(el){ el.textContent=scanLine();
    let x=$('scanx'); if(!x){ x=document.createElement('p'); x.id='scanx'; x.className='lede'; el.parentNode&&el.parentNode.insertBefore(x,el.nextSibling); }
    x.innerHTML=scanExtra(); }
  const t=document.querySelector('#nav .tally'); if(t) t.innerHTML=esc(scanShort());   // 17 Oct: short in the bar - the button keeps its room
  const go=scan.done||(scan.stalled&&scan.onlyClipsLeft);
  const b=$('tosort'); if(b){ b.disabled=!go; b.textContent=go?'Next: put them in order →':'Looking…'; }
  const r=$('dretry'); if(r) r.classList.toggle('hide',!(scan.stalled&&!scan.onlyClipsLeft));
}
async function toSort(){
  const b=$('tosort'); if(!b||!(scan.done||(scan.stalled&&scan.onlyClipsLeft))) return;
  b.disabled=true; b.textContent='One moment…';
  if(audio){ audio.pause(); audio=null; }
  try{ await setStage('sort'); }
  catch(e){ report('set_stage sort',e); b.disabled=false; b.textContent='Next: put them in order →';
    const before=$('nav').querySelector('.before'); if(before) before.textContent="That didn't go through. Please press it again."; return; }
  prog({screen:'sort'});
  showSort();
}

/* ═══ 3 · SORT — group and name ══════════════════════════════════ */
const REG={ lively:3.5, wry:3.5, warm:4.0, awe:4.5, tender:5.0, grief:6.5 };
const LAB={ lively:'Busy, fun', wry:'Funny', warm:'Warm', awe:'Big scenery',
            tender:'Quiet, tender', grief:'Sad' };
let A=[], M=[], dups=[], screen='welcome', cur=0, sel=null, picking=false,
    zoom=null, skew=null, skewDone=false, name='';
/* 2 Oct (Nigel & Leisa's wedding test):
   UN  — photographs in NO group ("not in a group yet"). Listed plainly; never lost. A photo in no group is not in the
         film until it is put in one (the server keeps it with no chapter).
   SUG — rpc suggested_groups {p_token} → {ok, occasion, groups:[{title, hint}]}. An occasion with suggestions (a
         wedding has 7) sorts on THE BOARD: every photo and every suggested group on one screen, tap a photo then a
         group (or drag it), "Add your own group". An occasion with none keeps the date grouping (propose()).
   2 Oct (flow v14 + save_groups, LIVE): groups are updated IN PLACE by id (else by title) and answers are never deleted,
         so the page's lock is gone - rename, reorder, move and remove all save. Removing a group that holds answers is
         refused by the server: HTTP 409 {error:'answered_groups', groups:[titles], message} with nothing changed. The
         page then shows that message and the names (refusedNote) and reloads the groups from the server. */
let UN=[], SUG=[], BSEL=null, UNASK=false;
window.__sort={get M(){return M},get cur(){return cur},set cur(v){cur=v;sel=null;picking=false},get screen(){return screen},get page(){return page},paint:()=>paint(),save:()=>queueSave()};   // 20 Oct: sortsplit.js (one memory, several times - the split suggestion)

const secs=m=>m.photos.filter(p=>!p.excluded)
  .reduce((t,p)=>t+REG[m.register]+(p.faces==null?0:p.faces>=4?1.5:p.faces>=2?0.5:p.faces?0:-0.5),0);
const total=()=>M.reduce((t,m)=>t+secs(m),0);
const onCount=()=>M.reduce((t,m)=>t+m.photos.filter(p=>!p.excluded).length,0);   // 2 Oct: photos IN the film's groups (not the unsorted)

let saveTimer=null, dirty=false, failed=false, editN=0;
function flash(ok){ const s=$('saved'); if(!s) return;
  s.textContent=ok?'saved':"couldn't save — trying again";
  s.style.color=ok?'var(--green)':'var(--red)';
  s.classList.add('on'); if(ok) setTimeout(()=>s.classList.remove('on'),1400); }
const hasPhotos=m=>!!(m&&m.photos.some(p=>!p.excluded));
/* A save the server REFUSED (409 answered_groups): nothing changed there. Say why, with the groups' names, and put the
   page back to the server's groups. Shared by the grouping screens and the help assistant. */
const isRefusal=e=>!!(e&&e.status===409&&e.body&&e.body.error==='answered_groups');
function refusedNote(body){ const s=$('sheet'); const g=Array.isArray(body&&body.groups)?body.groups:[];
  s.innerHTML=`<div class="in"><h3>That group can’t be removed</h3>
    <p class="lede" style="margin:6px 0 10px">${esc((body&&body.message)||'These groups already have answers, so they can’t be removed.')}</p>
    ${g.length?`<p class="lede" style="margin:0 0 14px"><b>${g.map(esc).join(', ')}</b></p>`:''}
    <p class="lede" style="margin:0 0 14px">Nothing has changed — your groups are back as they were.</p>
    <button class="done" id="cancel">OK</button></div>`; s.classList.remove('hide'); }
let refused=false;
function queueSave(){ dirty=true; editN++; clearTimeout(saveTimer); saveTimer=setTimeout(saveGroups,1200); }
async function saveGroups(){
  if(!dirty) return;
  /* ⚠ A save already in flight must not clear `dirty` for edits made after its
     payload was built — that lost the last group's name once. Remember which
     edit this save carries, and only call it clean if nothing came after. */
  const n=editN, snap=M.filter(hasPhotos);        // 2 Oct: an empty group is never saved (and never asks for a name)
  M.forEach(m=>{ if(!hasPhotos(m)) m.id=null; });
  /* 2 Oct: NO 'story' in a regroup. load's story is her words + the answers; sending it back made the server (which
     writes a story only when the key is sent) compare it with her own words and, where she had typed some, copy the
     answers into them. These screens never edit a story, so they never send one. */
  const payload={ groups:snap.map(m=>({...(m.id?{id:m.id}:{}),title:m.title,register:m.register,
      assets:m.photos.filter(p=>!p.excluded).map(p=>p.id),
      hero:(m.photos.find(p=>p.is_hero)||{}).id||null})),
    excluded:A.filter(p=>p.excluded).map(p=>p.id) };
  try{
    const r=await api('save_groups',payload);
    if(!r.ids||r.ids.length!==snap.length) throw new Error('no ids back');
    snap.forEach((m,i)=>{ m.id=r.ids[i]; });   // ⚠ answers save against these
    failed=false; flash(true);
    if(editN===n) dirty=false;
    else { clearTimeout(saveTimer); saveTimer=setTimeout(saveGroups,300); }   // newer edits — go again
  }catch(e){
    if(isRefusal(e)){                                    // refused, nothing changed: never retried; back to the server's groups
      dirty=false; failed=false; refused=true; clearTimeout(saveTimer);
      report('save groups refused (409)',e,{groups:e.body.groups});
      try{ await showSort(); }catch(e2){ report('reload after 409',e2); }
      refusedNote(e.body); return; }
    dirty=true; failed=true; flash(false); report('save groups',e,{memories:M.length,photos:onCount()});
    setTimeout(saveGroups,4000); }
}

/* clock skew between two cameras */
function detectSkew(){
  const byCam={};
  A.forEach(p=>{ const k=/^DSC/i.test(p.original_filename)?'B':'A'; (byCam[k]=byCam[k]||[]).push(p); });
  if(!byCam.A||!byCam.B||byCam.A.length<5||byCam.B.length<5) return null;
  const g=byCam.B.map(b=>{let best=0,bd=1e15;
    byCam.A.forEach(a=>{const d=new Date(b.taken_at)-new Date(a.taken_at);
      if(Math.abs(d)<bd){bd=Math.abs(d);best=d;}}); return best/3600000;}).sort((x,y)=>x-y);
  const med=g[Math.floor(g.length/2)], r=Math.round(med);
  return (Math.abs(med-r)<0.4&&Math.abs(r)>=1)?r:null;
}
/* duplicate pairs: near-identical hash, not the same moment.
   ⚠ Never a pair she has already answered for on the "Which one?" screen —
   two photos in the same burst (flow load's burst_id) were put to her there,
   and asking again here is asking the same question twice (walked 26 Sep). */
function findDups(){
  const out=[]; const seen=new Set();
  for(let i=0;i<A.length;i++) for(let j=i+1;j<A.length;j++){
    const a=A[i],b=A[j];
    if(!a.phash||!b.phash||seen.has(b.id)) continue;
    if(a.burst_id!=null&&a.burst_id===b.burst_id) continue;
    /* ⚠ 28 Sep: an 8x8 hash cannot tell one person-in-the-middle photo from another.
       On an anniversary set it paired 14 photos taken 8 days to 8 years apart, and
       none was a duplicate. Only ask about two photos taken at the same moment. */
    const ta=Date.parse(a.taken_at), tb=Date.parse(b.taken_at);
    if(!Number.isFinite(ta)||!Number.isFinite(tb)||Math.abs(ta-tb)>10*60*1000) continue;
    if(hamming(a.phash,b.phash)<=6){ out.push([a,b]); seen.add(b.id); }
  }
  return out;
}
function hamming(x,y){ let n=0;
  for(let i=0;i<Math.min(x.length,y.length);i++){ let v=parseInt(x[i],16)^parseInt(y[i],16); while(v){n+=v&1;v>>=1;} }
  return n; }

/* the one grouping proposal
   ⚠ A fixed gap threshold produces far too many groups — the first real user
   spent most of her time merging them back together. Instead: aim for a
   sensible NUMBER of groups and split at the biggest gaps. */
function propose(){
  const on=A.filter(p=>!p.excluded);
  M=[];
  if(!on.length) return;
  const want=Math.max(4,Math.min(10,Math.round(on.length/8)));
  const gaps=[];
  for(let i=1;i<on.length;i++) gaps.push({i,d:new Date(on[i].taken_at)-new Date(on[i-1].taken_at)});
  /* ⚠ Aiming for a number alone can still leave one enormous group — the first
     run put 47 photographs from three days into one. Take the biggest gaps,
     then keep splitting anything oversized. Bounded: every pass must add a cut. */
  const MAXG=18;
  const sorted=gaps.slice().sort((a,b)=>b.d-a.d);
  const cuts=new Set(sorted.slice(0,Math.max(0,want-1)).map(g=>g.i));
  let passes=0;
  while(passes++<60){
    const bounds=[0,...[...cuts].sort((a,b)=>a-b),on.length];
    let biggest=null;
    for(let k=1;k<bounds.length;k++){ const size=bounds[k]-bounds[k-1];
      if(size>MAXG&&(!biggest||size>biggest.size)) biggest={from:bounds[k-1],to:bounds[k],size}; }
    if(!biggest) break;
    const inner=sorted.find(g=>g.i>biggest.from&&g.i<biggest.to&&!cuts.has(g.i));
    if(!inner) break;
    const before=cuts.size; cuts.add(inner.i); if(cuts.size===before) break;
  }
  let c={title:'',register:'warm',story:'',photos:[]}; M.push(c);
  on.forEach((p,i)=>{ if(cuts.has(i)){ c={title:'',register:'warm',story:'',photos:[]}; M.push(c); } c.photos.push(p); });
}

/* A photo shows itself. A clip shows its frame; a clip with NO frame (an
   iPhone HEVC .MOV on a machine that can't draw it) gets a proper card — the
   name, the length, a play button and a sentence — because a blank tile is a
   mystery and a labelled one is fine. Never a broken image. */
let CLIPS={};
const isClip=p=>/\.(mp4|mov|m4v|3gp|webm|avi|mkv)$/i.test(p.storage_path||'');
const clipOf=p=>CLIPS[p.id]||{};
/* 20 Oct (WCAG 2.2 AA, the US launch): every photo says what it is to a screen reader - its description when we have one, else
   "Your photo" and its date. */
function photoAlt(p){ const d=p&&p.taken_at?new Date(p.taken_at):null, desc=String((p&&p.description)||'').trim().slice(0,140);
  return esc((desc||'Your photo')+(d&&!isNaN(d)?', '+d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'')); }
function tile(p){
  if(!isClip(p)) return `<img src="${p.thumb_url||p.url}" alt="${photoAlt(p)}" loading="lazy" decoding="async">`;
  const c=clipOf(p), secs=c.seconds_in_film||c.duration_s||null, talk=c.has_speech?(c.voice_wanted===false?'voice kept quiet':'someone talking'):'';
  if(p.thumb_url&&c.frame_ok!==false) return `<img src="${p.thumb_url}" alt="Your video" loading="lazy" decoding="async"><div class="tag">VIDEO${secs?' · '+Math.round(secs)+' s':''}</div>`;
  return `<div class="ph clip"><b>${esc(p.original_filename||'video')}</b>
    <span>${secs?Math.round(secs)+' seconds':'video'}${talk?' · '+talk:''}</span>
    <button class="play" type="button" data-playclip="${esc(p.url||'')}" aria-label="Play ${esc(p.original_filename||'this clip')}">▶ Play</button>
    ${c.frame_ok===false?`<small>We couldn’t get a still from this one — it’ll still be in your film.</small>`:''}</div>`;
}
async function showSort(){
  page='sort';
  waitScreen('Bringing in your photos so you can put them in order\u2026');
  try{
    const d=await api('load',{});
    A=d.assets.filter(a=>a.url&&a.in_film!==false);   // a burst frame she didn't pick stays in her full album, not in the film
    if(!A.length){
      plain(`<h1>No photos yet</h1><p class="do">We couldn't find any photos in your film. Please get in touch with whoever sent you this link.</p>`);
      report('sort with no assets',new Error('no assets')); return; }
    A.sort((a,b)=>new Date(a.taken_at)-new Date(b.taken_at));
    photoCounts(true).then(()=>{ if(page==='sort'&&(screen==='organise'||screen==='board')) paint(); });   // 18 Oct: the limits
    name=d.collection.owner_name||'';
    skew=detectSkew();
    UN=[]; BSEL=null; UNASK=false;
    try{ const sg=await rpc('suggested_groups',{p_token:TOKEN});
      SUG=(sg&&sg.ok&&Array.isArray(sg.groups))?sg.groups.filter(g=>g&&(g.title||'').trim()):[];
      if(sg&&sg.error) throw new Error(sg.error); }
    catch(e){ report('suggested_groups',e); SUG=[]; }     // a fault here keeps the date grouping
    /* Everything about this film's clips in one call: length, seconds in the
       film, whether a still exists, whether anybody is talking, what they say. */
    try{ const cs=await rpc('clip_state',{p_token:TOKEN}); CLIPS={}; (cs&&cs.clips||[]).forEach(c=>{ CLIPS[c.id]=c; }); }
    catch(e){ report('clip_state',e); }
    /* Clips with a voice that nobody has decided about, before anything else
       on this page. One tap each; only where it matters. */
    try{ const c=await rpc('clips_to_ask',{p_token:TOKEN}); V.clips=Array.isArray(c)?c.map(x=>({...x,asset:A.find(a=>a.id===(x.asset_id||x.id||x.asset))})).filter(x=>x.asset):[]; }
    catch(e){ report('clips_to_ask',e); V.clips=[]; }
    if(V.clips.length){ V.cur=0; screen='voices'; paint(); return; }
    if(d.chapters.length){                       // resuming
      M=d.chapters.map(c=>({id:c.id,title:c.title||'',register:c.register||'warm',story:c.story||'',
        questions:c.questions||null,
        photos:A.filter(a=>a.chapter_id===c.id).sort((x,y)=>(x.sort_index??0)-(y.sort_index??0))}));
      /* Photographs added after the grouping was done: drop each one into
         whichever group its time falls inside. Anything outside every group
         becomes a new one at the end. */
      const orphan=A.filter(a=>!a.chapter_id&&!a.excluded), loose=[];
      /* 2 Oct: a photo in no group is LISTED ("not in a group yet"), never guessed into a group by its date - a photo
         she took out of a group (or a group she removed) must not walk back in on a reload. (Until 2 Oct orphans were
         placed by time; the code is kept below, unused.) */
      UN=orphan.slice().sort(byTime);
      if(false) orphan.forEach(a=>{ const t=new Date(a.taken_at);
        const home=M.find(m=>m.photos.length&&t>=new Date(m.photos[0].taken_at).getTime()&&
          t<=new Date(m.photos[m.photos.length-1].taken_at).getTime());
        if(home){ home.photos.push(a); home.photos.sort((x,y)=>new Date(x.taken_at)-new Date(y.taken_at)); }
        else loose.push(a); });
      if(loose.length){ let c=null;
        loose.sort((x,y)=>new Date(x.taken_at)-new Date(y.taken_at)).forEach(a=>{
          const day=new Date(a.taken_at).toDateString();
          if(!c||c.day!==day){ c={title:'',register:'warm',story:'',photos:[],day}; M.push(c); }
          c.photos.push(a); }); }
      /* ⚠ A group can legitimately hold nothing visible. photos[0] is then undefined. */
      const firstAt=m=>m.photos.length?new Date(m.photos[0].taken_at).getTime():Infinity;
      M.sort((a,b)=>firstAt(a)-firstAt(b));
      /* (no save needed: nothing was moved) */
      screen='organise';
      const need=M.findIndex(m=>hasPhotos(m)&&!(m.title||'').trim());   // ⚠ never drop someone at the end
      cur=need>=0?need:0;
    }else{ screen='welcome'; cur=0; }
    paint();
  }catch(e){ report('load the collection',e);
    plain(`<h1>Couldn't load your photos</h1><p class="do">Please try the link again in a moment.</p>
      <button class="big" id="retryRoute">Try again</button>`); }
}

function paint(){
  const st=$('stage'); st.className='';
  if(screen==='welcome'){
    st.innerHTML=`<h1>Your order, not ours</h1>

  }
  if(screen==='voices'){ paintVoices(); return; }

  if(screen==='organise'){ paintOrg(); return; }

/* Where grouping starts. An occasion with suggested groups: THE BOARD (all photos, the suggestions, nothing guessed);
   otherwise the date grouping, as before. */
function startGrouping(){
  if(SUG.length){ M=SUG.map(g=>({title:g.title,hint:g.hint||'',register:'warm',story:'',photos:[]}));
    UN=A.filter(p=>!p.excluded).slice(); BSEL=null; screen='board'; cur=0; return; }
  propose(); screen='organise'; cur=0;
}
const byTime=(x,y)=>new Date(x.taken_at)-new Date(y.taken_at);
function takeOut(id){                                   // a photo out of wherever it is (a group or the unsorted list)
  const p=A.find(x=>x.id===id); if(!p) return null;
  UN=UN.filter(x=>x.id!==id); M.forEach(m=>{ m.photos=m.photos.filter(x=>x.id!==id); });
  return p;
}
function putIn(id,j){ const p=takeOut(id); if(!p) return; if(j==='un'){ UN.push(p); UN.sort(byTime); } else { M[j].photos.push(p); M[j].photos.sort(byTime); } }
/* REMOVE A GROUP (every occasion): its photos go back to "not in a group yet"; nothing is lost. A group that holds
   answers is refused by the server (409) - refusedNote says so and the page reloads the server's groups. */
function removeGroup(j){
  const m=M[j]; if(!m) return false;
  if(screen==='organise'&&hasPhotos(m)&&M.filter(hasPhotos).length<=1){ const sh=$('sheet');   // the film needs one group
    sh.innerHTML=`<div class="in"><h3>This is your only group</h3><p class="lede" style="margin:6px 0 14px">A film needs at least one group. Rename it instead, or move photos into a new group first.</p><button class="done" id="cancel">OK</button></div>`;
    sh.classList.remove('hide'); return false; }
  m.photos.filter(p=>!p.excluded).forEach(p=>{ UN.push(p); }); UN.sort(byTime);
  M.splice(j,1); cur=Math.max(0,Math.min(cur,M.length-1)); sel=null; picking=false; queueSave(); return true;
}
function dropEmptyAt(i){                                 // a group with nothing in the film: dropped, its left-out photos listed
  if(!M[i]||hasPhotos(M[i])) return false;
  M[i].photos.forEach(p=>{ p.excluded=false; UN.push(p); }); UN.sort(byTime);
  M.splice(i,1); queueSave(); return true; }
/* Photos left in no group when she moves on: one plain choice, nothing lost either way. */
function unsortedChoice(){ const s=$('sheet'); UNASK=true;
  s.innerHTML=`<div class="in"><h3>${plural(UN.length,'photo')} ${UN.length===1?'isn’t':'aren’t'} in a group yet</h3>

    <p class="lede" style="margin-top:10px;font-size:14px">Left out, ${UN.length===1?'it stays':'they stay'} here under “Not in a group yet” — you can put ${UN.length===1?'it':'them'} in a group any time before you’re done.</p></div>`;

function unsortedStrip(){

  let h=`<div class="leftout"><h4>Not in a group yet (${UN.length})</h4><p>${screen==='organise'&&M[cur]?`Tap one to put it in “${esc(M[cur].title||'this group')}”.`:'Tap one, then tap its group.'}</p><div class="lostrip">`;

}
/* THE BOARD (2 Oct): every photo and every suggested group on one screen. Tap a photo, then the group it belongs in;
   on a computer it can be dragged. "Add your own group"; any group can be removed (its photos come back here).
   A group with no photos is dropped when she moves on - it never asks for a name. */
function paintBoard(){
  const placed=M.reduce((t,m)=>t+m.photos.filter(p=>!p.excluded).length,0);
  let h=`<div class="step">Sort your photos</div>

    h+=`<div class="bg${BSEL?' target':''}" data-bg="${j}">
      <div class="bh"><b>${esc(m.title)}</b> <span class="bn">${inn.length?plural(inn.length,'photo'):'empty'}</span>

  h+=`</div>
    <div class="addg"><input type="text" id="newg" placeholder="Add your own group — e.g. The night before" autocomplete="off" maxlength="60">

    ${UN.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr))">${UN.map(p=>`<div class="c${BSEL===p.id?' sel':''}" data-bp="${p.id}" draggable="true">${tile(p)}</div>`).join('')}</div>`
      :'<p class="lede">Every photo is in a group.</p>'}</div>`;
  $('stage').innerHTML=h; $('stage').className='';
  nav('<button class="go" id="bnext">Next →</button>',`<b>${placed}</b> of ${A.filter(p=>!p.excluded).length} sorted<br>${plural(M.filter(hasPhotos).length,'group')}`,false,
      UN.length?`${plural(UN.length,'photo')} not in a group yet.`:'');

function boardNext(){
  for(let j=M.length-1;j>=0;j--) if(!M[j].photos.length) M.splice(j,1);   // empty groups: dropped, never named

let V={clips:[],cur:0};

/* 18 Oct (Nigel 6 Oct: "fewer, bigger memories - not more photos"; a tester's 87 photos were in 15 memories, 8 under 4): AT THE
   SORT STEP - a live line "4 memories works best for a film this length - you have 9", a one-tap "Join with the next one" on any
   memory under the minimum, and Done held until both are met - EXCEPT "I'd like to keep these as they are", which tells Nigel
   (never a dead end). The limits are the server's (photo_counts -> limits: max_memories from the film's seconds; the minimum);
   while sorting the page counts each group's photos itself, and the server checks again at Finished. Nothing changes a film by
   itself - only her taps. */
let KEPT=false;
function limitsNow(){
  const L=(PC&&PC.limits)||null, min=+(((PC&&PC.memories||[])[0]||{}).min)||4;
  const groups=M.filter(hasPhotos), n=groups.length;
  const max=L?(+L.max_memories||0):0;
  const small=M.map((m,j)=>({j,n:m.photos.filter(p=>!p.excluded).length,title:m.title})).filter(x=>x.n>0&&x.n<min);
  return {known:!!L,max,min,n,tooMany:!!L&&n>max,small,kept:KEPT||!!(L&&L.kept)};
}
function limitsLine(){
  const l=limitsNow(); if(!l.known) return '';
  const a=l.tooMany?`${l.max} memories works best for a film this length - you have ${l.n}.`:'';
  const b=l.small.length?`${l.small.length===1?'One memory has':l.small.length+' memories have'} fewer than ${l.min} photos.`:'';

/* 19 Oct (Nigel: "Sleeping on the job" was offered "Mummy's juice" - both 1-2 photos - so the joined memory was STILL too small):
   a small memory is offered the neighbour that brings it UP TO THE MINIMUM - the next one, else the one before - and only if
   neither does, the bigger neighbour. The same rule as the server's memory_limits_for (server-wanted-2026-10-19-joins.sql). */
function memN(x){ return M[x]?M[x].photos.filter(p=>!p.excluded).length:0; }
function joinTarget(j){
  const min=limitsNow().min, n=memN(j);
  const c=[j+1,j-1].filter(x=>x>=0&&x<M.length);
  return c.find(x=>n+memN(x)>=min) ?? c.slice().sort((a,b)=>memN(b)-memN(a)||(b===j+1)-(a===j+1))[0];
}
function joinWords(j,k){
  const other=M[k]?(M[k].title||('Group '+(k+1))):'', t=memN(j)+memN(k);

}
function joinNext(j,k){
  /* the small memory and its neighbour become one - the bigger one's name kept */
  if(k===undefined) k=joinTarget(j); if(k===undefined||k<0||!M[k]) return;
  const [a,b]=j<k?[j,k]:[k,j];
  const keepB=M[b].photos.length>M[a].photos.length;
  const into=keepB?M[b]:M[a], from=keepB?M[a]:M[b];
  into.photos=into.photos.concat(from.photos).sort(byTime);

function limitsSheet(){

  s.innerHTML=`<div class="in" id="limitsheet"><h3>Fewer, fuller memories</h3>

/* ═══ 4 · ANSWER — tell us about each group ═══════════════════════ */
/* ═══ 4 · ANSWER — a conversation, one question at a time ═════════
   "How can we get three levels deep when the answer space is one big box?"
   — Nigel. So: one question, one box, then the next. Each group's questions
   are TURNS (next_turn / answer_turn). After every answer the server is asked
   whether that answer deserves a follow-up (probe); if so it is inserted as
   the NEXT turn — right after the answer that prompted it, because a
   follow-up asked three questions later isn't a follow-up. When a turn has
   `because_of`, her own words are shown above the question: that is what
   makes it read as listening rather than a form. Progress is a count,
   "3 of 5", and it can grow as follow-ups arrive — never a bar. Every
   question can be skipped. Resume is natural: next_turn is always the first
   one not yet answered. */
let TURN=null, draft='', turnBusy=false, wrongOpen=false, whatDraft='';
/* ═══ the interview ═══
   No fixed number of questions. After every answer it classifies what it
   has and stops when the memory has EITHER a complete story OR a strong
   image with a feeling attached — two questions for some memories, five for
   others; six is a hard ceiling.
     POST brief {token, chapter_id}      → {brief:{place, kind, register, likely, promising[], opener, looked_up}}
                                           once, when a memory is first opened: where it is, the mood, the promising photographs, an opener
     POST interview {token, chapter_id}  → the next question {turn_id, question, asset_id, photos_set, because_of, looked_up, asked, stage}
     POST interview {…, turn_id, answer} → records the answer and returns the next, or {done:true, enough, have, asked, capped?, why}
     rpc next_memory_turn {p_token, p_chapter}             → the open turn, or {done:true, total, answered} (reads only)
     rpc answer_memory_turn {p_token, p_turn, p_skip:true} → a skip
     rpc close_memory {p_token, p_chapter, p_how}          → records the verdict on the chapter (enough | closed | capped) and skips anything dangling
   next_memory_turn carries `finished`: enough / closed / capped / null — the
   server's verdict, the only one there is. ⚠ Never keep a page-side record of
   it: a page-side memory of server state is the fault that once made a browser
   refuse a file the server had never heard of. memory_restart clears it too.
   ⚠ capped:true means it hit six without getting there — reported, never
   shown to her. */
const finishedMem=m=>!!(m&&m.turn&&m.turn.done&&m.turn.finished);
async function closeOnServer(m,how){
  try{ const r=ASK?await rpc('close_memory_for',{p_token:TOKEN,p_chapter:m.id,p_how:how}):await rpc('close_memory',{p_token:TOKEN,p_chapter:m.id,p_how:how}); if(!r||r.error) throw new Error((r&&r.error)||'close_memory failed'); return true; }
  catch(e){ report('close_memory',e,{group:m.title,how}); return false; }
}
function fromEngine(j){
  if(j.done){ const n=+j.asked||0; return {done:true,finished:j.capped?'capped':'enough',total:n,answered:n,enough:!!j.enough,have:j.have||null,capped:!!j.capped,why:j.why||null}; }
  const n=+j.asked||1;
  return {done:false,turn_id:j.turn_id,seq:n,level:n,stage:j.stage||j.gap||'',gap:j.gap||null,kind:j.kind||null,question:j.question||'',asset_id:j.asset_id??null,
    photos_set:!!j.photos_set,because_of:j.because_of||null,looked_up:j.looked_up||null,total:n,answered:n-1,
    pick_photo:!!j.pick_photo,subject_name:j.subject_name||null};
}
/* Story-first (anniversary): "Is there a story behind any of these photos?"
   comes with pick_photo — she taps the photo it belongs to (optional) and the
   answer carries story_asset. story_ask is the stage's own name for it, so a
   reload that reads the turn back without the flag still shows the grid. */
/* 2 Oct (Leisa's link showed "Just to jog your memory" on it): the story question is a tap-a-photo turn on BOTH
   links. The server names it (pick_photo / stage / gap 'story_ask'); a turn read back for a second answerer may carry
   less, so its own question - "Is there a story behind any of these photos?" / "Is there another story in this
   group?" - also counts. Never the jogger strip on it. */
const STORY_Q=/^\s*is there (a|another) story\b/i;
const isPick=t=>!!(t&&!t.done&&(t.pick_photo||t.stage==='story_ask'||t.gap==='story_ask'||t.kind==='story_ask'||STORY_Q.test(t.question||'')));
let PICK=null;       // {turn, id}: the photo she tapped, for that turn only
/* A skip. An answerer's goes through answer_turn_for, which checks the turn
   was asked of HER (from her token) before it saves anything. */
function skipOnServer(t){
  return ASK?rpc('answer_turn_for',{p_token:TOKEN,p_turn:t.turn_id,p_answer:null,p_skip:true})
            :rpc('answer_memory_turn',{p_token:TOKEN,p_turn:t.turn_id,p_skip:true});
}
async function readTurn(m){                                  // where a memory is up to; generates nothing
  try{ const t=ASK?await rpc('turn_for',{p_token:TOKEN,p_chapter:m.id}):await rpc('next_memory_turn',{p_token:TOKEN,p_chapter:m.id});
    if(t&&!t.error) return t.done?t:{...t,level:+t.level||+t.seq||1,asset_id:t.asset_id??null,photos_set:!!t.photos_set};
    report('next_memory_turn',new Error((t&&t.error)||'bad reply'),{group:m.title});
    if(ASK) throw new Error('next_memory_turn refused for an answerer'); }
  catch(e){ report('next_memory_turn',e,{group:m.title});
    /* ⚠⚠ Fail closed. "Nothing asked yet" here would have the engine write
       her questions from a turn list that may include his. */
    if(ASK) throw e; }

}
async function askEngine(m,turn_id,answer,skipThread,storyAsset){      // the next question, or done — a model call, a few seconds
  const body={chapter_id:m.id,...(ASK?{person_id:ASK.person_id}:{})}; if(turn_id){ body.turn_id=turn_id; body.answer=answer; }
  if(turn_id&&skipThread) body.skip_thread=true;            // "Ask me about something else": the server skips it AND drops the subject
  if(turn_id&&storyAsset) body.story_asset=storyAsset;      // the photo she tapped; the server keeps it only on her own story_ask turn, only if it is in this memory
  const {ok,status,j}=await post('interview',body);
  if(!ok||!j||j.error) throw new Error((j&&j.error)||('interview HTTP '+status));
  if(j.waiting){ const t=await readTurn(m); if(!t.done) return t; throw new Error('interview: waiting, but no open turn'); }
  const t=fromEngine(j);
  if(t.done){
    if(t.capped) report('interview capped',new Error('capped at six'),{group:m.title,have:t.have,why:t.why});
    /* ⚠⚠ 2 Oct: opening Leisa's answer link CLOSED the reopened "Party" group on load - the engine said done before
       she had seen a single question, and this closed it. A group is closed only once its questions have been SHOWN
       in this visit (m.shown, set by paintTurn) or by her own button (closeMemory). A load never closes anything.
       Test: Song/pipeline/page_tests.py "NEVER CLOSE ON LOAD". */
    if(m.shown) await closeOnServer(m,t.finished);           // the verdict lives on the chapter, nowhere else
    else report('engine done on arrival - left open',new Error('not shown in this visit'),{group:m.title});
  }

}
/* the turn to put in front of her for a memory: the open one if there is
   one; otherwise the interview writes the next, or says the memory is done.
   ⚠ A memory opened for the first time (no turns at all) is briefed first —
   the brief works out where it is and writes the opener the interview uses. */
async function openTurn(m){
  const t=await readTurn(m);
  if(!t.done) return t;
  if(t.finished) return t;
  if(!(+t.total)){ try{ const {ok,status,j}=await post('brief',{chapter_id:m.id,...(ASK?{person_id:ASK.person_id}:{})}); if(!ok||!j||j.error) throw new Error((j&&j.error)||('brief HTTP '+status)); m.brief=j.brief||null; }
    catch(e){ report('brief',e,{group:m.title}); } }          // the interview still opens without it
  return askEngine(m);
}
/* "That's enough about this one." A customer can always close a memory
   early. close_memory marks the open question skipped and records the
   verdict as hers ('closed'); if that fails, nothing has changed and she is
   told so — never a "done" that didn't happen. */
async function closeMemory(){
  const m=M[cur], t=TURN; if(!m||turnBusy) return;
  turnBusy=true; paintTurn();
  if(!(await closeOnServer(m,'closed'))){ turnBusy=false; paintTurn(); flash(false);
    const before=$('nav').querySelector('.before'); if(before) before.textContent="That didn't go through. Please try again."; return; }
  m.turn=await readTurn(m); if(!m.turn.finished) m.turn={...m.turn,done:true,finished:'closed'}; TURN=m.turn;
  turnBusy=false; draft=''; wrongOpen=false; whatDraft='';
  const next=M.findIndex((x,i)=>i>cur&&!finishedMem(x));
  if(next>=0){ paintGroupDone(next); scrollTo(0,0); return; }
  paintAllDone(); scrollTo(0,0);
}
/* INVITE THE OTHER PERSON TO ANSWER (2 Oct; Nigel's test never saw it). On the builder's link only, once a second
   person is in the film: "Invite Leisa to answer" → rpc invite_to_answer {p_token, p_name} → {ok, answer_token} (the
   same token every time) → the ?a= link to copy or share. She gets her own questions and never sees his answers. */
/* 9 Oct (Nigel): a GIFT film is a surprise - the person it is FOR never answers and never gets a link. The server says
   which kind the film is and who it is for (who_answers, server-wanted-2026-10-09) and refuses them itself
   (invite_to_answer_checked + a trigger); the page leaves them out and says so plainly. Givers can be several people: a gift
   film can invite anyone else by first name. A SHARED film is unchanged: everyone who was there is invited. */
let INV={people:[],links:{},hidden:false,busy:null,copied:null,kind:null,for:null,recipients:[],msg:null,confirm:null,other:''};
const nameKey=n=>String(n||'').trim().toLowerCase();
async function loadInvite(){
  INV={people:[],links:{},hidden:false,busy:null,copied:null,kind:null,for:null,recipients:[],msg:null,confirm:null,other:''};
  if(ASK) return;
  try{ const w=await rpc('who_answers',{p_token:TOKEN}); if(w&&!w.error){ INV.kind=w.kind; INV.for=w.for||null; INV.recipients=(w.recipients||[]).map(nameKey); } }
  catch(_){ /* before the server has who_answers: what the journey says */ }
  if(!INV.kind){ INV.kind=J.is_gift?'gift':'shared'; INV.for=J.is_gift?(J.gift_for||null):null;
    INV.recipients=INV.for?String(INV.for).split(/\s*(?:,|&|\band\b)\s*/i).map(nameKey).filter(Boolean):[]; }
  try{ const r=await rpc('get_people',{p_token:TOKEN}); if(r&&r.error) throw new Error(r.error);
    INV.people=(Array.isArray(r)?r:[]).filter(x=>!x.is_you&&(x.name||'').trim()
      &&!(INV.kind==='gift'&&(x.is_subject||INV.recipients.includes(nameKey(x.name))))).map(x=>x.name); }
  catch(e){ report('get_people for invite',e); }

/* Which photographs a question shows, and how. Two different things:

   always visible while its questions are asked; nothing means "show nothing". */
const AROUND_KINDS=/free|recall|context|reinstat|perspective|unphotograph|nobody/i;
function turnPhotos(m,t){
  if(!t) return {photos:m.photos,mode:'about'};
  if(isPick(t)) return {photos:m.photos,mode:'about'};      // a story question is never "around" (2 Oct)
  const ids=Array.isArray(t.assets)?t.assets:(t.asset_id||t.asset||t.photo?[t.asset_id||t.asset||t.photo]:null);
  if(ids&&ids.length){ const ph=m.photos.filter(p=>ids.includes(p.id)); if(ph.length) return {photos:ph,mode:'about',single:ph.length===1}; }
  const around=(t.photos_set&&t.asset_id==null)||('asset_id' in t&&t.asset_id===null)||('assets' in t&&Array.isArray(t.assets)&&!t.assets.length)||AROUND_KINDS.test(String(t.kind||t.type||''));
  return {photos:m.photos,mode:around?'around':'about'};

function photosStrip(m,t){

async function answerTurn(skip,thread){
  const m=M[cur], t=TURN; if(!m||!t||turnBusy) return;
  const text=(draft||'').trim();
  if(!skip&&!text){ const ta=$('ans'); if(ta) ta.focus(); return; }
  turnBusy=true; paintTurn();
  const fail=()=>{ turnBusy=false; paintTurn(); flash(false);
    const before=$('nav').querySelector('.before'); if(before) before.textContent="That didn't go through. Please press Next again."; };
  let nt;
  try{
    if(thread) nt=await askEngine(m,t.turn_id,'',true);     // one call: skip_thread checks the turn is hers, marks it declined, writes the next
    else if(skip){ const r=await skipOnServer(t); if(!r||r.error) throw new Error((r&&r.error)||'answer_memory_turn failed'); nt=await askEngine(m); }
    else nt=await askEngine(m,t.turn_id,text,false,isPick(t)&&PICK&&PICK.turn===t.turn_id?PICK.id:null);

  m.turn=nt; TURN=nt;

  if(!nt.done){ paintTurn(); scrollTo(0,0); return; }
  /* this memory is done: the move between memories looks different from the

/* "ASK ME MORE ABOUT THIS GROUP" (Nigel 5 Oct) - on a group THIS person has finished, on both links (?t= and ?a=).

   deletes anyone's answers; refuses once the words are written, after three reopens, or for a bad link ({error: words}).

/* ═══ HELP — "something not right?" ═══════════════════════════════
   ⚠ Not a chat box. A chat box listens sympathetically and changes nothing,
   which is worse than no help at all. POST help {token, asked} answers one of
   three kinds: `do` — an action the PAGE applies, then shows the reply (⚠ if
   the action fails, say so; never show a reply that claims something worked
   when it didn't); `cannot` — show the reply and stop (logged as roadmap);
   `person` — show the reply and stop (logged for a human: money, dates,
   complaints, anybody upset — a tribute film is about a death and somebody
   will write at 2am). After every reply, one line: "anything else you'd want
   to be able to change here?" — what they ask for is what we build next. */
let HELP={open:false,busy:false,asked:'',reply:'',bad:false,replied:false};
function paintHelp(){
  const sh=$('sheet');
  if(!HELP.open){ if(sh.classList.contains('help')){ sh.classList.add('hide'); sh.classList.remove('help'); sh.innerHTML=''; } return; }
  sh.classList.add('help'); sh.classList.remove('hide');
  sh.innerHTML=`<div class="in"><h3>What\u2019s not right?</h3>
    ${HELP.replied?'':'<p>Tell us in your own words \u2014 a name said wrongly, a photo in the wrong place, the wrong music \u2014 and we\u2019ll put it right if we can.</p>'}
    ${HELP.reply?`<p class="reply ${HELP.bad?'bad':''}">${esc(HELP.reply)}</p>`:''}
    ${HELP.replied?`<p class="ask2">Anything else you\u2019d want to be able to change here?</p>`:''}
    <textarea id="helpAsk" placeholder="${HELP.replied?'Anything else\u2026':'What\u2019s wrong, or what would you change?'}" ${HELP.busy?'disabled':''}>${esc(HELP.asked)}</textarea>
    <div class="acts" style="margin-top:12px"><button class="yes" id="helpSend" ${HELP.busy?'disabled':''}>${HELP.busy?'One moment\u2026':'Send'}</button>
      <button id="helpClose">${HELP.replied?'Done':'Never mind'}</button></div></div>`;
  if(!HELP.busy){ const t=$('helpAsk'); if(t) t.focus(); }
}
async function sendHelp(){
  const asked=(HELP.asked||'').trim(); if(!asked||HELP.busy){ const t=$('helpAsk'); if(t) t.focus(); return; }
  HELP.busy=true; HELP.reply=''; HELP.bad=false; paintHelp();
  let j;
  try{ const r=await post('help',{asked}); j=r.j; if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('HTTP '+r.status)); }
  catch(e){ report('help',e,{asked:asked.slice(0,200)}); HELP.busy=false; HELP.bad=true; HELP.reply="That didn\u2019t go through. Please try again in a moment."; HELP.replied=true; paintHelp(); return; }
  if(j.kind==='do'){
    const out=await applyHelp(j.action,j.details||{});
    if(out.ok){ HELP.reply=j.reply||'Done.'; HELP.bad=false; }
    else{ HELP.reply=out.why||"We couldn\u2019t make that change from here."; HELP.bad=true;
      report('help: action not applied',new Error(j.action),{action:j.action,details:j.details,why:out.why}); }
  }else{ HELP.reply=j.reply||''; HELP.bad=false; }
  HELP.busy=false; HELP.asked=''; HELP.replied=true; paintHelp();
  setTimeout(()=>{ if(HELP.open) paintHelp(); },600);   // a repaint of the page underneath may have hidden the sheet
}
/* Which photograph does she mean? Her words against what we know of each
   one — description, subject, notable, filename. Only a clear, single best
   match is acted on; anything less is said so, not guessed. */
const STOP=new Set(['the','a','an','of','one','ones','photo','photos','photograph','picture','pic','image','that','this','with','and','in','on','at','to','it','is','was','my','our','us','me','two','both','from','into','where']);
const toks=t=>String(t||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
function findAsset(assets,desc){
  const q=toks(desc); if(!q.length) return {asset:null,why:'nothing to go on'};
  const scored=assets.map(a=>{ const text=toks([a.description,a.subject,a.notable,a.original_filename,(a.who||[]).join(' ')].join(' ')).join(' ');
    return {a,n:q.filter(w=>text.includes(w)).length}; }).sort((x,y)=>y.n-x.n);
  const best=scored[0], second=scored[1];
  if(!best||best.n===0) return {asset:null,why:'no match'};
  if(second&&second.n===best.n) return {asset:null,why:'more than one match'};
  return {asset:best.a,why:''};
}
/* help's `details` keys are not fixed: one call says {description, from, to}, the next
   {photo_description, from_memory, to_memory}. Read them by shape, not by name. */
const pickKey=(d,re)=>{ for(const k of Object.keys(d||{})){ if(re.test(k)&&typeof d[k]==='string'&&d[k].trim()) return d[k]; } return ''; };
const descOf=d=>pickKey(d,/desc|photo|which|asset|move|image|pic/i)||'';
const toOf=d=>pickKey(d,/^to|target|into|new_memory|new_group/i)||'';
const findChapter=(chapters,name)=>{ const n=String(name||'').trim().toLowerCase(); return chapters.find(c=>(c.title||'').trim().toLowerCase()===n)||chapters.find(c=>(c.title||'').toLowerCase().includes(n)&&n.length>2)||null; };
/* The grouping as the server has it, whole — save_groups replaces the lot,
   so it must be built from every chapter, never from a page's partial list. */
async function groupsNow(){
  const d=await api('load',{});
  const chapters=d.chapters.map(c=>({id:c.id,title:c.title||'',register:c.register||'warm',story:c.story||'',
    photos:d.assets.filter(a=>a.chapter_id===c.id&&!a.excluded).sort((x,y)=>(x.sort_index??0)-(y.sort_index??0))}));
  return {d,chapters,assets:d.assets};
}
async function saveGroupsNow(g){
  /* 2 Oct: the same save_groups as the grouping screens - EVERY group sent WITH its id, so a rename or move updates the
     group in place (without ids the server matches by title, and a renamed group with answers would read as removed ->
     409). A 409 is thrown to applyHelp, which shows the server's message and reloads. An answerer's link cannot regroup
     (flow refuses her token): she is told so, nothing is sent. */
  if(ASK) throw Object.assign(new Error('answerer cannot regroup'),{answerer:true});
  const payload={groups:g.chapters.map(m=>({id:m.id,title:m.title,register:m.register,      // no story: see saveGroups
      assets:m.photos.filter(p=>!p.excluded).map(p=>p.id), hero:(m.photos.find(p=>p.is_hero)||{}).id||null})),
    excluded:g.assets.filter(p=>p.excluded).map(p=>p.id)};
  const r=await api('save_groups',payload);
  if(!r.ids||r.ids.length!==g.chapters.length) throw new Error('save_groups: no ids back');
}
const VOICE_WORDS=[['female',/woman|female|her voice|girl|lady/],['male',/\bman\b|male|his voice|bloke/],['duet',/both|together|duet|two voices/]];
async function applyHelp(action,d){
  try{
    if(action==='fix_pronunciation'){
      const nm=pickKey(d,/^name|person|who/i), snd=pickKey(d,/sound|said|pronounc|say/i); if(!nm||!snd) return {ok:false,why:"We couldn\u2019t tell which name, or how it should sound."};
      const people=await rpc('get_people',{p_token:TOKEN});
      const who=(Array.isArray(people)?people:[]).find(x=>x.name.toLowerCase()===nm.toLowerCase());
      if(!who) return {ok:false,why:`We don\u2019t have anyone called ${nm} on this film yet \u2014 add them on the first screen and we\u2019ll say it right.`};
      const r=await rpc('confirm_person_sound',{p_token:TOKEN,p_name:who.name,p_corrected_said_as:snd});
      if(!r||r.error) throw new Error((r&&r.error)||'confirm_person_sound failed');
      return {ok:true};
    }
    if(action==='wrong_photo'){
      /* Only the question in front of her can be flagged with certainty. */
      const bad=toks(d.incorrect_description), q=toks(TURN&&!TURN.done?TURN.question:'');
      if(screen==='answer'&&TURN&&!TURN.done&&bad.some(w=>q.includes(w))&&d.correct_description){
        const nt=await askEngine(M[cur],TURN.turn_id,`That\u2019s not what\u2019s in that photo. It\u2019s ${String(d.correct_description)}.`);
        M[cur].turn=nt; TURN=nt; draft=''; if(!nt.done) paintTurn();
        return {ok:true};
      }
      return {ok:false,why:"Thank you \u2014 to fix that one, go to the question it belongs to and press \u201cthat\u2019s not what\u2019s in that photo\u201d under it."};
    }
    if(action==='rename_memory'){
      /* 2 Oct: help's keys vary ({old_name,new_name} one call, {from,to} the next): read both shapes, and say which part
         was missing - "couldn't find a group" was shown when it was the NEW name that went unread */
      const oldN=pickKey(d,/old|from|current|^memory|^group/i), newN=pickKey(d,/new|rename|^to$|^to_|target/i); const g=await groupsNow(); const c=findChapter(g.chapters,oldN);
      if(!c) return {ok:false,why:`We couldn\u2019t find a group called \u201c${oldN}\u201d.`};
      if(!newN) return {ok:false,why:"We couldn\u2019t tell what the new name should be \u2014 you can type it straight into the group\u2019s name on the grouping screen."};
      c.title=String(newN).trim(); await saveGroupsNow(g); await afterGroupsChanged(); return {ok:true};
    }
    if(action==='move_photo'||action==='remove_photo'||action==='reorder'){
      const g=await groupsNow();
      const mem=pickKey(d,/^memory|^group|^in_/i); const pool=action==='reorder'&&mem?((findChapter(g.chapters,mem)||{}).photos||[]):g.assets.filter(a=>!a.excluded);
      const {asset,why}=findAsset(pool,descOf(d));
      if(!asset) return {ok:false,why:why==='more than one match'?"A few photos match that \u2014 on the grouping screen, tap the one you mean.":"We couldn\u2019t tell which photo you mean \u2014 on the grouping screen, tap it and choose what to do."};
      const from=g.chapters.find(c=>c.photos.some(p=>p.id===asset.id));
      if(action==='remove_photo'){ if(from) from.photos=from.photos.filter(p=>p.id!==asset.id); asset.excluded=true; }
      if(action==='move_photo'){ const to=findChapter(g.chapters,toOf(d)); if(!to) return {ok:false,why:`We couldn\u2019t find a group called \u201c${toOf(d)}\u201d.`};
        if(from) from.photos=from.photos.filter(p=>p.id!==asset.id); to.photos.push(asset); }
      if(action==='reorder'){ const ch=from; if(!ch) return {ok:false,why:"We couldn\u2019t tell which group that\u2019s in."};
        const before=pickKey(d,/before|ahead|earlier/i), after=pickKey(d,/after|behind|later/i); const ref=findAsset(ch.photos.filter(p=>p.id!==asset.id),before||after).asset; if(!ref) return {ok:false,why:"We couldn\u2019t tell which photo it should go next to."};
        ch.photos=ch.photos.filter(p=>p.id!==asset.id); const i=ch.photos.indexOf(ref); ch.photos.splice(after&&!before?i+1:i,0,asset); }
      await saveGroupsNow(g); await afterGroupsChanged(); return {ok:true};
    }
    if(action==='change_sound'){
      await loadMusic();
      const want0=toOf(d)||pickKey(d,/genre|sound|voice|style/i); if(/voice/i.test(d.change||'')||/voice/i.test(pickKey(d,/change|what|kind/i))){ const want=String(want0).toLowerCase(); const v=(VOICE_WORDS.find(([slug,re])=>re.test(want))||[])[0]||G.voices.find(x=>x.slug===want||x.label.toLowerCase()===want)?.slug;
        if(!v) return {ok:false,why:"We couldn\u2019t tell which voice you mean \u2014 the choices are on the music screen."};
        const r=await rpc('set_voice',{p_token:TOKEN,p_slug:v}); if(!r||r.error) throw new Error((r&&r.error)||'set_voice failed'); G.voice=v; }
      else{ const want=String(want0).toLowerCase(); const gn=G.genres.find(x=>x.slug===want||x.label.toLowerCase()===want)||G.genres.find(x=>x.label.toLowerCase().includes(want)&&want.length>2);
        if(!gn) return {ok:false,why:`We don\u2019t have a sound called \u201c${want0}\u201d \u2014 the choices are on the music screen.`};
        const r=await rpc('set_genre',{p_token:TOKEN,p_slug:gn.slug,p_plain:null}); if(!r||r.error) throw new Error((r&&r.error)||'set_genre failed'); }
      if(screen==='describing'||screen==='genre'){ try{ await loadMusic(); paintMusic(); }catch(_){} }
      return {ok:true};
    }
    if(action==='add_person'){
      const nm=pickKey(d,/^name|person|who/i), rel=pickKey(d,/relation|role|relationship/i); if(!nm) return {ok:false,why:"We couldn\u2019t tell the name."};
      if(joinedNames(nm)) return {ok:false,why:oneNameOnly(nm)};
      const r=await rpc('set_person',{p_token:TOKEN,p_name:nm.trim(),p_relation:rel||null,p_is_subject:!!d.is_subject,p_is_you:false});
      if(!r||r.error) throw new Error((r&&r.error)||'set_person failed');
      P.people.push({name:r.name||nm,relation:rel||null,is_subject:!!d.is_subject,said_as:r.said_as||null,sound_ok:false});
      if(page==='upload'&&/^(others|rel)$/.test(P.mode)) paintWho();
      return {ok:true};
    }
    return {ok:false,why:"That\u2019s not something we can change from here yet."};
  }catch(e){ if(e&&e.answerer) return {ok:false,why:"The groups are changed on the link of the person making the film \u2014 ask them, or tell us and we\u2019ll do it."};
    if(isRefusal(e)){ report('help regroup refused (409)',e,{action,groups:e.body.groups}); try{ await afterGroupsChanged(); }catch(e2){ report('reload after 409',e2); }
      return {ok:false,why:`${e.body.message||'Those groups already have answers, so they can\u2019t be removed.'} (${(e.body.groups||[]).join(', ')}) Nothing has changed.`}; }
    report('help apply',e,{action,details:d}); return {ok:false,why:"We tried to make that change and it didn\u2019t go through. Nothing has been altered."}; }
}

/* ═══ SOMEBODY ELSE ANSWERING (?a=) ══════════════════════════════

                                             memories:[{chapter_id, title, seq, finished}]}  — HER verdicts, not his

/* 20 Oct (WCAG 2.2 AA 2.1.1 keyboard; the US launch): every photo, group box and card that is tapped is also reachable with
   Tab and works with Enter or Space - it becomes a button to a screen reader (its photo's alt text names it). A box that holds
   its own buttons is left alone (they are reachable themselves). */
const TAPPABLE='[data-p],[data-zoom],[data-pick],[data-unput],[data-back],[data-bp],[data-bg],[data-bun],[data-genre],[data-voice],[data-play],[data-stpick],[data-keep]';
function keyboardTappables(){

    if(el.querySelector('button,a[href],input,select,textarea,'+TAPPABLE)) return;

  if(t.id==='retryRoute'){ route(); return; }
  if(t.id==='dretry'){ scan.stalled=false; paintScan(); describeLoop(++describeRun); return; }
  if(t.id==='tosort'){ toSort(); return; }

  /* help */
  if(t.id==='helpOpen'){ HELP.open=true; HELP.reply=''; HELP.bad=false; HELP.replied=false; HELP.asked=''; paintHelp(); return; }
  if(t.id==='helpClose'){ HELP.open=false; paintHelp(); return; }
  if(t.id==='helpSend'){ sendHelp(); return; }
  /* before they start */
  if(t.id==='welcomeGo'){ P.welcomed=true; paintMe(); scrollTo(0,0); return; }
  if(t.id==='pme'){ addMe(); return; }
  if(t.id==='pnotme'){ paintMe(); scrollTo(0,0); return; }
  if(t.id==='preldone'){ saveRelations(); return; }
  if(t.id==='giftNo'||t.id==='giftYes'){ saveGift(t.id==='giftYes'); return; }
  if(t.id==='c_kidsno'||t.id==='c_kidsyes'){ const keep={share:$('c_share')&&$('c_share').checked,
      email:$('c_email')&&$('c_email').checked}; CKIDS=t.id==='c_kidsyes'?'yes':'no'; paintConsent();
    $('c_share').checked=!!keep.share; $('c_email').checked=!!keep.email; $('cdone').disabled=!consentReady(); return; }
  if(t.id==='cdone'){ if(consentReady()) saveConsent(); return; }
  if(t.id==='printsGo'||t.id==='printsSkip'){ showUploadPage(); scrollTo(0,0); return; }
  /* who */
  if(t.id==='padd'){ addPerson(); return; }
  if(t.id==='pdone'){ if(others().length){ paintRel(); scrollTo(0,0); } else sayNames(); return; }
  if(t.dataset.premove!==undefined){ removePerson(+t.dataset.premove); return; }
  if(t.id==='psayagain'){ sayNames(); return; }
  if(t.id==='pmore'){ paintOthers(); scrollTo(0,0); return; }
  if(t.dataset.sayok!==undefined){ const i=+t.dataset.sayok, x=P.say[i]; x.answer='yes'; x.typed=''; paintSayRow(i); return; }
  if(t.id==='sungdone'){ t.disabled=true; t.textContent='One moment…'; NS.done=true; prog({screen:'names',names_heard:true,names_fixed:NS.fixed}); await finishFilm(t,NS.sent); return; }
  if(t.dataset.sungfix!==undefined){ const i=+t.dataset.sungfix, x=NS.rows[i]; if(!x) return; x.open=!x.open; x.note=''; paintSungRow(i); if(x.open){ const f=$('sungtype'+i); if(f) f.focus(); } return; }
  if(t.dataset.sungsave!==undefined){ saveSungFix(+t.dataset.sungsave); return; }
  if(t.dataset.sayno!==undefined){ const i=+t.dataset.sayno, x=P.say[i]; x.answer=x.answer==='no'?null:'no'; paintSayRow(i); if(x.answer==='no'){ const f=document.querySelector(`input[data-saytype="${i}"]`); if(f) f.focus(); } return; }
  if(t.dataset.trytake!==undefined){ tryTake(+t.dataset.trytake); return; }
  if(t.dataset.choosetake!==undefined){ chooseTake(+t.dataset.choosetake); return; }
  if(t.id==='sayDone'){ finishSay(); return; }
  /* upload */
  if(t.dataset.anyway!==undefined){ const q=queue[+t.dataset.anyway]; if(q&&q.status==='dup'&&!QUOTE){ q.status='ready'; q.force=true; paintQueue(); $('send').disabled=false; } return; }
  if(t.id==='allin'){ askAllIn(); return; }
  if(t.id==='failedRetry'){ $('sheet').classList.add('hide'); send(); return; }
  if(t.id==='failedSkip'){ SKIP_FAILED=true; $('sheet').classList.add('hide'); askAllIn(); return; }
  if(t.id==='shortAdd'){ shortAdd(); return; }
  if(t.id==='shortJoin'){ $('sheet').classList.add('hide'); showSort(); return; }
  if(t.id==='keepas2'){ (async()=>{ try{ const r=await rpc('keep_memories_as_they_are',{p_token:TOKEN}); if(!r||r.error) throw new Error((r&&r.error)||'keep'); KEPT=true; $('sheet').classList.add('hide'); finishFilm($('tomusic'),true); }catch(e){ report('keep',e); } })(); return; }
  if(t.id==='shortSend'){ shortSend(); return; }
  if(t.id==='allinNo'){ $('sheet').classList.add('hide'); return; }
  if(t.id==='allinYes'){ finishUpload(); return; }
  if(t.id==='bznext'){ burstNext(); return; }
  if(t.id==='bzall'){ BZ.keep[BZ.i]=new Set(BZ.groups[BZ.i].photos.map(p=>p.id)); burstNext(); return; }
  const bz=t.closest('[data-burst]');
  if(bz&&BZ.on&&!BZ.sending){ const k=BZ.keep[BZ.i], id=bz.dataset.burst; if(k.has(id)) k.delete(id); else k.add(id); BZ.failed=false; paintBurst(); return; }

  /* sort */
  if(t.id==='start'){ name=($('who')||{}).value||'';
    api('set_owner',{name}).catch(e=>report('save name',e));
    dups=findDups().map(d=>{ d.keep=(d[0].sharpness||0)>=(d[1].sharpness||0)?0:1; return d; });
    screen=dups.length?'dups':'organise'; cur=0;
    if(screen==='organise') startGrouping();
    prog({screen,name_given:!!name}); paint(); scrollTo(0,0); return; }
  if(t.dataset.voicewant!==undefined){ decideVoice(t.dataset.voicewant==='1'); return; }
  if(t.dataset.keep!==undefined){ dups[cur].keep=+t.dataset.keep; paint(); return; }
  if(t.id==='bothd'){ dups[cur].keep=-1; if(cur<dups.length-1){cur++;}else{screen='organise';cur=0;startGrouping();}
    paint(); scrollTo(0,0); return; }
  if(t.id==='dnext'){ const d=dups[cur];
    if(d.keep>=0){ const drop=d[1-d.keep], keep=d[d.keep];
      drop.excluded=true; api('mark_dup',{keep:keep.id,drop:drop.id}).catch(e=>report('mark duplicate',e)); }
    if(cur<dups.length-1) cur++; else { screen='organise'; cur=0; startGrouping(); prog({screen}); }
    paint(); scrollTo(0,0); return; }
  if(t.id==='fixclock'){ A.forEach(p=>{ if(/^DSC/i.test(p.original_filename))
      p.taken_at=new Date(new Date(p.taken_at).getTime()-skew*3600000).toISOString(); });
    A.sort((a,b)=>new Date(a.taken_at)-new Date(b.taken_at));
    skewDone=true; if(screen==='organise'&&!SUG.length) propose(); cur=0; queueSave(); paint(); return; }
  if(t.id==='skipclock'){ skewDone=true; paint(); return; }
  if(t.dataset.reg){ M[cur].register=t.dataset.reg; queueSave(); paint(); return; }
  if(t.id==='onext'){ if(!dropEmptyAt(cur)) cur++; cur=Math.min(cur,M.length-1); sel=null; picking=false; saveGroups(); prog({screen:'organise',part:cur+1}); paint(); scrollTo(0,0); return; }
  if(t.id==='back'){
    if(page==='upload'&&BZ.on){ if(BZ.sending) return; if(BZ.i>0){ BZ.i--; paintBurst(); } else { BZ.on=false; showUploadPage(); } scrollTo(0,0); return; }
    if(page==='upload'&&P.mode==='say'){ if(others().length) paintRel(); else paintOthers(); scrollTo(0,0); return; }
    if(page==='upload'&&P.mode==='rel'){ paintOthers(); scrollTo(0,0); return; }
    if(page==='upload'&&P.mode==='others'){ paintMe(); scrollTo(0,0); return; }
    if(screen==='film'){ if(FQ.i>0&&!FQ.busy) goFilmQ(FQ.i-1); scrollTo(0,0); return; }
    if(screen==='genre'){ screen='answer'; gotoGroup(M.length-1); scrollTo(0,0); return; }
    if(screen==='names'){ NS.done=false; screen='answer'; gotoGroup(M.length-1); scrollTo(0,0); return; }
    if(screen==='answer'){ if(atEnd){ atEnd=false; gotoGroup(M.length-1); } else if(cur>0) gotoGroup(cur-1); scrollTo(0,0); return; }
    if(screen==='organise'&&dropEmptyAt(cur)){ cur=Math.max(0,cur-1); } else if(cur>0){cur--;} sel=null; picking=false;
    paint();
    scrollTo(0,0); return; }
  if(t.id==='tofirst'){ if(dropEmptyAt(cur)) cur=Math.min(cur,M.length-1); const i=M.findIndex(x=>hasPhotos(x)&&!(x.title||'').trim());
    if(i>=0){ cur=i; sel=null; picking=false; paint(); scrollTo(0,0); } return; }
  if(t.dataset&&t.dataset.join!==undefined){ $('sheet').classList.add('hide'); joinNext(+t.dataset.join,t.dataset.with!==undefined?+t.dataset.with:undefined); return; }
  if(t.id==='keepas'){ keepAsTheyAre(); return; }
  if(t.id==='sortDone'){ finishSort(); return; }
  /* 2 Oct: the board, remove a group, photos in no group */
  if(t.id==='bnext'){ boardNext(); return; }
  if(t.id==='toboard'){ const have=new Set(M.map(m=>m.title));
    SUG.forEach(g=>{ if(!have.has(g.title)) M.push({title:g.title,hint:g.hint||'',register:'warm',story:'',photos:[]}); });
    screen='board'; BSEL=null; UNASK=false; paint(); scrollTo(0,0); return; }
  if(t.id==='addg'){ const f=$('newg'), v=(f&&f.value||'').trim(); if(!v){ if(f) f.focus(); return; }
    M.push({title:v.slice(0,60),hint:'',register:'warm',story:'',photos:[]});
    if(BSEL){ putIn(BSEL,M.length-1); BSEL=null; queueSave(); } paint(); return; }
  if(t.dataset.rmg!==undefined){ removeGroup(+t.dataset.rmg); paint(); return; }
  if(t.id==='rmgroup'){ if(removeGroup(cur)){ paint(); scrollTo(0,0); } return; }
  if(t.id==='unown'){ $('sheet').classList.add('hide');
    M.push({title:'',register:'warm',story:'',photos:UN.splice(0).sort(byTime)}); UNASK=false; queueSave();
    if(screen==='board'){ boardNext(); return; }
    cur=M.length-1; paint(); scrollTo(0,0); return; }
  if(t.id==='unleave'){ $('sheet').classList.add('hide'); UNASK=true; if(screen==='board') boardNext(); else finishSort(); return; }
  if(t.id==='unkeep'){ UNASK=false; $('sheet').classList.add('hide'); return; }
  if(t.id==='unall'&&screen==='organise'&&UN.length){             // 17 Oct: every photo not in a group -> one new group at the end
    M.push({title:'',register:'warm',story:'',photos:UN.splice(0)}); cur=M.length-1; sel=null; queueSave(); paint(); scrollTo(0,0);
    setTimeout(()=>{ const n=$('nm'); if(n) n.focus(); },50); return; }
  const unp=t.closest('[data-unput]');
  if(unp&&screen==='organise'){ putIn(unp.dataset.unput,cur); queueSave(); paint(); return; }
  const bp=t.closest('[data-bp]');
  if(bp&&screen==='board'){ BSEL=BSEL===bp.dataset.bp?null:bp.dataset.bp; paintBoard(); return; }
  const bgc=t.closest('[data-bg]');
  if(bgc&&screen==='board'){ if(BSEL){ putIn(BSEL,+bgc.dataset.bg); BSEL=null; queueSave(); paintBoard(); } return; }
  const bun=t.closest('[data-bun]');
  if(bun&&screen==='board'){ if(BSEL&&!UN.some(p=>p.id===BSEL)){ putIn(BSEL,'un'); BSEL=null; queueSave(); paintBoard(); } return; }
  /* 2 Oct: invite the other person to answer; a story's photograph */
  if(t.dataset.invite!==undefined){ inviteTo(t.dataset.invite); return; }
  if(t.dataset.copyinv!==undefined){ copyInvite(t.dataset.copyinv); return; }
  if(t.dataset.shareinv!==undefined){ shareInvite(t.dataset.shareinv); return; }
  if(t.id==='invhide'){ INV.hidden=true; repaintAnswer(); return; }
  if(t.id==='invothergo'){ const v=($('invother')||{}).value||''; INV.other=v; inviteTo(v); return; }
  if(t.id==='invdiff'&&INV.confirm){ const n=INV.confirm.name; inviteTo(n,true); return; }
  if(t.id==='invsame'){ INV.confirm=null; INV.msg=null; INV.other=''; repaintAnswer(); return; }
  const sp=t.closest('[data-stpick]');
  if(sp){ linkStory(sp.dataset.stturn,sp.dataset.stpick); return; }
  if(t.id==='stdone'){ STP.done=true; paintAllDone(); scrollTo(0,0); return; }
  if(t.id==='cancel'){ sel=null; picking=false; sheet(); paint(); return; }
  if(t.dataset.to!==undefined){
    const m=M[cur], p=m.photos.find(x=>x.id===sel);
    m.photos.splice(m.photos.indexOf(p),1);
    if(t.dataset.to==='new') M.splice(cur+1,0,{title:'',register:'warm',story:'',photos:[p]});
    else if(t.dataset.to==='un'){ UN.push(p); UN.sort(byTime); }
    else M[+t.dataset.to].photos.push(p);
    if(!m.photos.length){ M.splice(M.indexOf(m),1); cur=Math.min(cur,M.length-1); }
    sel=null; picking=false; queueSave(); paint(); return; }
  if(t.dataset.a){
    const m=M[cur], inn=m.photos.filter(x=>!x.excluded), p=inn.find(x=>x.id===sel);
    const a=t.dataset.a, i=m.photos.indexOf(p);
    if(a==='move'){ picking=true; sheet(); return; }
    if(a==='see'){ zoom=inn.indexOf(p); sel=null; drawZoom(); paint(); return; }
    if(a==='up'&&i>0){ m.photos.splice(i,1); m.photos.splice(i-1,0,p); }
    if(a==='down'&&i<m.photos.length-1){ m.photos.splice(i,1); m.photos.splice(i+1,0,p); }
    if(a==='best'){ m.photos.forEach(x=>x.is_hero=false); p.is_hero=!p.is_hero; sel=null; }
    if(a==='out'){ p.excluded=true; sel=null; }
    queueSave(); paint(); return; }
  const back=t.closest('[data-back]');
  if(back){ const p=A.find(x=>x.id===back.dataset.back); p.excluded=false; queueSave(); paint(); return; }

  /* zoom (sort and answer) */
  const pc=t.closest('[data-playclip]');
  if(pc){ const inn=(M[cur]||{photos:[]}).photos.filter(x=>!x.excluded); const i=inn.findIndex(x=>x.url===pc.dataset.playclip);
    if(i>=0){ zoom=i; drawZoom(); const v=document.querySelector('#lb video'); if(v) v.play().catch(()=>{}); } return; }
  const pk=t.closest('[data-pick]');
  if(pk){ if(screen==='answer'&&isPick(TURN)&&!turnBusy){ const id=pk.dataset.pick;
      PICK=(PICK&&PICK.turn===TURN.turn_id&&PICK.id===id)?null:{turn:TURN.turn_id,id}; paintPick(); }
    return; }
  const z=t.closest('[data-zoom]');
  if(z){ zoom=+z.dataset.zoom; drawZoom(); return; }
  if(t.dataset.z){ const inn=M[cur].photos.filter(p=>!p.excluded);
    if(t.dataset.z==='close') zoom=null;
    if(t.dataset.z==='prev'&&zoom>0) zoom--;
    if(t.dataset.z==='next'&&zoom<inn.length-1) zoom++;
    drawZoom(); return; }
  if(t.id==='lb'||t.tagName==='IMG'&&t.closest('#lb')){ zoom=null; drawZoom(); return; }
  const c=t.closest('[data-p]');
  if(c&&screen==='organise'){ sel=sel===c.dataset.p?null:c.dataset.p; picking=false; paint(); return; }

  /* answer */
  if(t.id==='anext'){
    if(TURN&&TURN.done){ const next=M.findIndex((x,i)=>i>cur&&!finishedMem(x)); if(next>=0) gotoGroup(next); else paintAllDone(); scrollTo(0,0); return; }
    answerTurn(false); return; }
  if(t.id==='askip'){ answerTurn(true); return; }
  if(t.id==='fqnext'){ saveFilmQ(false); return; }
  if(t.id==='fqskip'){ saveFilmQ(true); return; }
  if(t.id==='aelse'){ answerTurn(true,true); return; }
  if(t.id==='aenough'){ closeMemory(); return; }
  if(t.id==='agroupnext'){ cur=+t.dataset.next; draft=''; arrive(); return; }
  if(t.id==='askmore'){ askMore(t); return; }
  if(t.id==='awrong'){ wrongOpen=!wrongOpen; paintTurn(); if(wrongOpen){ const f=$('what'); if(f) f.focus(); } return; }
  if(t.id==='awrongcancel'){ wrongOpen=false; whatDraft=''; paintTurn(); return; }
  if(t.id==='awrongsend'){ flagWrong(); return; }
  if(t.id==='tomusic'){ toMusic(); return; }
  /* the music */
  if(t.id==='gnext'){ translateGenre(); return; }
  if(t.id==='gyes'){ keepHeard(); return; }
  if(t.id==='glist'){ loadMusic().then(paintMusic); return; }
  if(t.id==='gdone'){ finishGenre(); return; }
  const gp=t.closest('[data-play]');
  if(gp){ playSample(gp.dataset.play,gp); return; }
  const gc=t.closest('[data-genre]');
  if(gc){ pickGenre(gc.dataset.genre); return; }
  const gv=t.closest('[data-voice]');
  if(gv){ pickVoice(gv.dataset.voice); return; }
});
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('[data-bp]');
  if(c&&screen==='board'){ e.dataTransfer.setData('text/plain',c.dataset.bp); e.dataTransfer.effectAllowed='move'; BSEL=c.dataset.bp; } });
document.addEventListener('dragover',e=>{ if(screen==='board'&&e.target.closest&&e.target.closest('[data-bg],[data-bun]')) e.preventDefault(); });
document.addEventListener('drop',e=>{ if(screen!=='board') return; const g=e.target.closest&&e.target.closest('[data-bg]'), u=e.target.closest&&e.target.closest('[data-bun]');
  const id=e.dataTransfer.getData('text/plain'); if(!id||(!g&&!u)) return; e.preventDefault();
  putIn(id,g?+g.dataset.bg:'un'); BSEL=null; queueSave(); paintBoard(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newg'){ e.preventDefault(); const b=$('addg'); if(b) b.click(); }
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.bg!==undefined&&screen==='board'){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter'&&e.target.id==='pname'){ e.preventDefault(); if(P.mode==='me') addMe(); else addPerson(); }
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.rel!==undefined){ e.preventDefault(); saveRelations(); }
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('anchor')){ e.preventDefault(); translateGenre(); }
  if(e.key==='Enter'&&e.target.id==='what'){ e.preventDefault(); flagWrong(); }
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.pick!==undefined){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.sung!==undefined){ e.preventDefault(); tryTake(+e.target.dataset.sung); }
});
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('anchor')){ G.answers[e.target.dataset.key]=e.target.value; return; }
  if(e.target.dataset&&e.target.dataset.sungtype!==undefined){ const x=NS.rows[+e.target.dataset.sungtype]; if(x) x.typed=e.target.value; return; }
  if(e.target.dataset&&e.target.dataset.saytype!==undefined){ const x=P.say[+e.target.dataset.saytype]; x.typed=e.target.value;
    const b=$('sayDone'); if(b) b.disabled=!P.say.every(y=>!y.needs||y.answer==='yes'||(y.answer==='no'&&y.typed.trim())); return; }
  if(e.target.dataset&&e.target.dataset.sung!==undefined){ const i=+e.target.dataset.sung, x=P.say[i]; x.sung=e.target.value;
    /* a different spelling than the one that's playing: the button becomes "Hear this spelling" */
    if(x.sung.trim()!==x.tried){ const cached=null; const row=e.target.closest('.person'); const btn=row&&row.querySelector('.play');
      if(btn){ btn.outerHTML=`<button class="play" type="button" data-trytake="${i}">Hear this spelling</button>`; const c=row.querySelector('[data-choosetake]'); if(c) c.remove(); } }
    return; }
  if(e.target.id==='nm'){ M[cur].title=e.target.value; queueSave(); if(screen==='organise') orgNav(); }
  if(e.target.id==='ans'){ draft=e.target.value; countUp();
    if(isPick(TURN)&&!turnBusy){ const b=$('anext'); if(b) b.disabled=!draft.trim(); } }
  if(e.target.id==='fqans'){ FQ.draft=e.target.value; const q=FQ.list[FQ.i]; if(q) q._draft=FQ.draft; }
  if(e.target.id==='what'){ whatDraft=e.target.value; const b=$('awrongsend'); if(b) b.disabled=!whatDraft.trim(); }
  if(e.target.id==='helpAsk'){ HELP.asked=e.target.value; }
});
window.addEventListener('beforeunload',e=>{
  if(dirty||failed){ e.preventDefault(); e.returnValue=''; }
});

route();
</script>
