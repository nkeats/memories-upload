<!--
  start.html - THE FRONT DOOR (Nigel 4 Oct 2026). A customer starts here with nobody to help: what the occasion is (only
  occasions marked active), their first name and email, a short plain-English privacy notice, then their own film
  (index.html?t=<their new token>). A ?ref=<code> on this link is carried through and recorded against the new film.
  Server (server-wanted-2026-10-04.sql):
    get_start_config()  -> {occasions:[{slug,label}] (active only), site_base_url, retention:{working_days, film_months}, notice_version}
    create_film(p_occasion, p_first_name, p_email, p_ref, p_website, p_notice_version) -> {token} | {error}
      - a clean name ("Wedding — Sam"), owner_name = the first name, collections.email, a fresh 64-hex token;
      - ABUSE without a CAPTCHA: p_website is a HONEYPOT (a field people never see - a filled one is refused); a limit on new
        films per email (per 24 hours) and on new films per hour overall (app_config, refused with "too many");
      - the privacy notice shown is recorded (consents 'privacy_notice', its version); a ?ref= code -> referrals.
  Every refusal answers HTTP 200 with {"error": ...}, like the other RPCs. No server answer (the RPCs not there yet) = a plain
  "not open yet" message, never a broken form. The link to their film is shown before they go to it, to keep (until film
  emails are switched on, nothing else sends it to them). Test: pipeline/page_tests_front "FRONT DOOR"; live: live_pages_check front.
  5 Oct (Nigel): TESTER INVITES. start.html?o=<occasion>&invite=<code> - friends test the questions for an occasion that is not
  public yet. check_invite(p_occasion, p_code) (server-wanted-2026-10-05.sql) -> {ok, occasion:{slug,label}} | {error}: valid ->
  only that occasion is offered, already chosen, with a line saying it is a test; create_film gets p_invite (the server checks it
  again and takes one use; the film is marked a tester film). Not valid / expired / used up -> said plainly, and the ordinary
  (active-only) choice is shown. The public page without an invite is unchanged. p_invite is only ever sent after check_invite
  answered ok, so the page works on a server without it. Codes: python -m pipeline.invites (Nigel's PC).
-->

<script id="preview-base">
/* 11 Oct PREVIEW: served from .../preview/, every link the page builds stays inside .../preview/ */
function __pv(b){ try{ return (b&&/\/preview\/[^/]*$/.test(location.pathname))?String(b).replace(/\/?$/,'/')+'preview/':b; }catch(e){ return b; } }
</script>

<script id="preview-note">
/* 11 Oct PREVIEW: the first time on this page, one line saying what a gold box is - "tap" on a touch screen, "click" on a
   computer, both when the page can't tell. */
(function(){
  var key='mf_goldnote_'+(location.pathname.split('/').pop()||'index.html');
  try{ if(localStorage.getItem(key)) return; }catch(e){}
  var coarse=false, fine=false;
  try{ coarse=matchMedia('(pointer:coarse)').matches; fine=matchMedia('(pointer:fine)').matches; }catch(e){}
  var how=(coarse&&!fine)?'tap it.':(fine&&!coarse)?'click it.':'tap it (or click it on a computer).';
  function show(){
    if(document.getElementById('goldnote')) return;
    var p=document.createElement('p'); p.id='goldnote'; p.className='goldnote';
    p.textContent='Anything in a gold box is a button - '+how;
    var w=document.querySelector('.wrap')||document.body; w.insertBefore(p,w.firstChild);
    try{ localStorage.setItem(key,'1'); }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',show); else show();
})();
</script>
<script id="a11y-focus">
/* 20 Oct (WCAG 2.2 AA - focus order 2.4.3, status messages 4.1.3; the US launch): when a screen is redrawn and the control that
   had the focus has gone, the focus moves to the new screen's heading - not lost to the top of the page - so a screen reader
   reads the new screen. Only when the heading is new (a screen that redraws itself is not read again), and never while the
   focus is still on something. */
(function(){
  var last='';
  function root(){ return document.getElementById('stage')||document.querySelector('.wrap'); }
  function fix(){
    var a=document.activeElement; if(a&&a!==document.body&&document.contains(a)) return;
    var st=root(), h=st&&st.querySelector('h1,h2'); if(!h) return;
    var t=(h.textContent||'').trim(); if(!t||t===last) return; last=t;
    if(!h.hasAttribute('tabindex')) h.setAttribute('tabindex','-1');
    try{ h.focus({preventScroll:true}); }catch(e){}
  }
  function start(){ var st=root(); if(!st||!window.MutationObserver) return; var tm=null;
    new MutationObserver(function(){ clearTimeout(tm); tm=setTimeout(fix,80); }).observe(st,{childList:true}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>

<div class="wrap"><div id="stage"><p class="lede">One moment…</p></div></div>
<script>
const SB='https://wkgkkxeooldeyzjfzmhu.supabase.co';
const KEY='sb_publishable_0HpiB8JZzbOq3Vd9lRjuXg_V_4jQnp_';
const HDR={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REF=(new URLSearchParams(location.search).get('ref')||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
const QS=new URLSearchParams(location.search);
const INVITE=(QS.get('invite')||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);
const OPARAM=(QS.get('o')||'').trim().toLowerCase().replace(/[^a-z-]/g,'').slice(0,40);
let INV=null, INV_MSG='';                                         // INV = {code, slug, label} once check_invite said ok
async function rpc(name,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:HDR,body:JSON.stringify(args||{})});
  if(!r.ok) throw Object.assign(new Error(`${name}: HTTP ${r.status}`),{status:r.status});
  const t=await r.text(); return t?JSON.parse(t):null;
}
function report(what,e){
  try{ fetch(SB+'/functions/v1/flow',{method:'POST',keepalive:true,headers:HDR,body:JSON.stringify({token:'',action:'report_error',
    page:'start.html',at:what,what,message:(e&&e.message)||String(e||''),url:location.origin+location.pathname,user_agent:navigator.userAgent})}).catch(()=>{}); }catch(_){}
}
window.addEventListener('error',ev=>report('uncaught',ev.error||ev.message));
window.addEventListener('unhandledrejection',ev=>report('unhandled promise',ev.reason));

let C=null, OCC=null, BUSY=false;
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

/* 7 Oct: an occasion's own line from the server (occasions.start_note) - e.g. Valentine's: "For a couple who are already
   together - a film about the two of you." Shown when that occasion is chosen; nothing for one without a note. */
function occNote(){ const o=(C.occasions||[]).find(x=>x.slug===OCC); return (o&&o.note)||''; }
/* 8 Oct: an honest line near an occasion's own day, from the server's dates (occasions.warn_from / finish_by / late_after,
   occasion_timing): "To have it for 14 February, finish your answers by 12 February." / "Starting now? Your film will most
   likely arrive after Valentine's Day." Nothing when the server says nothing. */
function dayMonth(iso){ const d=new Date(String(iso)+'T12:00:00Z'); return isNaN(d)?'':d.toLocaleDateString('en-GB',{day:'numeric',month:'long',timeZone:'UTC'}); }
function occTiming(){
  const o=(C.occasions||[]).find(x=>x.slug===OCC), t=o&&o.timing; if(!t) return '';
  if(t.kind==='late') return `Starting now? Your film will most likely arrive after ${o.label}.`;
  if(t.kind==='finish_by'&&t.by&&t.day) return `To have it for ${dayMonth(t.day)}, finish your answers by ${dayMonth(t.by)}.`;
  return '';
}
/* 17 Oct: THE ORDER-BY PROMISE - only what the film queue can actually keep (the server's occasion_promise: the occasion's own
   dates, never hard-coded, and the PC queue measured against finish_by). Promised: "Order by 10 February to have your film by
   Valentine's Day." Not any more: the honest date, before they pay. No answer from the server: the timing line as before. */
const PROMISE={};
async function loadPromise(slug){
  if(!(slug in PROMISE)){ try{ PROMISE[slug]=await rpc('occasion_promise',{p_slug:slug}); }catch(e){ PROMISE[slug]=null; } }
  if(slug!==OCC) return;
  const p=PROMISE[slug], tm=$('occtiming'), o=(C.occasions||[]).find(x=>x.slug===slug);
  if(!tm||!p||!p.order_by||!o) return;
  if(p.can_promise) tm.textContent=`Order by ${dayMonth(p.order_by)} to have your film by ${o.label}.`;
  else if(p.ready_by) tm.textContent=`Start now and your film will most likely be ready by ${dayMonth(p.ready_by)}`+
    (p.day&&p.ready_by>p.day?` - after ${o.label}.`:'.');
}
function form(){
  const r=C.retention||{};
  $('stage').innerHTML=`<h1>Turn your memories into a film, with its own song</h1>
    <p class="do">Your photographs, your stories, and a song written from what you tell us. It takes about half an hour, and you can stop and come back.</p>
    ${INV?`<div class="box" id="invite"><h2>You’re testing ${esc(INV.label)}</h2><p class="lede" style="margin:0">Thank you for helping us try out the questions for ${esc(INV.label.toLowerCase())} films before they’re open to everyone. Everything else works just as it will for customers.</p></div>`
      :INV_MSG?`<div class="box" id="invite"><p class="err" style="margin:0">${esc(INV_MSG)}</p></div>`:''}
    <div class="box"><h2>What is it for?</h2>
      <div class="occ" role="group" aria-label="The occasion">${C.occasions.map(o=>`<button type="button" data-occ="${esc(o.slug)}" aria-pressed="${OCC===o.slug}">${esc(o.label)}</button>`).join('')}</div>
      <p class="small" id="occnote" style="margin:10px 0 0">${esc(occNote())}</p>
      <p class="small" id="occtiming" style="margin:6px 0 0;color:var(--goldtext,var(--brass,#d4a24c))">${esc(occTiming())}</p></div>
    <div class="box"><h2>About you</h2>
      <label for="fname">Your first name</label>
      <input class="t" id="fname" maxlength="40" autocomplete="given-name" autocapitalize="words">
      <label for="email">Your email</label>
      <input class="t" id="email" type="email" maxlength="254" autocomplete="email" inputmode="email">
      <p class="small" style="margin-top:8px">We use it only for your film — to send you its link and the film itself. Never for anything else unless you ask.</p>
      <p class="small" id="junknote" style="margin-top:8px"><b>Your link comes by email from hello@singmeamemory.com.</b> If it isn’t in your inbox in a minute or two, please look in your junk or spam folder.</p>
      <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    </div>
    <div class="box notice" id="notice"><h2>Your privacy, in plain words</h2>
      <ul>
        <li><b>What you give us:</b> your name and email, your photographs and video clips, and your answers to our questions.</li>
        <li><b>What we do with it:</b> make your film and its song — nothing else. We never sell it, and never use it in advertising (the only exception is a reaction video, if you later choose to share one under its own agreement).</li>
        <li><b>Who helps us make it:</b> Supabase (stores it securely), Anthropic (our AI reads your photos and answers to write the words) and ElevenLabs (sings the song). They work for us under contract and may process it outside Australia.</li>
        <li><b>How long we keep it:</b> your film page - the film, its words, your photos and your answers - for ${esc(r.film_days||r.working_days||90)} days after we deliver your film, so you can download it. Then we delete everything. We email you a reminder before it goes.</li>
        <li><b>Sharing your film:</b> download it and send it from your own device - we don't host films for sharing.</li>
        <li><b>Your choice, always:</b> you can download everything, or delete everything, at any time from your film's page.</li>
      </ul>
      <p style="margin:0">Questions? <a href="mailto:hello@singmeamemory.com" style="color:var(--brass)">hello@singmeamemory.com</a></p></div>
    <button class="go" id="go" disabled>Start my film</button>
    <p class="err hide" id="err" role="alert"></p>
    <p class="small" style="margin-top:12px">By starting, you agree we may use what you give us to make your film, as above.</p>`;
  ['fname','email'].forEach(id=>$(id).addEventListener('input',ready));
  // 20 Oct (WCAG 2.2 AA, keyboard): Enter in either box starts the film, as a form would - once everything is filled in
  ['fname','email'].forEach(id=>$(id).addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.isComposing){ ev.preventDefault(); start(); } }));
  ready();
}
function ready(){
  const ok=!!OCC && ($('fname').value||'').trim().length>0 && EMAIL.test(($('email').value||'').trim());
  $('go').disabled=!ok||BUSY; return ok;
}
function fail(msg){ const e=$('err'); e.textContent=msg; e.classList.remove('hide'); }
const SAY={
  'too many':'You’ve started several films in a short time. Please try again in a little while, or email hello@singmeamemory.com and we’ll help.',
  'bad email':'That email address doesn’t look right. Please check it.',
  'bad name':'Please type your first name (letters only).',
  'unknown occasion':'Please choose what your film is for.',
  'not accepted':'Something went wrong starting your film. Please try again, or email hello@singmeamemory.com.',
  'invite not valid':'This invite link doesn’t work. Please check you have the whole link, or ask the person who sent it.',
  'invite expired':'This invite link has expired. Please ask the person who sent it for a new one.',
  'invite used up':'This invite link has been used as many times as it allows. Please ask the person who sent it for a new one.'};
async function start(){
  if(!ready()||BUSY) return;
  BUSY=true; $('go').disabled=true; $('go').textContent='Starting your film…'; $('err').classList.add('hide');
  try{
    const r=await rpc('create_film',{p_occasion:OCC,p_first_name:$('fname').value.trim(),p_email:$('email').value.trim(),
      p_ref:REF||null,p_website:$('website').value,p_notice_version:C.notice_version||null,...(INV?{p_invite:INV.code}:{})});
    if(!r||r.error||!r.token){ BUSY=false; $('go').textContent='Start my film'; ready(); fail(SAY[(r&&r.error)||'']||SAY['not accepted']);
      if(r&&r.error&&!SAY[r.error]) report('create_film',new Error(r.error)); return; }
    try{ if(REF) localStorage.setItem('mf_ref_done_'+r.token,REF); }catch(_){}           // recorded by create_film - index.html need not
    try{ fetch(`${SB}/functions/v1/notify`,{method:'POST',headers:HDR,body:JSON.stringify({action:'welcome',token:r.token})}).catch(()=>{}); }catch(_){}   // the link by email (off until switched on)
    done(r.token);
  }catch(e){ report('create_film',e); BUSY=false; $('go').textContent='Start my film'; ready(); fail('That didn’t go through. Please check your connection and try again.'); }
}
function done(token){
  /* 11 Oct PREVIEW (Nigel 5 Oct: "The link will confuse people ... it needs to be emailed directly to them"): no raw link, no
     copying, no bookmarking - the link is in their email; one big button now; "Send it again" (at most 3 a day, notify v4). */
  const base=(__pv(C.site_base_url)||new URL('.',location.href).href).replace(/\/?$/,'/');

      <button class="b" id="resend" type="button">Didn’t get it? Send it again</button>
      <p class="small" id="resendmsg" role="status" style="margin:10px 0 0"></p></div>`;
  $('open').dataset.href=link;
  $('open').addEventListener('click',()=>{ location.href=link; });
  $('resend').addEventListener('click',async()=>{
    const b=$('resend'), m=$('resendmsg'); b.disabled=true; m.textContent='Sending…';

    else if(r&&r.why==='limit'){ m.textContent='We’ve already sent it 3 times today. Please check your junk folder, or email hello@singmeamemory.com and we’ll help.'; }
    else{ m.textContent='We couldn’t send it just now. Please try again in a minute, or email hello@singmeamemory.com and we’ll help.'; }
    b.disabled=false;
  });
}
