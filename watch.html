<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="build" content="2026-10-06a">
<title>A film for you</title>
<!--
  watch.html?s=<share token> - WATCH ONLY (Nigel 6 Oct 2026: "Share with family"). The owner's own link (film.html / index.html
  ?t=) can change the film, invite people and delete everything, so it is never handed out; this one can only play the film.
  The 'watch' edge function (Song/watch-v1.ts) answers {url} - a signed link to the film for 2 hours - only for an active share
  link on a delivered film inside its 12 months. This page shows the film and NOTHING else: no photos, no answers, no names, no
  offers, no buttons, no links; noindex and no referrer. Test: Song/pipeline/page_tests_06 "WATCH ONLY".
-->
<style>
:root{--ink:#0C0D10;--fg:#F4F1EA;--fg2:#9BA0AB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;height:100%}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
video{width:100%;max-width:1100px;max-height:90vh;background:#000;border-radius:8px;display:block}
p{color:var(--fg2);font-size:17px;line-height:1.6;text-align:center;max-width:40ch}
</style>
</head>
<body>
<div class="wrap" id="stage"><p>One moment…</p></div>
<script>
const SB='https://wkgkkxeooldeyzjfzmhu.supabase.co';
const KEY='sb_publishable_0HpiB8JZzbOq3Vd9lRjuXg_V_4jQnp_';
const S=(new URLSearchParams(location.search).get('s')||'').toLowerCase().replace(/[^0-9a-f]/g,'').slice(0,64);
const stage=document.getElementById('stage');
function say(t){ const p=document.createElement('p'); p.textContent=t; stage.replaceChildren(p); }
(async()=>{
  if(S.length!==64){ say('This link doesn’t work. Please ask the person who sent it for a new one.'); return; }
  try{
    const r=await fetch(`${SB}/functions/v1/watch`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({s:S})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.url){ say(j.error==='this film is no longer available'?'This film is no longer available.':'This link doesn’t work. Please ask the person who sent it for a new one.'); return; }
    const v=document.createElement('video');
    v.controls=true; v.playsInline=true; v.preload='metadata'; v.src=j.url; v.id='film';
    v.setAttribute('controlsList','nodownload'); v.disablePictureInPicture=false;
    stage.replaceChildren(v);
  }catch(e){ say('Something went wrong opening the film. Please try again in a minute.'); }
})();
</script>
</body>
</html>
